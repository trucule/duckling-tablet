# Use this if Pitch Jam is served by nginx. /etc/nginx/sites-available/ducklingtablet.conf, then:
#   ln -s /etc/nginx/sites-available/ducklingtablet.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#   certbot --nginx -d api.ducklingtablet.com -d parents.ducklingtablet.com -d app.ducklingtablet.com -d ducklingtablet.com -d www.ducklingtablet.com
server {
    listen 80;
    server_name api.ducklingtablet.com;
    client_max_body_size 200m;   # app packages from the publish tool
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name parents.ducklingtablet.com;
    root /opt/duckling/www/portal;
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
}
server {
    listen 80;
    server_name app.ducklingtablet.com;
    root /opt/duckling/www/app;
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
}
server {
    listen 80;
    server_name ducklingtablet.com www.ducklingtablet.com;
    root /opt/duckling/www/site;
    location / { try_files $uri $uri.html $uri/ =404; }
    # The setup video: browsers load the captions track only as text/vtt. Files carry ?v= when they change.
    location /video/ { types { video/mp4 mp4; text/vtt vtt; image/jpeg jpg; } add_header Cache-Control "public, max-age=604800"; }
}
