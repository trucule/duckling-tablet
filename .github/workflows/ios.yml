# Builds the iPad app. Without the App Store Connect key it compiles for the
# simulator only (no signing), which checks every change. With the key in the repository secrets (ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_KEY_P8), the same run archives a signed build and uploads it to App Store Connect, where it
# appears in TestFlight. The export signs with the team's cloud-managed distribution certificate through the key.
# Runs only when started by hand (Actions tab > the workflow > Run workflow, or gh workflow run), so no push spends Actions minutes. macOS minutes count ten times.
name: iOS

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip the simulator tests (for a release build of code whose tests already passed)
        type: boolean
        default: false

jobs:
  build:
    # Xcode 27.1 and the iOS 27.1 SDK, which App Store builds need from 2026-11 on. GitHub's xcode-27 image has it.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile for the simulator (no signing)
        working-directory: ios
        run: |
          xcodebuild -project DucklingTablet.xcodeproj -scheme DucklingTablet -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:|fatal" "$RUNNER_TEMP/build.log" | sort -u | head -60; tail -n 30 "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E "warning:" "$RUNNER_TEMP/build.log" | grep -v "SourcePackages" | sort -u | head -30 || true
          tail -n 3 "$RUNNER_TEMP/build.log"
      - name: Test on an iPad simulator
        if: ${{ !inputs.skip_tests }}
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPad' in x['name']))")
          # The microphone test needs the simulator's microphone granted to the app, as a parent would on the iPad.
          xcrun simctl boot "$SIM" || true
          xcrun simctl privacy "$SIM" grant microphone com.ducklingtablet.app || true
          # 25 minutes at most: a hung test host (an XPC call with no daemon in the simulator) otherwise holds the
          # runner for hours and the log is lost with the cancel.
          perl -e 'alarm shift; exec @ARGV' 1500 \
            xcodebuild -project DucklingTablet.xcodeproj -scheme DucklingTablet -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/test.log" 2>&1 \
            || { grep -E "error:|failed|XCTAssert|MIC-PROBE" "$RUNNER_TEMP/test.log" | sort -u | head -60; tail -n 40 "$RUNNER_TEMP/test.log"; exit 1; }
          grep -E "MIC-PROBE" "$RUNNER_TEMP/test.log" | head -3 || true
          grep -E "Test Case .*(passed|failed)|Executed" "$RUNNER_TEMP/test.log" | tail -n 12
      - name: Archive and upload to App Store Connect
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != ''
        working-directory: ios
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          # The archive is built unsigned (a signed archive would need a development profile, and so a registered
          # device). The export signs it for the App Store with the team's cloud-managed distribution certificate.
          # The build number is the run number plus 10: builds uploaded from a Mac (up to 26 on 2026-11-18) used numbers
          # the runs had not reached, and App Store Connect refuses a build number it already has.
          BUILD=$(( ${{ github.run_number }} + 10 ))
          echo "Build number $BUILD"
          xcodebuild -version
          xcodebuild -project DucklingTablet.xcodeproj -scheme DucklingTablet -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Duckling.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD CODE_SIGNING_ALLOWED=NO \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:|fatal" "$RUNNER_TEMP/archive.log" | sort -u | head -60; tail -n 30 "$RUNNER_TEMP/archive.log"; exit 1; }
          # The export takes the app's entitlements from its signature, so the archived app gets a local signature
          # (no certificate) that carries them: nested code first, then the app.
          APP="$RUNNER_TEMP/Duckling.xcarchive/Products/Applications/DucklingTablet.app"
          find "$APP" -depth \( -name "*.framework" -o -name "*.bundle" -o -name "*.dylib" \) -print0 | xargs -0 -I{} codesign --force --sign - {}
          # The monitor extension carries Family Controls and the app group too (DucklingMonitor/DucklingMonitor.entitlements).
          for X in "$APP"/PlugIns/*.appex; do codesign --force --sign - --entitlements DucklingMonitor/DucklingMonitor.entitlements "$X"; done
          codesign --force --sign - --entitlements DucklingTablet/DucklingTablet.entitlements "$APP"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>TYLH4H8TS8</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          # First an export to disk, to check the signed app carries the Family Controls entitlement; then the upload.
          sed 's|<string>upload</string>|<string>export</string>|' "$RUNNER_TEMP/ExportOptions.plist" > "$RUNNER_TEMP/ExportLocal.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Duckling.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" -exportPath "$RUNNER_TEMP/local" $AUTH > "$RUNNER_TEMP/local.log" 2>&1 \
            || { grep -E "error|Error" "$RUNNER_TEMP/local.log" | sort -u | head -40; tail -n 40 "$RUNNER_TEMP/local.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/local/*.ipa -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements - --xml "$RUNNER_TEMP/ipa/Payload/DucklingTablet.app" 2>/dev/null > "$RUNNER_TEMP/ent.plist"
          echo "Entitlements of the signed app:"; plutil -p "$RUNNER_TEMP/ent.plist"
          grep -q "com.apple.developer.family-controls" "$RUNNER_TEMP/ent.plist" || { echo "The Family Controls entitlement is missing."; exit 1; }
          # App Review also reads the embedded provisioning profile: it must list the entitlement too, and the profile
          # must be a fresh one, made after Family Controls (Distribution) was enabled on the App ID.
          security cms -D -i "$RUNNER_TEMP/ipa/Payload/DucklingTablet.app/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          echo "Profile: $(plutil -extract Name raw "$RUNNER_TEMP/profile.plist"), created $(plutil -extract CreationDate raw "$RUNNER_TEMP/profile.plist")"
          echo "Profile entitlements:"; plutil -extract Entitlements xml1 -o - "$RUNNER_TEMP/profile.plist" | plutil -p -
          plutil -extract Entitlements xml1 -o - "$RUNNER_TEMP/profile.plist" | grep -q "com.apple.developer.family-controls" || { echo "The provisioning profile lacks the Family Controls entitlement."; exit 1; }
          # The same for the monitor extension: its App ID (com.ducklingtablet.app.monitor) needs Family Controls and the
          # app group enabled in the developer portal, or the export above fails or signs it without them.
          for X in "$RUNNER_TEMP"/ipa/Payload/DucklingTablet.app/PlugIns/*.appex; do
            codesign -d --entitlements - --xml "$X" 2>/dev/null > "$RUNNER_TEMP/ent-ext.plist"
            echo "Entitlements of $(basename "$X"):"; plutil -p "$RUNNER_TEMP/ent-ext.plist"
            grep -q "com.apple.developer.family-controls" "$RUNNER_TEMP/ent-ext.plist" || { echo "$(basename "$X") lacks the Family Controls entitlement."; exit 1; }
            grep -q "group.com.ducklingtablet.app" "$RUNNER_TEMP/ent-ext.plist" || { echo "$(basename "$X") lacks the app group."; exit 1; }
          done
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Duckling.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -E "error|Error" "$RUNNER_TEMP/export.log" | sort -u | head -40; tail -n 40 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/export.log"
          rm -f "$KEY"
