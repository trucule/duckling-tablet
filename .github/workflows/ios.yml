# Builds the iPad app on every push that touches ios/. Without the App Store Connect key it compiles for the
# simulator only (no signing), which checks every change. With the key in the repository secrets (ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_KEY_P8), the same run archives a signed build and uploads it to App Store Connect, where it
# appears in TestFlight. Xcode signs with the team's cloud-managed certificate (automatic signing through the key).
name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile for the simulator (no signing)
        working-directory: ios
        run: |
          xcodebuild -project DucklingTablet.xcodeproj -scheme DucklingTablet -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:|fatal" "$RUNNER_TEMP/build.log" | sort -u | head -60; tail -n 30 "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E "warning:" "$RUNNER_TEMP/build.log" | grep -v "SourcePackages" | sort -u | head -30 || true
          tail -n 3 "$RUNNER_TEMP/build.log"
      - name: Archive and upload to App Store Connect
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != ''
        working-directory: ios
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project DucklingTablet.xcodeproj -scheme DucklingTablet -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Duckling.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:|fatal" "$RUNNER_TEMP/archive.log" | sort -u | head -60; tail -n 30 "$RUNNER_TEMP/archive.log"; exit 1; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>TYLH4H8TS8</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Duckling.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH 2>&1 | tail -n 40
          rm -f "$KEY"
