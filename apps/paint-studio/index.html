<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Paint Studio</title>
<style>
  :root { --bar: #2b2f3a; --bar2: #363b49; --ink: #f4f6fb; --dim: #aab1c4; --acc: #ffd36b; --acc2: #8fd6ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1e212a; color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  /* The top right corner (210 by 72 px) stays clear for Duckling's Home button: the top bar stops short of it and the
     page actions sit in a column on the right, below it (tools/pill-check.mjs). */
  #app { display: grid; grid-template-columns: 76px 1fr 68px; grid-template-rows: 60px 1fr; height: 100%; }
  #top { grid-column: 1 / 4; background: var(--bar); display: flex; align-items: center; gap: 8px; padding: 0 214px 0 10px; border-bottom: 1px solid #0007; overflow: hidden; }
  #side { grid-column: 3; grid-row: 2; background: var(--bar); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 4px 8px; overflow-y: auto; border-left: 1px solid #0007; }
  #side .btn { width: 56px; height: 48px; padding: 0; justify-content: center; }
  #side .sep { width: 40px; height: 1px; margin: 2px 0; }
  #tools { grid-column: 1; grid-row: 2; background: var(--bar); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; overflow-y: auto; border-right: 1px solid #0007; }
  #stage { grid-column: 2; grid-row: 2; position: relative; background: #3a3f4e; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #view { background: #fff; box-shadow: 0 6px 30px #0008; touch-action: none; cursor: crosshair; }
  .tool { width: 64px; height: 52px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
  .tool svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool.on { background: var(--acc); color: #222; }
  .tool:active { transform: scale(0.95); }
  .btn { height: 40px; min-width: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--bar2); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn.on { background: var(--acc2); color: #123; }
  .btn:disabled { opacity: 0.35; }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .sep { width: 1px; height: 36px; background: #0006; margin: 0 2px; flex: none; }
  .grow { flex: 1; }
  #swatch { width: 40px; height: 40px; border-radius: 10px; border: 3px solid #fff4; cursor: pointer; flex: none; }
  #palette { display: flex; gap: 3px; flex-wrap: wrap; width: 246px; }
  #palette i { display: block; width: 24px; height: 17px; border-radius: 4px; cursor: pointer; border: 1px solid #0004; }
  .slider { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--dim); width: 72px; }
  .slider input { width: 72px; margin: 0; }
  input[type=range] { accent-color: var(--acc); height: 22px; }
  .layers { display: flex; gap: 3px; }
  .layers .btn { min-width: 34px; padding: 0 8px; }
  .layers .btn.hid { text-decoration: line-through; opacity: 0.55; }
  #panel { position: absolute; left: 12px; top: 12px; background: var(--bar); border-radius: 14px; padding: 12px; box-shadow: 0 10px 30px #0008; display: none; z-index: 5; max-width: 420px; }
  #panel.open { display: block; }
  #panel h3 { margin: 0 0 8px; font-size: 14px; color: var(--dim); font-weight: 600; }
  #wheel { display: block; width: 260px; height: 260px; touch-action: none; cursor: crosshair; }
  .wheelrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--dim); }
  #mixswatch { width: 44px; height: 44px; border-radius: 10px; border: 2px solid #fff4; flex: none; }
  #hex { width: 96px; height: 36px; border-radius: 8px; border: 1px solid #0006; background: #1e212a; color: var(--ink); font: 600 15px ui-monospace, monospace; padding: 0 8px; text-transform: uppercase; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; max-width: 260px; min-height: 24px; }
  .chips i { display: block; width: 24px; height: 24px; border-radius: 6px; border: 1px solid #0004; cursor: pointer; }
  .chips .label { width: 100%; font-size: 11px; color: var(--dim); }
  .adv[hidden] { display: none !important; }
  #zoomfit { position: absolute; right: 12px; bottom: 12px; z-index: 3; display: none; }
  #zoomfit.show { display: inline-flex; }
  #lock.on { background: var(--acc); color: #222; }
  #mirrors { position: absolute; right: 12px; top: 12px; background: var(--bar); border-radius: 14px; padding: 12px; box-shadow: 0 10px 30px #0008; display: none; z-index: 5; width: 360px; }
  #mirrors.open { display: block; }
  #mirrors h3 { margin: 8px 0 6px; font-size: 13px; color: var(--dim); font-weight: 600; }
  #mirrors .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #mirrors .btn { flex-direction: column; height: 62px; font-size: 11px; padding: 4px; gap: 2px; justify-content: center; }
  #mirrors .btn svg { width: 26px; height: 26px; }
  #prompt { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: #fff; color: #222; border-radius: 14px; padding: 10px 16px; font-size: 17px; box-shadow: 0 8px 24px #0006; display: none; align-items: center; gap: 12px; max-width: 90%; z-index: 4; }
  #prompt.open { display: flex; }
  #prompt .btn { background: var(--acc); color: #222; }
  #prompt .btn.quiet { background: #eee; }
  #badge { font-size: 12px; color: var(--dim); white-space: nowrap; }
  #gallery { position: absolute; inset: 0; background: #1e212aee; display: none; flex-direction: column; padding: 16px; z-index: 6; overflow: auto; }
  #gallery.open { display: flex; }
  #gallery .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  #gallery h2 { margin: 0; font-size: 20px; flex: 1; }
  #shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  #shots .shot { background: #fff; border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; }
  #shots img { width: 100%; display: block; aspect-ratio: 8 / 5; object-fit: cover; }
  #shots .del { position: absolute; right: 6px; top: 6px; background: #0008; color: #fff; border: 0; border-radius: 8px; padding: 4px 8px; cursor: pointer; }
  #shots .del.bg { top: auto; bottom: 6px; left: 6px; right: auto; background: #ffd36bee; color: #222; font-weight: 700; }
  /* A bar across the top of the page while words are typed (a tablet keyboard covers the bottom of the screen); it
     moves to the bottom when the words are near the top, so it never covers them. */
  #textpanel { position: absolute; left: 12px; right: 12px; top: 12px; background: var(--bar); border-radius: 14px; padding: 10px; box-shadow: 0 10px 30px #0008; display: none; z-index: 5; }
  #textpanel.open { display: block; }
  #textpanel.low { top: auto; bottom: 12px; }
  #textpanel .row { display: flex; gap: 8px; align-items: stretch; }
  #textInput { flex: 1; height: 52px; resize: none; border-radius: 10px; border: 1px solid #0006; background: #fff; color: #222; font: 22px "Segoe UI", system-ui, sans-serif; padding: 10px 12px; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
  #textpanel .row .btn { height: 52px; }
  #fonts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(92px, 1fr); gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: thin; }
  #fonts .btn.more { background: var(--acc2); color: #123; }
  #fonts .btn.more small { color: #234; }
  #fontlib { position: absolute; inset: 0; background: #1e212af2; display: none; flex-direction: column; padding: 14px 16px; z-index: 6; }
  #fontlib.open { display: flex; }
  #fontlib .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #fontlib h2 { margin: 0; font-size: 20px; }
  #fontSearch { flex: 1; min-width: 160px; max-width: 320px; height: 40px; border-radius: 10px; border: 1px solid #0006; background: #fff; color: #222; font-size: 17px; padding: 0 12px; user-select: text; -webkit-user-select: text; }
  #fontGroups { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  #fontGroups .btn.on { background: var(--acc); color: #222; }
  #fontTiles { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 8px; align-content: start; padding-bottom: 8px; }
  .ftile { height: 52px; border: 0; border-radius: 10px; background: #fff; cursor: pointer; position: relative; padding: 0; overflow: hidden; }
  .ftile i { position: absolute; left: 8px; top: 10px; width: 160px; height: 32px; background-repeat: no-repeat; }
  .ftile span { position: absolute; left: 10px; right: 10px; top: 0; bottom: 0; display: none; align-items: center; color: #222; font-size: 15px; text-align: left; white-space: nowrap; overflow: hidden; }
  .ftile.text span { display: flex; }
  .ftile.text i { display: none; }
  .ftile.on { outline: 4px solid var(--acc); }
  .ftile.away { opacity: 0.45; }
  .ftile.busy::after { content: ''; position: absolute; right: 8px; top: 16px; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #3aa0ff; border-right-color: transparent; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #fontNote { color: var(--dim); font-size: 14px; margin: 0 0 8px; min-height: 18px; }
  #fonts .btn { height: 52px; flex-direction: column; gap: 0; justify-content: center; padding: 2px 4px; font-weight: 400; min-width: 0; }
  #fonts .btn b { font-size: 22px; line-height: 1.1; font-weight: 400; }
  #fonts .btn small { font: 10px "Segoe UI", system-ui, sans-serif; color: var(--dim); white-space: nowrap; }
  #fonts .btn.on { background: var(--acc); color: #222; }
  #fonts .btn.on small { color: #444; }
  /* Spanish font labels are longer (Máquina de escribir); the bar scrolls sideways, so the columns can be wider. */
  html[lang=es] #fonts { grid-auto-columns: minmax(112px, 1fr); }
  #toast { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: #fff; color: #222; padding: 8px 16px; border-radius: 12px; font-weight: 600; display: none; z-index: 7; box-shadow: 0 6px 20px #0006; }
  #stars { font-size: 14px; color: var(--acc); white-space: nowrap; font-weight: 700; padding: 4px 0; }
  #promptLevel { font-size: 12px; color: #667; display: block; }
  @media (max-width: 1300px) { #palette { width: 165px; } #palette i { width: 24px; height: 14px; } .slider { width: 56px; } .slider input { width: 56px; } }
  @media (max-height: 720px) { .tool { height: 44px; font-size: 10px; } .tool svg { width: 22px; height: 22px; } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="swatch" title="Mix a color"></div>
    <div id="palette"></div>
    <div class="sep"></div>
    <label class="slider">size <input id="size" type="range" min="1" max="90" value="12"></label>
    <label class="slider">strength <input id="alpha" type="range" min="5" max="100" value="100"></label>
    <label class="slider adv">soft <input id="soft" type="range" min="0" max="100" value="0"></label>
    <label class="slider adv">steady <input id="steady" type="range" min="0" max="100" value="0"></label>
    <div class="sep"></div>
    <button class="btn" id="mirror" title="Mirror"><svg viewBox="0 0 24 24"><path d="M12 3v18M4 7l5 5-5 5M20 7l-5 5 5 5"/></svg></button>
    <div class="layers" id="layers"></div>
    <button class="btn adv" id="lock" title="Lock transparency: paint only where this layer already has paint"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  </div>
  <div id="tools"></div>
  <div id="side">
    <span id="stars">★ 0</span>
    <button class="btn" id="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="btn" id="redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <div class="sep"></div>
    <button class="btn" id="challenge" title="Challenge" aria-label="Challenge"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
    <button class="btn" id="newPage" title="New page" aria-label="New page"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6"/></svg></button>
    <button class="btn" id="save" title="Save to gallery" aria-label="Save to gallery"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/><path d="M8 21v-7h8v7"/></svg></button>
    <button class="btn" id="open" title="Gallery" aria-label="Gallery"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg></button>
  </div>
  <div id="stage">
    <canvas id="view" width="1280" height="800"></canvas>
    <div id="panel">
      <h3>Mix a color</h3>
      <canvas id="wheel" width="520" height="520"></canvas>
      <div class="wheelrow"><div id="mixswatch"></div><span class="adv">#</span><input id="hex" class="adv" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Color code"></div>
      <div class="chips" id="recent"><span class="label">Recent</span></div>
      <div class="chips adv" id="saved"><span class="label">My colors</span></div>
      <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end"><button class="btn adv" id="keepColor">Keep this color</button><button class="btn" id="mixDone">Done</button></div>
    </div>
    <div id="textpanel" aria-label="Text">
      <div class="row">
        <textarea id="textInput" rows="1" maxlength="120" spellcheck="false" autocomplete="off" aria-label="Words" placeholder="Type your words, then drag them where they go"></textarea>
        <button class="btn" id="textCancel">Cancel</button><button class="btn" id="textDone" style="background:var(--acc);color:#222">Done</button>
      </div>
      <div id="fonts"></div>
    </div>
    <div id="fontlib" aria-label="More fonts">
      <div class="head"><h2>More fonts</h2><input id="fontSearch" type="search" placeholder="Find a font" aria-label="Find a font" autocomplete="off" spellcheck="false"><span class="grow"></span><button class="btn" id="fontlibClose">Back to my words</button></div>
      <div id="fontGroups"></div>
      <p id="fontNote" role="status"></p>
      <div id="fontTiles"></div>
    </div>
    <button class="btn" id="zoomfit">Fit the page</button>
    <div id="mirrors"></div>
    <div id="prompt"><span><span id="promptLevel"></span><span id="promptText"></span></span><button class="btn quiet" id="promptSkip">Another</button><button class="btn" id="promptDone">Done!</button></div>
    <div id="gallery">
      <div class="head"><h2>My paintings</h2><button class="btn" id="galleryClose">Back to painting</button></div>
      <div id="shots"></div>
    </div>
    <div id="toast"></div>
  </div>
</div>
<script>

// drawing, three layers, undo, a gallery kept on the tablet, and art challenges by grade (docs/ladders.md). Every
// stroke is a run of stamps on the active layer; the layers are composited onto the visible canvas after each one.
const $ = (id) => document.getElementById(id);
const W = 1280, H = 800;
const view = $('view'), vctx = view.getContext('2d');
const STORE = 'paint-studio';

// ---- Text ------------------------------------------------------------------------------------------------------------

  { id: 'pacifico', name: 'Fancy' }, { id: 'bungee', name: 'Block' }, { id: 'permanent-marker', name: 'Marker' },

// ---- Font library -----------------------------------------------------------------------------------------------------
// About a thousand more fonts on the Duckling server (GET /fonts/library.json, preview sheets, one .woff2 per font).
// The list and the previews load when the page opens; a font downloads the first time it is picked and is kept on the
// tablet (IndexedDB), so it works offline after that. Without the internet the kept fonts still show under Mine.
const LIB_API = ((window.KidTablet && KidTablet.apiUrl) || 'https://api.ducklingtablet.com').replace(/\/$/, '');

  try {
    const r = indexedDB.open('paint-studio-fonts', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('files'); r.result.createObjectStore('meta'); };
    r.onsuccess = () => resolve(r.result); r.onerror = () => resolve(null);

const keptFonts = (async () => {

  for (const r of recentFonts.filter((r) => kept.includes(r.id))) {
    try { await addFace(r, await idb('files', 'readonly', (s) => s.get(r.id))); } catch (e) { /* a damaged copy downloads again */ }
  }

})();

}
function closeLibrary() { $('fontlib').classList.remove('open'); if (draft) $('textInput').focus(); }
$('fontlibClose').onclick = closeLibrary;
function renderGroups() {

    const b = document.createElement('button'); b.className = 'btn' + (g === libGroup ? ' on' : ''); b.textContent = T(g);
    b.onclick = async () => { libGroup = g; $('fontSearch').value = ''; renderGroups(); renderTiles((await idb('files', 'readonly', (s) => s.getAllKeys())) || []); say(T(g)); };

const sheetOk = new Map();
function sheetLoads(url) {
  if (!sheetOk.has(url)) sheetOk.set(url, new Promise((resolve) => { const im = new Image(); im.onload = () => resolve(true); im.onerror = () => resolve(false); im.src = url; }));
  return sheetOk.get(url);

  // Mine without the list (offline before the first visit): the kept fonts by name.

  const c = library ? library.cell : { w: 320, h: 64, cols: 4 };

    b.title = f.name; b.setAttribute('aria-label', f.name); b.dataset.font = f.id;

$('fontSearch').addEventListener('input', async () => renderTiles((await idb('files', 'readonly', (s) => s.getAllKeys())) || []));
async function pickLibraryFont(f, tile) {

    tile.classList.add('busy'); $('fontNote').textContent = T('Getting {name}…', { name: f.name });
    try {
      let bytes = await idb('files', 'readonly', (s) => s.get(f.id));
      if (!bytes) {
        const r = await fetch(LIB_API + '/fonts/files/' + f.id + '.woff2', { mode: 'cors', credentials: 'omit' });

}

// Flood fill on one layer: every connected pixel close in color to the tapped one, through the transparent background
// too, so tapping the white of an empty layer fills the whole outline the child drew on it. With the layer's
// transparency locked, only painted pixels change and keep their own transparency.
function floodFill(layer, x0, y0, hex) {
  if (x0 < 0 || y0 < 0 || x0 >= W || y0 >= H) return;
  const img = layer.ctx.getImageData(0, 0, W, H), d = img.data, lock = layer.lock;
  const i0 = (y0 * W + x0) * 4, r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2], a0 = d[i0 + 3];
  if (lock && a0 === 0) return;
  const nr = parseInt(hex.slice(1, 3), 16), ng = parseInt(hex.slice(3, 5), 16), nb = parseInt(hex.slice(5, 7), 16);
  if (a0 > 200 && Math.abs(r0 - nr) + Math.abs(g0 - ng) + Math.abs(b0 - nb) < 6) return;
  const near = (i) => (!lock || d[i + 3] > 0) && Math.abs(d[i] - r0) + Math.abs(d[i + 1] - g0) + Math.abs(d[i + 2] - b0) + Math.abs(d[i + 3] - a0) < 90;

  while (stack.length) {
    let p = stack.pop(); if (seen[p]) continue;
    let x = p % W, y = (p - x) / W, lx = x;
    while (lx > 0 && !seen[p - 1] && near((p - 1) * 4)) { p--; lx--; }
    let up = false, down = false;
    for (; lx < W && !seen[p] && near(p * 4); lx++, p++) {
      seen[p] = 1; d[p * 4] = nr; d[p * 4 + 1] = ng; d[p * 4 + 2] = nb; if (!lock) d[p * 4 + 3] = 255;
      if (y > 0) { const q = p - W; if (!seen[q] && near(q * 4)) { if (!up) { stack.push(q); up = true; } } else up = false; }
      if (y < H - 1) { const q = p + W; if (!seen[q] && near(q * 4)) { if (!down) { stack.push(q); down = true; } } else down = false; }
    }
  }
  layer.ctx.putImageData(img, 0, 0);
}

// ---- Gallery and stars -----------------------------------------------------------------------------------------------
const store = { get: (k, d) => { try { const v = localStorage.getItem(STORE + '-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(STORE + '-' + k, JSON.stringify(v)); } catch (e) {} } };
let stars = store.get('stars', 0);
const renderStars = () => { $('stars').textContent = '★ ' + stars; };
function award(n, why) { stars += n; store.set('stars', stars); renderStars(); toast(n === 1 ? T('★ A star for {why}', { why: T(why) }) : T('★ {n} stars for {why}', { n, why: T(why) })); }

  for (let n = Math.min(shots.length, 24); n > 0; n--) { try { localStorage.setItem(STORE + '-gallery', JSON.stringify(shots.slice(0, n))); break; } catch (e) {} }
  if (!savedThisPainting) { savedThisPainting = true; const today = new Date().toISOString().slice(0, 10), day = store.get('day', { d: today, n: 0 }); if (day.d !== today) { day.d = today; day.n = 0; } if (day.n < 5) { day.n++; store.set('day', day); award(1, 'a finished painting'); } else toast(T('Saved')); }
  else toast(T('Saved'));

  { g: 2, name: 'Warm and cool', prompts: ['Paint a sunset using only warm colors: red, orange, yellow.', 'Paint an ocean using only cool colors: blue, green, purple.', 'Paint a campfire with warm colors and a night sky with cool colors.', 'Paint a hot day on the left and a cold day on the right.', 'Paint a big flower in warm colors on a cool background.', 'Paint a desert with warm colors.', 'Paint a snowy hill with cool colors and one warm house.', 'Paint a fruit bowl: warm fruit, cool bowl.', 'Make a card for someone: a warm picture and a few words with Text.'] },
  { g: 3, name: 'Shading', prompts: ['Paint a ball, then use Shade to make one side dark.', 'Paint an apple with a light side and a dark side.', 'Paint a cup and shade the inside.', 'Use Smudge to blend two colors into each other.', 'Paint a moon and shade it so it looks round.', 'Paint an egg and shade it with Smudge.', 'Paint a hill and shade the far side.', 'Paint a banana with a shadow under it.'] },
  { g: 4, name: 'Composition', prompts: ['Paint a scene with something big in front and something small far away.', 'Paint a picture where the main thing is not in the middle.', 'Paint a road that gets narrower as it goes away.', 'Paint a landscape with a foreground, a middle and a background.', 'Paint a row of trees that get smaller into the distance.', 'Paint a still life of three objects, one overlapping another.', 'Paint a bird and leave space in front of where it flies.', 'Paint a path that leads the eye to a house.', 'Make a book cover: a picture, a title in a big font and your name in a small one.'] },
  { g: 5, name: 'Perspective', prompts: ['Paint a box in one-point perspective: lines meet at one dot on the horizon.', 'Paint a hallway in one-point perspective.', 'Paint a street with buildings on both sides meeting at a vanishing point.', 'Paint railroad tracks going to the horizon.', 'Paint a room corner in two-point perspective.', 'Paint a row of fence posts shrinking into the distance.', 'Paint a bridge that goes away from you.', 'Paint a city block in two-point perspective.'] },
  { g: 6, name: 'Value and form', prompts: ['Paint a sphere with a highlight, a mid tone, a core shadow and a cast shadow.', 'Paint a cylinder with five values from light to dark.', 'Paint a cube with each face a different value.', 'Make a value scale: ten steps from white to black with Shade.', 'Paint a cone lit from the left.', 'Paint a crumpled paper bag using only one color and Shade.', 'Paint a glass of water with reflections and shadows.', 'Paint three spheres lit from the same side.'] },
  { g: 7, name: 'Color theory', prompts: ['Paint a picture using only complementary colors: blue and orange.', 'Paint a picture in an analogous scheme: three colors next to each other on the wheel.', 'Paint the same tree twice: once in warm light, once in cool light.', 'Paint a monochrome scene: one hue, many values.', 'Paint a color wheel with the mixer: twelve hues around a circle.', 'Paint a portrait using a split-complementary scheme.', 'Paint a landscape where the colors fade with distance (atmospheric perspective).', 'Mix a tint, a tone and a shade of green and paint a leaf with each.'] },
  { g: 8, name: 'Design principles', prompts: ['Paint a poster with a clear focal point, using contrast to lead the eye.', 'Paint a composition with rhythm: a repeated shape that changes as it goes.', 'Paint a balanced picture that is not symmetrical.', 'Paint a design with unity: one shape family, one color scheme.', 'Paint an abstract piece with emphasis on a single element.', 'Paint a pattern with the kaleidoscope, then break it in one place on purpose.', 'Paint a logo for an imaginary company using two colors.', 'Paint a scene that uses movement: lines that pull the eye across the page.', 'Make a poster with a title in a font that fits the picture.'] },
];
const START = (window.KidTablet && KidTablet.rungFor ? KidTablet.rungFor('art', LEVELS.map((l) => l.g)) : (window.KidTablet && KidTablet.levelFor ? KidTablet.levelFor('art', LEVELS.length, 3) : 3));
let level = Math.max(0, Math.min(LEVELS.length - 1, store.get('level', START))), prompt = null, done = store.get('done', 0);
const gradeName = (g) => T(g === -1 ? 'pre-K' : g === 0 ? 'kindergarten' : g + (g === 1 ? 'st' : g === 2 ? 'nd' : g === 3 ? 'rd' : 'th') + ' grade');
function badge() { $('promptLevel').textContent = T(LEVELS[level].name) + ' (' + gradeName(LEVELS[level].g) + ')'; }
// The prompt in the child's language; the English line is the key.
function promptFor(i) { return T(pick(LEVELS[i].prompts)); }
function newPrompt() { prompt = promptFor(level); $('promptText').textContent = prompt; $('prompt').classList.add('open'); say(prompt); }
$('challenge').onclick = () => { if ($('prompt').classList.contains('open')) { $('prompt').classList.remove('open'); prompt = null; return; } newPrompt(); };
$('promptSkip').onclick = newPrompt;
$('promptDone').onclick = () => {
  if (painted() < 60) { tell('Paint it first, then press Done'); return; }
  done++; store.set('done', done);
  award(1, 'a challenge');
  if (done % 3 === 0 && level < LEVELS.length - 1) { level++; store.set('level', level); badge(); say(T('You moved up to {name}', { name: T(LEVELS[level].name) })); }
  else tell('Nice work');
  $('prompt').classList.remove('open'); prompt = null;
};

// ---- Start ----------------------------------------------------------------------------------------------------------
function fit() {
  const s = $('stage'), aw = s.clientWidth - 24, ah = s.clientHeight - 24, k = Math.min(aw / W, ah / H);
  view.style.width = Math.floor(W * k) + 'px'; view.style.height = Math.floor(H * k) + 'px';
  if (typeof applyZoom === 'function') { zoom = { k: 1, x: 0, y: 0 }; applyZoom(); }
}
window.addEventListener('resize', fit);
fit(); renderLayers(); renderStars(); buttons(); badge(); composite();
let newArmed = 0;
$('newPage').onclick = () => {
  if (Date.now() - newArmed > 3000) { newArmed = Date.now(); toast(T('Tap again for a blank page')); tell('Tap again for a blank page'); return; }
  newArmed = 0;
  for (const l of layers) { l.ctx.globalCompositeOperation = 'source-over'; l.ctx.globalAlpha = 1; l.ctx.clearRect(0, 0, W, H); l.on = true; l.lock = false; }
  undoStack.length = 0; redoStack.length = 0; active = 0; savedThisPainting = false;
  renderLayers(); buttons(); composite(); tell('A blank page');
};
setTimeout(() => tell('Welcome to Paint Studio. Pick a brush and a color, and paint.'), 600);

// Self-check hook for tools/ladder-check.mjs: every rung yields prompts, and each prompt names something to paint, in
// English and in its Spanish line.
for (const l of LEVELS) for (const p of l.prompts) {
  if (!/^Paint|^Make|^Turn on|^With|^Use|^Mix|^Fill/.test(p)) throw new Error('prompt without an instruction: ' + p);
  if (ES[p] == null || !/^Pinta|^Haz|^Activa|^Con|^Usa|^Mezcla|^Llena/.test(ES[p])) throw new Error('Spanish prompt without an instruction: ' + p);
}
window.DucklingLadder = {
  levels: () => LEVELS.length,
  start: () => START,
  label: () => $('promptLevel').textContent,
  exercise: (i, n) => { const out = []; for (let k = 0; k < n; k++) { const p = promptFor(i); if (!p || p.length < 12) throw new Error('bad prompt at rung ' + i); out.push(T(LEVELS[i].name) + ': ' + p); } return out; },
};
</script>
