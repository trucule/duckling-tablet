<script>/* KID-VOICE START */
/* Kid Voice: the narrator voice for every offline app.
   When voice-config.js (written on the tablet from the KidTablet .env) names an Azure Speech key, every line an app
   speaks through speechSynthesis is spoken by the Azure kid voice instead (en-US-AnaNeural unless NARRATOR_VOICE
   says otherwise). Clips are kept in IndexedDB, so a line heard once plays again at once and without the internet.
   Without a config, or when Azure does not answer in time, the line goes to the Windows voice as before.
   The apps keep calling speechSynthesis.speak/cancel; this layer stands in for them and fires the same
   utterance events (start, boundary, end, error), so word highlighting and "then do the next thing" keep working.
   tools/apply-kid-voice.py copies this file into each app between the KID-VOICE markers. Story Maker is left out:
   it has its own cast of voices. */
(function () {
  'use strict';
  var cfg = window.KID_TTS;
  if (!cfg || !cfg.key || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined') return;
  var ss = window.speechSynthesis;
  var orig = { speak: ss.speak.bind(ss), cancel: ss.cancel.bind(ss), pause: ss.pause.bind(ss), resume: ss.resume.bind(ss) };
  var VOICE = cfg.voice || 'en-US-AnaNeural', REGION = cfg.region || 'eastus', WAIT_MS = cfg.waitMs || 4000;
  var ctx = null, current = null, queue = [], seq = 0, mem = new Map(), dbp = null, down = 0;

  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) { window.addEventListener(t, audio, { capture: true, passive: true }); });

  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('kid-voice', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('clips'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  function dbGet(k) { return db().then(function (d) { return new Promise(function (res) { if (!d) return res(null); try { var q = d.transaction('clips').objectStore('clips').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } }); }); }
  function dbPut(k, v) { db().then(function (d) { if (!d) return; try { d.transaction('clips', 'readwrite').objectStore('clips').put(v, k); } catch (e) {} }); }

  function clean(t) {
    return String(t || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function rateOf(u) { var r = Number(u.rate) || 1; return Math.round((Math.max(0.5, Math.min(2, r)) - 1) * 100); }

  // Azure REST synthesis, with a time limit so a slow network falls back to the Windows voice.
  function fetchClip(text, rate) {
    var ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US"><voice name="' + VOICE + '">' +
      '<prosody rate="' + (rate >= 0 ? '+' : '') + rate + '%">' + esc(text) + '</prosody></voice></speak>';
    var ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ac) ac.abort(); }, WAIT_MS);
    return fetch('https://' + REGION + '.tts.speech.microsoft.com/cognitiveservices/v1', {
      method: 'POST', signal: ac ? ac.signal : undefined,
      headers: { 'Ocp-Apim-Subscription-Key': cfg.key, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3' },
      body: ssml
    }).then(function (r) { clearTimeout(timer); return r.ok ? r.arrayBuffer() : null; })
      .catch(function () { clearTimeout(timer); return null; });
  }
  function decode(bytes) {
    var c = audio(); if (!c) return Promise.resolve(null);
    return new Promise(function (res) { try { c.decodeAudioData(bytes.slice(0), function (b) { res(b); }, function () { res(null); }); } catch (e) { res(null); } });
  }
  // One AudioBuffer per line and rate: memory, then IndexedDB, then Azure.
  function clip(text, rate) {
    var k = VOICE + '|' + rate + '|' + text;
    if (mem.has(k)) return mem.get(k);
    var p = dbGet(k).then(function (saved) {
      if (saved) return decode(saved);
      if (Date.now() < down) return null;   // Azure failed a moment ago; do not wait on it again yet
      return fetchClip(text, rate).then(function (bytes) {
        if (!bytes) { down = Date.now() + 30000; return null; }
        dbPut(k, bytes); return decode(bytes);
      });
    }).then(function (b) { if (!b) mem.delete(k); return b; });
    mem.set(k, p);
    return p;
  }

  function fire(u, type, extra) {
    var ev;
    try { ev = new SpeechSynthesisEvent(type, Object.assign({ utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {})); }
    catch (e) { ev = new Event(type); Object.assign(ev, { utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {}); }
    if (type === 'error' && !('error' in ev)) { try { Object.defineProperty(ev, 'error', { value: (extra && extra.error) || 'interrupted' }); } catch (e) {} }
    try { u.dispatchEvent(ev); } catch (e) {}
  }

  function playNext() {
    if (current || !queue.length) return;
    var item = queue.shift(), my = ++seq, u = item.u;
    current = item;
    var text = clean(u.text), rate = rateOf(u);
    if (!text) { current = null; fire(u, 'end'); playNext(); return; }
    clip(text, rate).then(function (buf) {
      var c = audio();
      if (!buf || !c || c.state === 'running') return buf;
      // Audio starts suspended until the page may play sound; give resume() a moment.
      return Promise.race([c.resume().catch(function () {}), new Promise(function (r) { setTimeout(r, 300); })]).then(function () { return buf; });
    }).then(function (buf) {
      if (my !== seq) return;
      var c = audio();
      if (!buf || !c || c.state !== 'running') {   // no clip, or audio not allowed yet: the Windows voice says it
        current = null; item.fallback = true; orig.speak(u); playNext(); return;
      }
      var src = c.createBufferSource(), gain = c.createGain();
      gain.gain.value = u.volume == null ? 1 : Math.max(0, Math.min(1, Number(u.volume)));
      src.buffer = buf; src.connect(gain); gain.connect(c.destination);
      item.src = src; item.timers = [];
      // Word boundaries spread over the clip by letter position, for apps that light up each word.
      var full = String(u.text || ''), re = /\S+/g, m, dur = buf.duration;
      while ((m = re.exec(full))) {
        (function (ci, len) {
          item.timers.push(setTimeout(function () { if (my === seq) fire(u, 'boundary', { name: 'word', charIndex: ci, charLength: len, elapsedTime: dur * (ci / Math.max(1, full.length)) }); }, 1000 * dur * (ci / Math.max(1, full.length))));
        })(m.index, m[0].length);
      }
      src.onended = function () {
        if (my !== seq) return;
        item.timers.forEach(clearTimeout); current = null;
        fire(u, 'end', { charIndex: full.length, elapsedTime: dur });
        playNext();
      };
      fire(u, 'start');
      src.start();
    });
  }

  ss.speak = function (u) {
    if (!(u instanceof SpeechSynthesisUtterance)) return orig.speak(u);
    queue.push({ u: u });
    playNext();
  };
  ss.cancel = function () {
    seq++;
    var was = current; current = null;
    var dropped = queue.splice(0);
    if (was) { if (was.src) { try { was.src.onended = null; was.src.stop(); } catch (e) {} } if (was.timers) was.timers.forEach(clearTimeout); if (!was.fallback) fire(was.u, 'error', { error: 'interrupted' }); }
    dropped.forEach(function (d) { fire(d.u, 'error', { error: 'canceled' }); });
    orig.cancel();
  };
  ss.pause = function () { if (ctx && current && current.src) { try { ctx.suspend(); } catch (e) {} } orig.pause(); };
  ss.resume = function () { if (ctx) { try { ctx.resume(); } catch (e) {} } orig.resume(); };
  try {
    var proto = Object.getPrototypeOf(ss);
    var od = function (n) { var d = Object.getOwnPropertyDescriptor(proto, n); return d && d.get ? d.get.bind(ss) : function () { return false; }; };
    var sp = od('speaking'), pe = od('pending');
    Object.defineProperty(ss, 'speaking', { configurable: true, get: function () { return !!current || sp(); } });
    Object.defineProperty(ss, 'pending', { configurable: true, get: function () { return queue.length > 0 || pe(); } });
  } catch (e) {}
  window.KID_VOICE = { voice: VOICE, region: REGION, clip: clip, active: true };
})();
/* KID-VOICE END */</script>
<script>/* KID-STARS START */
// Kid stars: adds up the stars she has earned in every app and tells the home screen.
// All of her offline apps are local files, which share one browser storage, so any app can read every app's saved
// progress. The total goes to the home screen's small local service (KidHome, http://127.0.0.1:47821), which shows it
// next to her avatar. Put into every app by tools/apply-kid-stars.py; edit this file and run that tool again.
(function () {
  if (window.KID_STARS) return;
  var PORT = 47821, BASE = 'http://127.0.0.1:' + PORT;
  // What counts as stars in an app's saved data:
  //   an object with a number "stars"                     (most games: their progress object)
  //   an object of objects with a number "stars" each      (Level Up: one per subject)
  //   a number saved under a key ending in "-stars"        (Story Maker)
  //   a list saved under a key starting with "lab-done-"   (Chemistry Lab, Kitchen Lab: one star per experiment)
  function starsIn(key, raw) {
    var v; try { v = JSON.parse(raw); } catch (e) { return 0; }
    var n = function (x) { return typeof x === 'number' && isFinite(x) && x > 0 ? Math.floor(x) : 0; };
    if (/^lab-done-/.test(key)) return Array.isArray(v) ? v.length : 0;
    if (/-stars$/.test(key)) return n(v);
    if (!v || typeof v !== 'object' || Array.isArray(v)) return 0;
    if (typeof v.stars === 'number') return n(v.stars);
    var sum = 0;
    for (var k in v) if (v[k] && typeof v[k] === 'object' && typeof v[k].stars === 'number') sum += n(v[k].stars);
    return sum;
  }
  function earned() {
    var total = 0, per = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i); if (!k || /^kid-avatar/.test(k)) continue;
        var s = starsIn(k, localStorage.getItem(k)); if (s) { per[k] = s; total += s; }
      }
    } catch (e) {}
    return { total: total, per: per };
  }
  var last = -1, timer = null;
  function report(force) {
    var e = earned();
    if (!force && e.total === last) return Promise.resolve(e.total);
    last = e.total;
    // A plain text body keeps this a simple request (no preflight). A home screen that is not listening is fine.
    try {
      return fetch(BASE + '/stars', { method: 'POST', body: JSON.stringify({ earned: e.total }) })
        .then(function () { return e.total; }, function () { return e.total; });
    } catch (err) { return Promise.resolve(e.total); }
  }
  // Report after any save, a moment later so a burst of saves sends one report.
  try {
    var set = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) {
      set.apply(this, arguments);
      if (this === window.localStorage && !/^kid-avatar/.test(String(k))) { clearTimeout(timer); timer = setTimeout(report, 800); }
    };
  } catch (e) {}
  window.KID_STARS = { earned: function () { return earned().total; }, breakdown: function () { return earned().per; }, report: report, starsIn: starsIn, base: BASE };
  setTimeout(function () { report(true); }, 1500);
})();
/* KID-STARS END */</script>

<title>Count With Me</title>
<!--
  Count With Me. Hands-on math from counting to powers of ten, one file, offline, no API.
  Four games, each with its own ladder of levels from pre-K to 8th grade (the ladders are listed above LEVELS):
    How many?  tap to count, ten frames, arrays, area models, groups, hundred grids, ratios, scale, squares and roots.
    Give me    drag things into the basket or onto plates, then tokens: tens and ones, tenths and hundredths,
               two colours for a ratio, percent of an amount, positive and negative chips, powers.
    Build it   place value blocks: ones to thousands, trading, tenths and hundredths, powers of ten, scientific notation.
    Story      word problems read aloud: add and subtract, times and sharing, several steps, fractions, decimals,
               ratios and rates, percents, proportions, equations in words, chance.
  Four right first try in a row moves a game up a level; two missed questions in a row moves it down.
  Progress is kept in localStorage (key count-v2). New players start at the child's grade in math (set by the
  parent), 2nd grade when unknown; the young levels stay at the bottom of each ladder.
-->
<style>
  :root { --ink: #2B2140; --paper: #FFF9F0; --pink: #FF4F8B; --sun: #FFC93C; --sky: #58C7F0; --leaf: #5CD38B; --grape: #9B6BFF; }

  body { touch-action: none; user-select: none; -webkit-user-select: none; }

  /* The right 210px of the header stays clear: the Home pill sits there. */

  header h1 { font-size: 26px; margin: 0; font-weight: 900; }

  @media (max-width: 1140px) { header h1 { display: none; } header { gap: 8px; } .pill { font-size: 17px; padding: 7px 12px; } #badge { font-size: 15px; } }

  html[lang="es"] #ask { width: max-content; }

  #badge { font-size: 17px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 5px 12px; margin-right: auto; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .pill { border: 3px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 19px; font-weight: 800; cursor: pointer; flex: none; }

  #stars { font-size: 22px; font-weight: 900; }
  main { position: relative; min-height: 0; }

  #ask.long { font-size: 22px; padding: 8px 20px; white-space: normal; line-height: 1.2; border-radius: 24px; text-align: center; }

  .thing.small { width: 70px; height: 70px; font-size: 50px; }

  #basket { position: absolute; right: 24px; bottom: 24px; width: 300px; height: 190px; border: 4px solid var(--ink); border-radius: 24px 24px 40px 40px; background: #FFE4B5; display: none; z-index: 1; }
  #basket::before { content: "🧺"; position: absolute; left: 10px; top: -30px; font-size: 44px; }

  .count { position: absolute; right: 12px; top: -22px; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 2px 14px; font-size: 24px; font-weight: 900; }

  #answers button:active, #pad button:active, .ctl button:active, #trades button:active, .tok:active, .chip:active { transform: scale(.94); }
  /* The check keeps its centring transform while pressed; without it the button jumps sideways under the finger and the tap is lost. */
  #check:active { transform: translateX(-50%) scale(.94); }

  #check.on { display: block; }
  main.low #check { height: 70px; bottom: 14px; font-size: 36px; }
  /* Plates need the whole field height on a 640px screen, so their check sits in the field's top right corner. */
  main.top #check { bottom: auto; top: 80px; left: auto; right: 34px; transform: none; width: 120px; height: 64px; font-size: 34px; }
  main.top #check:active { transform: scale(.94); }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  /* Number pad for answers bigger than a few choices. The wide layout adds a minus key and a decimal point. */
  #pad { position: absolute; right: 20px; top: 70px; bottom: 20px; width: 300px; display: none; flex-direction: column; gap: 10px; z-index: 2; }
  #pad.on { display: flex; }
  #padShow { height: 84px; flex: none; font-size: 54px; font-weight: 900; border: 4px solid var(--ink); border-radius: 20px; background: #fff; display: grid; place-items: center; }
  #padKeys { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 10px; min-height: 0; }
  #padKeys button { border: 4px solid var(--ink); background: #fff; border-radius: 18px; font-size: 38px; font-weight: 900; cursor: pointer; padding: 0; }

  #padKeys.wide { gap: 7px; }
  #padKeys.wide button { font-size: 30px; border-radius: 14px; }
  #padKeys button.span2 { grid-column: span 2; }
  #padKeys button.off { visibility: hidden; }
  /* Ten frames, arrays, grids and groups. */
  .wrap { position: absolute; inset: 44px 10px 10px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-content: center; }

  .cell.counted { background: #FFF1B8; }
  .cell.a { background: #D6F1FF; } .cell.b { background: #DFF7E8; } .cell.shade { background: #FF8FB5; border-color: #e07aa0; }
  .array { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }

  if (hit) say(numWords(zoneCount(hit)));
  else { const from = zones().find(z => (z.dataset.zone || 'basket') === was); if (from) say(T('Oops, {n}', { n: numWords(zoneCount(from)) })); }
}
function checkPlaced() {
  if (busy) return;
  const nm = NAMES[emojiOf()];
  if (task.kind === 'basket') {
    const n = zoneCount($('basket')), want = task.answer;
    if (n === want) win(task.expr ? `${task.expr} = ${want}` : T('{n} {noun}. Perfect!', { n: cap(nwt(want, nm)), noun: noun(want, nm) }), task.expr ? T('{say} is {n}.', { say: task.say, n: numWords(want) }) : '');
    else miss(n < want ? T('Only {n}. We need {want}. Add some more!', { n: nwt(n, nm), want: nwt(want, nm) }) : T('That is {n}. Too many! Take some out.', Object.assign({ n: nwt(n, nm) }, tv(nm))));
    return;
  }
  const counts = [...document.querySelectorAll('.plate')].map(zoneCount);
  const loose = [...document.querySelectorAll('.thing')].filter(t => !t.dataset.in).length;
  if (task.kind === 'groups') {
    const bad = counts.findIndex(c => c !== task.N);
    if (bad < 0) return win(T('{R} groups of {N} = {total}', { R: task.R, N: task.N, total: task.R * task.N }), T('{R} groups of {N} is {total} {things}.', Object.assign({ R: numWords(task.R), N: numWords(task.N), total: nwt(task.R * task.N, nm) }, tv(nm))));
    return miss(T('Plate {p} has {n}. Every plate needs {N}.', { p: bad + 1, n: nwt(counts[bad], nm), N: nwt(task.N, nm) }));
  }
  // share
  const fair = counts.every(c => c === counts[0]);
  if (!fair) return miss(T('The plates are not fair yet. Every plate needs the same number.'));
  if (loose >= task.R) return miss(counts[0] === 0 ? T('Put some on the plates.') : T('You can still give every plate one more.', tv(nm)));
  if (task.left === 0 && loose) return miss(T('Share all of them.'));
  const each = counts[0];
  if (task.left) win(T('{total} ÷ {R} = {each}, {left} left over', { total: task.total, R: task.R, each, left: task.left }), T('{total} shared by {R} is {each} each, with {left} left over.', { total: nwt(task.total, nm), R: numWords(task.R), each: nwt(each, nm), left: nwt(task.left, nm), sobra: task.left === 1 ? 'sobra' : 'sobran' }));
  else win(`${task.total} ÷ ${task.R} = ${each}`, T('{total} shared by {R} is {each} each.', { total: nwt(task.total, nm), R: numWords(task.R), each: nwt(each, nm) }));
}
function checkTokens() {
  if (busy) return;
  const { counts, total } = tokenTotals();
  if (task.check === 'ratio') {
    const r = counts.r || 0, b = counts.b || 0, n = r + b;
    if (n !== task.total) return miss(T(n < task.total ? 'That is {n} in all. We need {total}. Add some more.' : 'That is {n} in all. We need {total}. Take some out.', { n: numWordsG(n, 'f'), total: numWordsG(task.total, 'f') }));
    if (r * task.q !== b * task.p) return miss(T('For every {p} red there should be {q} blue. Try again.', { p: numWordsG(task.p, 'f'), q: numWordsG(task.q, 'f'), rojap: task.p === 1 ? 'roja' : 'rojas', azulq: task.q === 1 ? 'azul' : 'azules' }));
    return win(task.eq, task.done);
  }
  if (!placed.length) return miss(T('The bin is empty. Tap a token to put it in.'));
  if (Math.round(total) === Math.round(task.answer * task.scale)) return win(task.eq, task.done);
  miss(T(total < task.answer * task.scale ? 'That is {n}. We need more.' : 'That is {n}. That is too many.', { n: numSay(total / task.scale) }));
}
function checkBuild() {
  if (busy) return;
  const v = valueOf(blocks), a = task.answer, set = COLSETS[task.cols];
  const over = blocks.findIndex((x, i) => i > 0 && x > 9);
  if (v === a && over < 0) return win(task.eq ? task.eq + ' = ' + buildFmt(a) : buildFmt(a), T('{n}!', { n: cap(buildSay(a)) }));
  if (v === a) return miss(T('That is {v}, but you have {n} {lo}. Trade ten {lo} for a {hi}.', { v: buildSay(a), n: numWords(blocks[over]), lo: placePl(set.names[over]), hi: placeS(set.names[over - 1]), have: placeN(blocks[over], set.names[over]), ahi: placeN('a', set.names[over - 1]) }));
  miss(T(v < a ? 'That is {n}. We need more.' : 'That is {n}. That is too many.', { n: buildSay(v) }));
}
$('check').onclick = () => (task.kind === 'build' ? checkBuild() : task.kind === 'tokens' ? checkTokens() : checkPlaced());

function showHint() {
  hinted = true;
  switch (task.kind) {
    case 'tap': say(T('Tap each {thing} once. Say the numbers with me.', tv(NAMES[emojiOf()]))); break;
    case 'frames': tell('A full ten frame is ten. Count the tens: ten, twenty, thirty. Then count the ones.'); break;
    case 'array': say(T(task.tapRows ? 'Tap each row. Count by {c}s.' : 'Now you can tap the rows. Count by {c}s.', { c: numWords(task.c) })); break;
    case 'basket': say(task.hint || T('Drag them in one at a time and count.')); break;
    case 'groups': say(T('Put {N} on the first plate. Then do the next plate.', { N: nwt(task.N, NAMES[emojiOf()]) })); break;
    case 'share': say(T('Give one to each plate, then go around again. Keep going until you cannot give every plate one more.', tv(NAMES[emojiOf()]))); break;
    case 'build': say(T(task.eq ? (task.breakable ? 'Take away the small ones first. If there are not enough, break a bigger block.' : 'Add the small ones first, then the bigger ones. Trade ten for one when you can.') : 'Look at each digit. Start with the biggest place and work to the right.')); break;
    case 'story': { const pic = $('pic'); if (pic) { pic.textContent = (task.pic ? task.pic + '\n' : '') + task.eq; pic.classList.add('on'); } say(T('Here is a hint. {eq}', { eq: task.eq.replace('?', T('what')) })); break; }
    default: say(task.hint || task.speak); break;
  }
}

document.querySelectorAll('.pill[data-mode]').forEach(b => b.onclick = () => { document.querySelectorAll('.pill[data-mode]').forEach(x => x.classList.toggle('on', x === b)); mode = b.dataset.mode; newRound(); });
$('again').onclick = () => newRound();
$('hint').onclick = () => { if (!busy) showHint(); };
$('hear').onclick = () => say(task.kind === 'story' ? (task.say || task.text) : task.speak || $('ask').textContent);
$('stars').textContent = '⭐ ' + P.stars;
// The markup is written in English; on a Spanish tablet it is translated once here.
if (LANG === 'es') {
  document.documentElement.lang = 'es';
  document.title = T('Count With Me');
  document.querySelector('header h1').textContent = T('Count With Me');
  document.querySelectorAll('.pill[data-mode]').forEach(b => { b.textContent = T(b.textContent.trim()); });
  document.querySelectorAll('footer button[title]').forEach(b => { b.title = T(b.title); });
}
buildPad(false);
let resizeTimer = null;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (!busy) { counted = 0; render(false); } }, 200); });
newRound(false);
addEventListener('pointerdown', () => say(T('Count With Me! {t}', { t: task.kind === 'story' ? (task.say || task.text) : task.speak || $('ask').textContent })), { once: true });

// ---------------------------------------------------------------------------
// Self-check hook for tools/ladder-check.mjs. The four ladders are flattened in order: How many?, Give me,
// Build it, Story. exercise(i, n) generates n tasks at that rung without touching the screen and throws when a
// task is malformed: a bad number, a missing answer, text with NaN or undefined in it, or a puzzle that cannot be
// solved with the pieces the screen will offer.
// ---------------------------------------------------------------------------
const ORDER = ['howmany', 'giveme', 'build', 'story'];
const FLAT = ORDER.flatMap(m => LEVELS[m].map((l, i) => ({ m, i })));
function checkTask(m, r, t) {
  const fail = why => { throw new Error(`${m} ${r} ${LEVELS[m][r].name}: ${why} in ${JSON.stringify(t).slice(0, 160)}`); };
  const texts = ['ask', 'prompt', 'speak', 'text', 'eq', 'hint', 'done', 'expr', 'say'].map(k => t[k]).filter(x => x !== undefined);
  for (const s of texts) { if (typeof s !== 'string' || !s.trim()) fail('empty text'); if (/NaN|undefined|null|\[object/.test(s)) fail('bad text ' + s); }
  if (typeof t.answer !== 'number' || !isFinite(t.answer)) fail('bad answer');
  const int = n => Number.isInteger(n);
  switch (t.kind) {
    case 'tap': if (!int(t.answer) || t.answer < t.lo || t.answer > t.hi || !t.choices.includes(t.answer) || new Set(t.choices).size !== 3) fail('tap'); break;
    case 'frames': if (!int(t.answer) || t.answer < 1 || t.answer > 120) fail('frames'); break;
    case 'array': if (t.r * t.c !== t.answer || t.r < 2 || t.c < 2 || t.c > 10) fail('array'); break;
    case 'area': if (t.r * t.c !== t.answer || t.c > 19 || t.r > 9) fail('area'); break;
    case 'eqgroups': if (t.G * t.N !== t.answer || t.G > 6 || t.N > 29) fail('groups'); break;
    case 'quotient': if (![t.G, t.N].includes(t.answer) || t.G > 12 || t.N > 12) fail('quotient'); break;
    case 'grid100': if (t.k < 1 || t.k > 99 || !(same(t.answer, t.k) || same(t.answer, t.k / 100))) fail('grid'); break;
    case 'ratio': if (t.r * t.q !== t.b * t.p || t.r + t.b > 40 || ![t.p, t.q, t.p + t.q].includes(t.answer)) fail('ratio'); break;
    case 'scale': if (!int(t.answer) || t.answer < 1 || t.answer > 108) fail('scale'); break;
    case 'square': if (![t.b, t.b * t.b].includes(t.answer) || t.b > 12) fail('square'); break;
    case 'cube': if (![t.b, t.b ** 3].includes(t.answer) || t.b > 5) fail('cube'); break;
    case 'basket': if (!int(t.answer) || t.answer < 1 || t.total < t.answer || t.total > 24) fail('basket'); break;
    case 'groups': if (t.total < t.R * t.N || t.R > 4 || t.N > 5) fail('plates'); break;
    case 'share': if (t.total !== t.R * t.each + t.left || t.left >= t.R || t.total > 30) fail('share'); break;
    case 'tokens': {
      if (!t.toks || !t.toks.length) fail('no tokens');
      if (t.check === 'ratio') { if (t.answer * t.q !== t.answerB * t.p || t.answer + t.answerB !== t.total || t.total > 20) fail('ratio tokens'); break; }
      const units = Math.round(t.answer * t.scale), vals = t.toks.map(x => x.v);
      if (!int(units) || (units > 0 && !vals.some(v => v > 0)) || (units < 0 && !vals.some(v => v < 0)) || units === 0 || Math.abs(units) > 399) fail('tokens value');
      break;
    }
    case 'build': {
      const set = COLSETS[t.cols]; if (!set || t.start.length !== set.cols.length) fail('cols');
      const cap_ = set.places[0] * 10 - 1; if (!int(t.answer) || t.answer < 0 || t.answer > cap_) fail('build range');
      if (t.start.some(x => x < 0 || x > 9)) fail('start'); break;
    }
    case 'story': if (!t.eq.includes('?') || t.text.length > 230 || (t.answer < 0 && !t.neg) || (!t.dot && !int(t.answer)) || t.answer > 9999) fail('story'); break;
    default: fail('unknown kind ' + t.kind);
  }
}
const describe = t => (t.ask || t.prompt || t.text || (t.kind + ' ' + (t.total || t.r || ''))) + ' -> ' + fmt(t.answer) + (t.answerB != null ? ' red, ' + t.answerB + ' blue' : '');
window.DucklingLadder = {
  levels: () => FLAT.length,
  start: () => START[mode],
  label: () => T(LEVELS[mode][P.lv[mode]].name),
  rung: i => FLAT[i].m + ' ' + FLAT[i].i + ' ' + LEVELS[FLAT[i].m][FLAT[i].i].name,
  exercise: (i, n) => { const { m, i: r } = FLAT[i]; const out = []; for (let k = 0; k < n; k++) { const t = LEVELS[m][r].gen(); checkTask(m, r, t); out.push(describe(t)); } return out; },
};

// Language hook for tools/ladder-check.mjs --lang es: every key with a Spanish line, the keys asked for without one,
// and the English words that are right on a Spanish screen (none here).
window.DucklingLang = { keys: () => Object.keys(ES), missing: () => [...USED].filter(k => ES[k] == null), allow: [] };

// Test hook.
window.CWM = { LEVELS, START, numWords, record, P: () => P, current: () => task, mode: () => mode, setMode: m => document.querySelector(`.pill[data-mode="${m}"]`).click(), blocks: () => blocks, valueOf, placed: () => placed, setTyped: s => { typed = s; showTyped(); }, submit: submitTyped };
</script>
