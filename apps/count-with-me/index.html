<script>/* KID-VOICE START */
/* Kid Voice: the narrator voice for every offline app.
   When voice-config.js (written on the tablet from the KidTablet .env) names an Azure Speech key, every line an app
   speaks through speechSynthesis is spoken by the Azure kid voice instead (en-US-AnaNeural unless NARRATOR_VOICE
   says otherwise). Clips are kept in IndexedDB, so a line heard once plays again at once and without the internet.
   Without a config, or when Azure does not answer in time, the line goes to the Windows voice as before.
   The apps keep calling speechSynthesis.speak/cancel; this layer stands in for them and fires the same
   utterance events (start, boundary, end, error), so word highlighting and "then do the next thing" keep working.
   tools/apply-kid-voice.py copies this file into each app between the KID-VOICE markers. Story Maker is left out:
   it has its own cast of voices. */
(function () {
  'use strict';
  var cfg = window.KID_TTS;
  if (!cfg || !cfg.key || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined') return;
  var ss = window.speechSynthesis;
  var orig = { speak: ss.speak.bind(ss), cancel: ss.cancel.bind(ss), pause: ss.pause.bind(ss), resume: ss.resume.bind(ss) };
  var VOICE = cfg.voice || 'en-US-AnaNeural', REGION = cfg.region || 'eastus', WAIT_MS = cfg.waitMs || 4000;
  var ctx = null, current = null, queue = [], seq = 0, mem = new Map(), dbp = null, down = 0;

  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) { window.addEventListener(t, audio, { capture: true, passive: true }); });

  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('kid-voice', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('clips'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  function dbGet(k) { return db().then(function (d) { return new Promise(function (res) { if (!d) return res(null); try { var q = d.transaction('clips').objectStore('clips').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } }); }); }
  function dbPut(k, v) { db().then(function (d) { if (!d) return; try { d.transaction('clips', 'readwrite').objectStore('clips').put(v, k); } catch (e) {} }); }

  function clean(t) {
    return String(t || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function rateOf(u) { var r = Number(u.rate) || 1; return Math.round((Math.max(0.5, Math.min(2, r)) - 1) * 100); }

  // Azure REST synthesis, with a time limit so a slow network falls back to the Windows voice.
  function fetchClip(text, rate) {
    var ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US"><voice name="' + VOICE + '">' +
      '<prosody rate="' + (rate >= 0 ? '+' : '') + rate + '%">' + esc(text) + '</prosody></voice></speak>';
    var ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ac) ac.abort(); }, WAIT_MS);
    return fetch('https://' + REGION + '.tts.speech.microsoft.com/cognitiveservices/v1', {
      method: 'POST', signal: ac ? ac.signal : undefined,
      headers: { 'Ocp-Apim-Subscription-Key': cfg.key, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3' },
      body: ssml
    }).then(function (r) { clearTimeout(timer); return r.ok ? r.arrayBuffer() : null; })
      .catch(function () { clearTimeout(timer); return null; });
  }
  function decode(bytes) {
    var c = audio(); if (!c) return Promise.resolve(null);
    return new Promise(function (res) { try { c.decodeAudioData(bytes.slice(0), function (b) { res(b); }, function () { res(null); }); } catch (e) { res(null); } });
  }
  // One AudioBuffer per line and rate: memory, then IndexedDB, then Azure.
  function clip(text, rate) {
    var k = VOICE + '|' + rate + '|' + text;
    if (mem.has(k)) return mem.get(k);
    var p = dbGet(k).then(function (saved) {
      if (saved) return decode(saved);
      if (Date.now() < down) return null;   // Azure failed a moment ago; do not wait on it again yet
      return fetchClip(text, rate).then(function (bytes) {
        if (!bytes) { down = Date.now() + 30000; return null; }
        dbPut(k, bytes); return decode(bytes);
      });
    }).then(function (b) { if (!b) mem.delete(k); return b; });
    mem.set(k, p);
    return p;
  }

  function fire(u, type, extra) {
    var ev;
    try { ev = new SpeechSynthesisEvent(type, Object.assign({ utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {})); }
    catch (e) { ev = new Event(type); Object.assign(ev, { utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {}); }
    if (type === 'error' && !('error' in ev)) { try { Object.defineProperty(ev, 'error', { value: (extra && extra.error) || 'interrupted' }); } catch (e) {} }
    try { u.dispatchEvent(ev); } catch (e) {}
  }

  function playNext() {
    if (current || !queue.length) return;
    var item = queue.shift(), my = ++seq, u = item.u;
    current = item;
    var text = clean(u.text), rate = rateOf(u);
    if (!text) { current = null; fire(u, 'end'); playNext(); return; }
    clip(text, rate).then(function (buf) {
      var c = audio();
      if (!buf || !c || c.state === 'running') return buf;
      // Audio starts suspended until the page may play sound; give resume() a moment.
      return Promise.race([c.resume().catch(function () {}), new Promise(function (r) { setTimeout(r, 300); })]).then(function () { return buf; });
    }).then(function (buf) {
      if (my !== seq) return;
      var c = audio();
      if (!buf || !c || c.state !== 'running') {   // no clip, or audio not allowed yet: the Windows voice says it
        current = null; item.fallback = true; orig.speak(u); playNext(); return;
      }
      var src = c.createBufferSource(), gain = c.createGain();
      gain.gain.value = u.volume == null ? 1 : Math.max(0, Math.min(1, Number(u.volume)));
      src.buffer = buf; src.connect(gain); gain.connect(c.destination);
      item.src = src; item.timers = [];
      // Word boundaries spread over the clip by letter position, for apps that light up each word.
      var full = String(u.text || ''), re = /\S+/g, m, dur = buf.duration;
      while ((m = re.exec(full))) {
        (function (ci, len) {
          item.timers.push(setTimeout(function () { if (my === seq) fire(u, 'boundary', { name: 'word', charIndex: ci, charLength: len, elapsedTime: dur * (ci / Math.max(1, full.length)) }); }, 1000 * dur * (ci / Math.max(1, full.length))));
        })(m.index, m[0].length);
      }
      src.onended = function () {
        if (my !== seq) return;
        item.timers.forEach(clearTimeout); current = null;
        fire(u, 'end', { charIndex: full.length, elapsedTime: dur });
        playNext();
      };
      fire(u, 'start');
      src.start();
    });
  }

  ss.speak = function (u) {
    if (!(u instanceof SpeechSynthesisUtterance)) return orig.speak(u);
    queue.push({ u: u });
    playNext();
  };
  ss.cancel = function () {
    seq++;
    var was = current; current = null;
    var dropped = queue.splice(0);
    if (was) { if (was.src) { try { was.src.onended = null; was.src.stop(); } catch (e) {} } if (was.timers) was.timers.forEach(clearTimeout); if (!was.fallback) fire(was.u, 'error', { error: 'interrupted' }); }
    dropped.forEach(function (d) { fire(d.u, 'error', { error: 'canceled' }); });
    orig.cancel();
  };
  ss.pause = function () { if (ctx && current && current.src) { try { ctx.suspend(); } catch (e) {} } orig.pause(); };
  ss.resume = function () { if (ctx) { try { ctx.resume(); } catch (e) {} } orig.resume(); };
  try {
    var proto = Object.getPrototypeOf(ss);
    var od = function (n) { var d = Object.getOwnPropertyDescriptor(proto, n); return d && d.get ? d.get.bind(ss) : function () { return false; }; };
    var sp = od('speaking'), pe = od('pending');
    Object.defineProperty(ss, 'speaking', { configurable: true, get: function () { return !!current || sp(); } });
    Object.defineProperty(ss, 'pending', { configurable: true, get: function () { return queue.length > 0 || pe(); } });
  } catch (e) {}
  window.KID_VOICE = { voice: VOICE, region: REGION, clip: clip, active: true };
})();
/* KID-VOICE END */</script>
<script>/* KID-STARS START */
// Kid stars: adds up the stars she has earned in every app and tells the home screen.
// All of her offline apps are local files, which share one browser storage, so any app can read every app's saved
// progress. The total goes to the home screen's small local service (KidHome, http://127.0.0.1:47821), which shows it
// next to her avatar. Put into every app by tools/apply-kid-stars.py; edit this file and run that tool again.
(function () {
  if (window.KID_STARS) return;
  var PORT = 47821, BASE = 'http://127.0.0.1:' + PORT;
  // What counts as stars in an app's saved data:
  //   an object with a number "stars"                     (most games: their progress object)
  //   an object of objects with a number "stars" each      (Level Up: one per subject)
  //   a number saved under a key ending in "-stars"        (Story Maker)
  //   a list saved under a key starting with "lab-done-"   (Chemistry Lab, Kitchen Lab: one star per experiment)
  function starsIn(key, raw) {
    var v; try { v = JSON.parse(raw); } catch (e) { return 0; }
    var n = function (x) { return typeof x === 'number' && isFinite(x) && x > 0 ? Math.floor(x) : 0; };
    if (/^lab-done-/.test(key)) return Array.isArray(v) ? v.length : 0;
    if (/-stars$/.test(key)) return n(v);
    if (!v || typeof v !== 'object' || Array.isArray(v)) return 0;
    if (typeof v.stars === 'number') return n(v.stars);
    var sum = 0;
    for (var k in v) if (v[k] && typeof v[k] === 'object' && typeof v[k].stars === 'number') sum += n(v[k].stars);
    return sum;
  }
  function earned() {
    var total = 0, per = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i); if (!k || /^kid-avatar/.test(k)) continue;
        var s = starsIn(k, localStorage.getItem(k)); if (s) { per[k] = s; total += s; }
      }
    } catch (e) {}
    return { total: total, per: per };
  }
  var last = -1, timer = null;
  function report(force) {
    var e = earned();
    if (!force && e.total === last) return Promise.resolve(e.total);
    last = e.total;
    // A plain text body keeps this a simple request (no preflight). A home screen that is not listening is fine.
    try {
      return fetch(BASE + '/stars', { method: 'POST', body: JSON.stringify({ earned: e.total }) })
        .then(function () { return e.total; }, function () { return e.total; });
    } catch (err) { return Promise.resolve(e.total); }
  }
  // Report after any save, a moment later so a burst of saves sends one report.
  try {
    var set = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) {
      set.apply(this, arguments);
      if (this === window.localStorage && !/^kid-avatar/.test(String(k))) { clearTimeout(timer); timer = setTimeout(report, 800); }
    };
  } catch (e) {}
  window.KID_STARS = { earned: function () { return earned().total; }, breakdown: function () { return earned().per; }, report: report, starsIn: starsIn, base: BASE };
  setTimeout(function () { report(true); }, 1500);
})();
/* KID-STARS END */</script>

<title>Count With Me</title>
<!--
  Count With Me. Hands-on math from counting to powers of ten, one file, offline, no API.
  Four games, each with its own ladder of levels from pre-K to 8th grade (the ladders are listed above LEVELS):
    How many?  tap to count, ten frames, arrays, area models, groups, hundred grids, ratios, scale, squares and roots.
    Give me    drag things into the basket or onto plates, then tokens: tens and ones, tenths and hundredths,
               two colours for a ratio, percent of an amount, positive and negative chips, powers.
    Build it   place value blocks: ones to thousands, trading, tenths and hundredths, powers of ten, scientific notation.
    Story      word problems read aloud: add and subtract, times and sharing, several steps, fractions, decimals,
               ratios and rates, percents, proportions, equations in words, chance.
  Four right first try in a row moves a game up a level; two missed questions in a row moves it down.
  Progress is kept in localStorage (key count-v2). New players start at the child's grade in math (set by the
  parent), 2nd grade when unknown; the young levels stay at the bottom of each ladder.
-->
<style>

  #padKeys { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 10px; min-height: 0; }

<script>
// ---------------------------------------------------------------------------
// Voice clips. If a voice pack is present (window.VOICE_PACK: phrase -> base64 MP3, made by voices/make-voices.py),
// a phrase is played from its clip through Web Audio; otherwise the Windows voice reads it. Bytes are decoded in
// memory (no data: or blob: URLs, which the kiosk blocks).
// ---------------------------------------------------------------------------
const VOICE = (() => {
  let actx = null, cur = null; const decoded = new Map();
  const key = t => String(t).trim().toLowerCase().replace(/\s+/g, ' ');
  function ctx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
  function stop() { if (cur) { try { cur.onended = null; cur.stop(); } catch (e) {} cur = null; } }
  function has(t) { const p = window.VOICE_PACK; return !!(p && p[key(t)]); }
  function play(t, done) {
    const p = window.VOICE_PACK, k = key(t); if (!p || !p[k]) return false;
    const a = ctx(); if (!a) return false;
    const go = (buf) => { stop(); const s = a.createBufferSource(); s.buffer = buf; s.connect(a.destination); s.onended = () => { if (cur === s) { cur = null; if (done) done(); } }; cur = s; s.start(); };
    try {
      if (decoded.has(k)) { go(decoded.get(k)); return true; }
      const bin = atob(p[k]), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      a.decodeAudioData(bytes.buffer.slice(0)).then(buf => { decoded.set(k, buf); go(buf); }).catch(() => { if (done) done(); });
      return true;
    } catch (e) { return false; }
  }
  return { play, stop, has, key };
})();

const THINGS = ['🍎', '🐥', '⭐', '🐸', '🎈', '🐟', '🍓', '🦋', '🐢', '🌼', '🚗', '🍪'];
const NAMES = { '🍎': 'apples', '🐥': 'chicks', '⭐': 'stars', '🐸': 'frogs', '🎈': 'balloons', '🐟': 'fish', '🍓': 'strawberries', '🦋': 'butterflies', '🐢': 'turtles', '🌼': 'flowers', '🚗': 'cars', '🍪': 'cookies' };
const WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function numWords(n) {
  if (n < 20) return WORDS[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + WORDS[n % 10] : '');
  if (n < 1000) return WORDS[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + numWords(n % 100) : '');
  return numWords(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? ' ' + numWords(n % 1000) : '');
}
// Numbers as text: 0.47 -> "0.47", -4 -> "-4", 3200 -> "3200". Never more than two decimals.
const fmt = n => { const r = Math.round(n * 100) / 100; return String(Object.is(r, -0) ? 0 : r); };
const money = c => (c / 100).toFixed(2);
// Numbers as speech, for negatives and decimals too: -4 -> "negative four", 2.35 -> "two point three five".
function numSay(n) {
  n = Math.round(n * 100) / 100;
  if (n < 0) return 'negative ' + numSay(-n);
  if (Number.isInteger(n)) return n < 1000000 ? numWords(n) : String(n);
  const [i, d] = fmt(n).split('.');
  return numWords(+i) + ' point ' + d.split('').map(c => WORDS[+c]).join(' ');
}
const FRACS = { 2: ['half', 'halves'], 3: ['third', 'thirds'], 4: ['fourth', 'fourths'], 5: ['fifth', 'fifths'], 6: ['sixth', 'sixths'], 8: ['eighth', 'eighths'], 10: ['tenth', 'tenths'], 12: ['twelfth', 'twelfths'] };
const fracSay = (a, d) => numWords(a) + ' ' + FRACS[d][a === 1 ? 0 : 1];
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
const powSay = (b, e) => numSay(b) + (e === 2 ? ' squared' : e === 3 ? ' cubed' : ' to the ' + ['', '', '', '', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth'][e] + ' power');
const tenSay = e => e === 0 ? 'ten to the zero' : e === 1 ? 'ten' : e === 2 ? 'ten squared' : e === 3 ? 'ten cubed' : e === -1 ? 'ten to the negative one' : 'ten to the negative two';

const one = nm => nm === 'fish' ? 'fish' : nm.replace(/ies$/, 'y').replace(/s$/, '');
const noun = (n, nm) => n === 1 ? one(nm) : nm;

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

// ---------------------------------------------------------------------------
// Levels. Each level makes one task; render() shows it and the checks below grade it.
// Four ladders, one per game. Rung index, name and grade band:

// ---------------------------------------------------------------------------
const LEVELS = {
  howmany: [
    { name: 'Count to 5', gen: () => tapTask(1, 5) },
    { name: 'Count to 10', gen: () => tapTask(1, 10) },
    { name: 'Count to 20', gen: () => tapTask(5, 20) },

    { name: 'Rows of', gen: () => arrayTask(2, 5, 2, 5, true) },

    { name: 'Area model', gen: areaTask },
    { name: 'Groups of', gen: groupsOfTask },
    { name: 'How many groups?', gen: quotientTask },

    { name: 'Percent', gen: () => gridTask(true) },
    { name: 'Ratios', gen: ratioTask },
    { name: 'Scale up', gen: scaleTask },
    { name: 'Squares and cubes', gen: powerTask },
    { name: 'Square roots', gen: rootTask },
  ],
  giveme: [
    { name: 'Give me 5', gen: () => basketTask(1, 5) },
    { name: 'Give me 10', gen: () => basketTask(1, 10) },
    { name: 'Give me 12', gen: () => basketTask(5, 12) },
    { name: 'Add to 20', gen: sumBasketTask },
    { name: 'Add to 100', gen: addTokensTask },
    { name: 'Equal groups', gen: () => { const R = rnd(2, 4), N = rnd(2, 5); return { kind: 'groups', R, N, total: R * N + rnd(1, 3), answer: R * N }; } },
    { name: 'Share it', gen: () => { const R = rnd(2, 5), each = rnd(2, 6); return { kind: 'share', R, total: R * each, each, left: 0, answer: each }; } },
    { name: 'Leftovers', gen: () => { const R = rnd(2, 5), each = rnd(2, 5), left = rnd(1, R - 1); return { kind: 'share', R, total: R * each + left, each, left, answer: each }; } },
    { name: 'Part of a set', gen: fractionBasketTask },
    { name: 'Decimal tokens', gen: decimalTokensTask },
    { name: 'Make a ratio', gen: ratioTokensTask },
    { name: 'Percent of', gen: percentTokensTask },
    { name: 'Percent off', gen: percentChangeTokensTask },
    { name: 'Negative chips', gen: chipsTask },
    { name: 'Powers', gen: powerTokensTask },
  ],
  build: [
    { name: 'Build to 10', gen: () => { const n = rnd(2, 9); return buildTask(n, [0, 0, 0], 'Build ' + n, 'Build ' + numWords(n) + '. Tap plus under the ones.'); } },
    { name: 'Build tens and ones', gen: () => { const n = rnd(11, 99); return buildTask(n, [0, 0, 0], 'Build ' + n, 'Build ' + numWords(n) + '.'); } },
    { name: 'Build hundreds', gen: () => { const n = rnd(101, 999); return buildTask(n, [0, 0, 0], 'Build ' + n, 'Build ' + numWords(n) + '.'); } },
    { name: 'Number puzzles', gen: puzzleTask },
    { name: 'Add and trade', gen: () => { let a, b; do { a = rnd(15, 69); b = rnd(12, 39); } while ((a % 10) + (b % 10) < 10 || a + b > 99); return addTask(a, b); } },
    { name: 'Take away and trade', gen: () => { let a, b; do { a = rnd(31, 95); b = rnd(12, a - 5); } while ((b % 10) <= (a % 10)); return subTask(a, b); } },
    { name: 'Big add and take away', gen: () => { if (Math.random() < .5) { let a, b; do { a = rnd(120, 680); b = rnd(110, 299); } while (a + b > 999 || ((a % 10) + (b % 10) < 10 && (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10) < 10)); return addTask(a, b); }
                                                    let a, b; do { a = rnd(300, 950); b = rnd(110, a - 50); } while ((b % 10) <= (a % 10) && (Math.floor(b / 10) % 10) <= (Math.floor(a / 10) % 10)); return subTask(a, b); } },
    { name: 'Build thousands', gen: () => { const n = rnd(1001, 9999); return buildTask(n, [0, 0, 0, 0], 'Build ' + n.toLocaleString('en-US'), 'Build ' + numWords(n) + '.', { cols: 'four' }); } },
    { name: 'Thousand puzzles', gen: thousandPuzzleTask },
    { name: 'Build decimals', gen: decimalBuildTask },
    { name: 'Decimals and trade', gen: decimalTradeTask },
    { name: 'Powers of ten', gen: powersOfTenTask },
    { name: 'Scientific notation', gen: scientificTask },
    { name: 'Small powers of ten', gen: smallPowersTask },
  ],
  story: [
    { name: 'Stories to 5', gen: () => storyAddSub(5, false) },
    { name: 'Stories to 10', gen: () => storyAddSub(10, false) },
    { name: 'Stories to 20', gen: () => storyAddSub(20, true) },
    { name: 'Stories to 100', gen: () => storyAddSub(100, true) },
    { name: 'Times stories', gen: storyTimes },
    { name: 'Sharing stories', gen: storyShare },

    { name: 'Percents', gen: storyPercents },
    { name: 'Proportions', gen: storyProportions },

    { name: 'Chance', gen: storyChance },

// The grade each rung is for (-1 pre-K, 0 K, 1 to 8), in ladder order. The child opens on the first rung at her grade.
const RUNG_GRADES = {
  howmany: [-1, 0, 1, 2, 2, 2, 3, 3, 4, 4, 5, 5, 6, 7, 8, 8],
  giveme: [-1, 0, 1, 1, 2, 2, 3, 3, 4, 5, 6, 7, 7, 8, 8],
  build: [-1, 1, 2, 2, 2, 2, 3, 4, 4, 5, 5, 6, 7, 8],
  story: [-1, 0, 1, 2, 3, 3, 3, 3, 4, 5, 5, 6, 6, 7, 8, 8],

for (const m in LEVELS) if (RUNG_GRADES[m].length !== LEVELS[m].length) throw new Error('RUNG_GRADES.' + m + ' does not match the ladder');
// Where a new player starts: from the child's level in this subject (set by the parent), 2nd grade when unknown.
// Older shells have no rungFor; they get levelFor, whose second argument is the rung a 2nd grader opens on.
const lf = (n, s) => (window.KidTablet && KidTablet.levelFor ? KidTablet.levelFor('math', n, s) : s);

function tapTask(lo, hi) {
  const n = rnd(lo, hi), opts = new Set([n]);
  while (opts.size < 3) opts.add(Math.max(1, Math.min(hi, n + rnd(-3, 3))));

}
function arrayTask(r1, r2, c1, c2, tapRows) { const r = rnd(r1, r2), c = rnd(c1, c2); return { kind: 'array', r, c, answer: r * c, tapRows }; }

// --- How many? from 3rd grade up: typed answers with a picture to count from ---
function areaTask() {
  const r = rnd(3, 9), o = rnd(2, 9), c = 10 + o;
  return { kind: 'area', r, c, split: 10, answer: r * c, ask: `${r} × ${c}. How many?`,
    speak: `${numWords(r)} rows of ${numWords(c)}. The blue part is ${numWords(r)} times ten. The green part is ${numWords(r)} times ${numWords(o)}. How many in all?`,
    eq: `${r} × 10 + ${r} × ${o} = ?`, hint: `${numWords(r)} times ten is ${numWords(r * 10)}. ${numWords(r)} times ${numWords(o)} is ${numWords(r * o)}. Add them.`,
    done: `${numWords(r)} times ${numWords(c)} is ${numWords(r * c)}.` };
}
function groupsOfTask() {
  const G = rnd(3, 6), N = rnd(12, 29), t = Math.floor(N / 10), o = N % 10;
  return { kind: 'eqgroups', G, N, answer: G * N, ask: `${G} groups of ${N}. How many?`, speak: `${numWords(G)} groups of ${numWords(N)}. How many in all?`,
    eq: `${G} × ${N} = ?`, hint: `Count the tens first. ${numWords(G)} groups of ${numWords(t * 10)} is ${numWords(G * t * 10)}. Then add ${numWords(G)} groups of ${numWords(o)}.`,
    done: `${numWords(G)} times ${numWords(N)} is ${numWords(G * N)}.` };
}
function quotientTask() {
  const N = rnd(6, 12), G = rnd(5, 12), T = N * G;
  if (Math.random() < .5) return { kind: 'quotient', G, N, answer: G, ask: `${T} in groups of ${N}. How many groups?`, speak: `There are ${numWords(T)} in all, in groups of ${numWords(N)}. How many groups?`,
    eq: `${T} ÷ ${N} = ?`, hint: `Count the groups. Or think: ${numWords(N)} times what is ${numWords(T)}?`, done: `${numWords(T)} divided by ${numWords(N)} is ${numWords(G)}.` };
  return { kind: 'quotient', G, N, answer: N, ask: `${T} in ${G} equal groups. How many in each?`, speak: `There are ${numWords(T)} in all, in ${numWords(G)} equal groups. How many in each group?`,
    eq: `${T} ÷ ${G} = ?`, hint: `Count one group. Or think: ${numWords(G)} times what is ${numWords(T)}?`, done: `${numWords(T)} divided by ${numWords(G)} is ${numWords(N)}.` };
}
function gridTask(percent) {

function record(m, right) {

  if (task.coins) {
    const row = document.createElement('div'); row.className = 'coins';
    for (const c of ['q', 'd', 'n', 'p']) for (let i = 0; i < task.coins[c]; i++) { const d = document.createElement('div'); d.className = 'coin ' + c; d.textContent = COINS[c] + '¢'; row.appendChild(d); }
    wrap.appendChild(row);
  }
  const pic = document.createElement('div'); pic.className = 'pic' + (task.text.length > 110 ? ' small' : ''); pic.id = 'pic'; pic.style.whiteSpace = 'pre-line'; wrap.appendChild(pic);
  $('field').appendChild(wrap);
}

// ---------------------------------------------------------------------------
// Answers
// ---------------------------------------------------------------------------
function miss(text) {
  if (!missed) { missed = true; const ch = record(mode, false); if (ch < 0) setTimeout(() => { say('Let us try some easier ones.'); }, 1800); }
  say(text);
}
function win(text, spoken) {
  busy = true; P.stars++; persist(); $('stars').textContent = '⭐ ' + P.stars;
  const ch = missed ? 0 : record(mode, true);
  $('winText').textContent = text; $('win').classList.add('on'); say('Yes! ' + (spoken || text));
  for (let i = 0; i < 12; i++) { const s = document.createElement('div'); s.className = 'thing'; s.style.pointerEvents = 'none'; s.textContent = ['⭐', '✨', '🌟'][i % 3]; s.style.left = rnd(0, 90) + '%'; s.style.top = rnd(0, 90) + '%'; s.style.transition = 'opacity 1.2s'; $('field').appendChild(s); setTimeout(() => s.style.opacity = 0, 50); setTimeout(() => s.remove(), 1300); }
  let wait = 2800 + Math.min(2500, (spoken || text).length * 25);
  if (ch > 0) { const name = LEVELS[mode][P.lv[mode]].name; setTimeout(() => { $('winText').textContent = 'Level up! ' + name; say('Level up! ' + name + '!'); }, wait - 400); wait += 2200; }
  pending = setTimeout(newRound, wait);
}
function choose(n, btn) {
  if (busy) return;
  if (n === task.answer) win(cap(numWords(n)) + ' ' + noun(n, NAMES[emojiOf()]) + '!');
  else { btn.classList.add('no'); setTimeout(() => btn.classList.remove('no'), 500); miss('Not ' + numWords(n) + '. Count them again!'); }
}
const same = (a, b) => Math.abs(a - b) < 1e-6;
function submitTyped() {
  if (busy || typed === '' || typed === '-') return;
  const n = Number(typed), a = task.answer, nm = NAMES[emojiOf()];
  if (!isFinite(n)) return;
  if (same(n, a)) {
    if (task.kind === 'array') win(`${task.r} × ${task.c} = ${a}`, `${numWords(task.r)} rows of ${numWords(task.c)} is ${numWords(a)}.`);
    else if (task.kind === 'frames') { const t = Math.floor(a / 10), o = a % 10; win(`${t} tens and ${o} ones = ${a}`, `${numWords(t)} tens and ${numWords(o)} ones is ${numWords(a)} ${nm}.`); }
    else if (task.kind === 'story') win(task.eq.split('?').join(fmt(a)), cap(numSay(a)) + '. That is right!');
    else win(task.eq.split('?').join(fmt(a)), task.done || cap(numSay(a)) + '. That is right!');
    return;
  }
  $('padShow').classList.add('no'); setTimeout(() => $('padShow').classList.remove('no'), 500);
  typed = ''; showTyped();
  const wasMissed = missed;
  miss('Not ' + numSay(n) + '. Try again!');
  if (wasMissed) showHint();
}
function showTyped() { $('padShow').textContent = typed.replace('-', '−') || ' '; }
// The pad: digits, delete and check. The wide layout (decimals or negatives at this level) adds a minus and a point.
let padWide = null;
function buildPad(wide) {
  if (padWide === wide) { $('padKeys').querySelectorAll('button').forEach(b => { if (b.textContent === '−') b.classList.toggle('off', !task.neg); if (b.textContent === '.') b.classList.toggle('off', !task.dot); }); return; }
  padWide = wide; const keys = wide ? ['7', '8', '9', '4', '5', '6', '1', '2', '3', '−', '0', '.', '⌫', '✔'] : ['7', '8', '9', '4', '5', '6', '1', '2', '3', '⌫', '0', '✔'];
  const pk = $('padKeys'); pk.innerHTML = ''; pk.classList.toggle('wide', wide);
  for (const k of keys) {
    const b = document.createElement('button'); b.textContent = k; if (k === '✔') b.className = 'ok' + (wide ? ' span2' : '');
    if (k === '−') b.classList.toggle('off', !task.neg); if (k === '.') b.classList.toggle('off', !task.dot);
    b.onclick = () => {
      if (busy) return;
      if (k === '⌫') typed = typed.slice(0, -1);
      else if (k === '✔') return submitTyped();
      else if (k === '−') { typed = typed.startsWith('-') ? typed.slice(1) : '-' + typed; say(typed.startsWith('-') ? 'negative' : 'positive'); }
      else if (k === '.') { if (!typed.includes('.')) { typed += (typed === '' || typed === '-') ? '0.' : '.'; say('point'); } }
      else if (typed.replace(/[-.]/g, '').length < 6) { typed = (typed + k).replace(/^(-?)0+(?=\d)/, '$1'); say(k); }
      showTyped();
    };
    pk.appendChild(b);
  }
}

// Drag into the basket or onto plates.
function makeDraggable(t) {
  let dx = 0, dy = 0, drag = false;
  t.addEventListener('pointerdown', e => { if (busy) return; drag = true; t.setPointerCapture(e.pointerId); dx = e.clientX - t.offsetLeft; dy = e.clientY - t.offsetTop; t.style.zIndex = 3; });
  t.addEventListener('pointermove', e => { if (!drag) return; t.style.left = (e.clientX - dx) + 'px'; t.style.top = (e.clientY - dy) + 'px'; });
  t.addEventListener('pointerup', () => { if (!drag) return; drag = false; t.style.zIndex = ''; settle(t); });
}
function zones() { const z = []; if ($('basket').classList.contains('on')) z.push($('basket')); document.querySelectorAll('.plate').forEach(p => z.push(p)); return z; }
function zoneCount(z) { return [...document.querySelectorAll('.thing')].filter(t => t.dataset.in === (z.dataset.zone || 'basket')).length; }
function settle(t) {
  const r = t.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let hit = null;
  for (const z of zones()) { const b = z.getBoundingClientRect(); if (cx > b.left && cx < b.right && cy > b.top - 30 && cy < b.bottom) { hit = z; break; } }
  const was = t.dataset.in || '', now = hit ? (hit.dataset.zone || 'basket') : '';
  if (was === now) return;
  t.dataset.in = now;
  for (const z of zones()) z.querySelector('.count').textContent = zoneCount(z);
  if (hit) say(numWords(zoneCount(hit)));
  else { const from = zones().find(z => (z.dataset.zone || 'basket') === was); if (from) say('Oops, ' + numWords(zoneCount(from))); }
}
function checkPlaced() {
  if (busy) return;
  const nm = NAMES[emojiOf()];
  if (task.kind === 'basket') {
    const n = zoneCount($('basket')), want = task.answer;
    if (n === want) win(task.expr ? `${task.expr} = ${want}` : cap(numWords(want)) + ' ' + noun(want, nm) + '. Perfect!', task.expr ? `${task.say} is ${numWords(want)}.` : '');
    else miss(n < want ? 'Only ' + numWords(n) + '. We need ' + numWords(want) + '. Add some more!' : 'That is ' + numWords(n) + '. Too many! Take some out.');
    return;
  }
  const counts = [...document.querySelectorAll('.plate')].map(zoneCount);
  const loose = [...document.querySelectorAll('.thing')].filter(t => !t.dataset.in).length;
  if (task.kind === 'groups') {
    const bad = counts.findIndex(c => c !== task.N);
    if (bad < 0) return win(`${task.R} groups of ${task.N} = ${task.R * task.N}`, `${numWords(task.R)} groups of ${numWords(task.N)} is ${numWords(task.R * task.N)} ${nm}.`);
    return miss(`Plate ${bad + 1} has ${numWords(counts[bad])}. Every plate needs ${numWords(task.N)}.`);
  }
  // share
  const fair = counts.every(c => c === counts[0]);
  if (!fair) return miss('The plates are not fair yet. Every plate needs the same number.');
  if (loose >= task.R) return miss(counts[0] === 0 ? 'Put some on the plates.' : 'You can still give every plate one more.');
  if (task.left === 0 && loose) return miss('Share all of them.');
  const each = counts[0];
  if (task.left) win(`${task.total} ÷ ${task.R} = ${each}, ${task.left} left over`, `${numWords(task.total)} shared by ${numWords(task.R)} is ${numWords(each)} each, with ${numWords(task.left)} left over.`);
  else win(`${task.total} ÷ ${task.R} = ${each}`, `${numWords(task.total)} shared by ${numWords(task.R)} is ${numWords(each)} each.`);
}
function checkTokens() {
  if (busy) return;
  const { counts, total } = tokenTotals();
  if (task.check === 'ratio') {
    const r = counts.r || 0, b = counts.b || 0, n = r + b;
    if (n !== task.total) return miss(`That is ${numWords(n)} in all. We need ${numWords(task.total)}.` + (n < task.total ? ' Add some more.' : ' Take some out.'));
    if (r * task.q !== b * task.p) return miss(`For every ${numWords(task.p)} red there should be ${numWords(task.q)} blue. Try again.`);
    return win(task.eq, task.done);
  }
  if (!placed.length) return miss('The bin is empty. Tap a token to put it in.');
  if (Math.round(total) === Math.round(task.answer * task.scale)) return win(task.eq, task.done);
  miss('That is ' + numSay(total / task.scale) + '. ' + (total < task.answer * task.scale ? 'We need more.' : 'That is too many.'));
}
function checkBuild() {
  if (busy) return;
  const v = valueOf(blocks), a = task.answer, set = COLSETS[task.cols];
  const over = blocks.findIndex((x, i) => i > 0 && x > 9);
  if (v === a && over < 0) return win(task.eq ? task.eq + ' = ' + buildFmt(a) : buildFmt(a), cap(buildSay(a)) + '!');
  if (v === a) return miss('That is ' + buildSay(a) + ', but you have ' + numWords(blocks[over]) + ' ' + set.names[over] + 's. Trade ten ' + set.names[over] + 's for a ' + set.names[over - 1] + '.');
  miss('That is ' + buildSay(v) + '. ' + (v < a ? 'We need more.' : 'That is too many.'));
}
$('check').onclick = () => (task.kind === 'build' ? checkBuild() : task.kind === 'tokens' ? checkTokens() : checkPlaced());

function showHint() {
  hinted = true;
  switch (task.kind) {
    case 'tap': say('Tap each ' + one(NAMES[emojiOf()]) + ' once. Say the numbers with me.'); break;
    case 'frames': say('A full ten frame is ten. Count the tens: ten, twenty, thirty. Then count the ones.'); break;
    case 'array': say(task.tapRows ? 'Tap each row. Count by ' + numWords(task.c) + 's.' : 'Now you can tap the rows. Count by ' + numWords(task.c) + 's.'); break;
    case 'basket': say(task.hint || 'Drag them in one at a time and count.'); break;
    case 'groups': say('Put ' + numWords(task.N) + ' on the first plate. Then do the next plate.'); break;
    case 'share': say('Give one to each plate, then go around again. Keep going until you cannot give every plate one more.'); break;
    case 'build': say(task.eq ? (task.breakable ? 'Take away the small ones first. If there are not enough, break a bigger block.' : 'Add the small ones first, then the bigger ones. Trade ten for one when you can.') : 'Look at each digit. Start with the biggest place and work to the right.'); break;
    case 'story': { const pic = $('pic'); if (pic) { pic.textContent = (task.pic ? task.pic + '\n' : '') + task.eq; pic.classList.add('on'); } say('Here is a hint. ' + task.eq.replace('?', 'what')); break; }
    default: say(task.hint || task.speak); break;
  }
}

document.querySelectorAll('.pill[data-mode]').forEach(b => b.onclick = () => { document.querySelectorAll('.pill[data-mode]').forEach(x => x.classList.toggle('on', x === b)); mode = b.dataset.mode; newRound(); });
$('again').onclick = () => newRound();
$('hint').onclick = () => { if (!busy) showHint(); };
$('hear').onclick = () => say(task.kind === 'story' ? (task.say || task.text) : task.speak || $('ask').textContent);
$('stars').textContent = '⭐ ' + P.stars;
buildPad(false);
let resizeTimer = null;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (!busy) { counted = 0; render(false); } }, 200); });
newRound(false);
addEventListener('pointerdown', () => say('Count With Me! ' + (task.kind === 'story' ? (task.say || task.text) : task.speak || $('ask').textContent)), { once: true });

// ---------------------------------------------------------------------------
// Self-check hook for tools/ladder-check.mjs. The four ladders are flattened in order: How many?, Give me,
// Build it, Story. exercise(i, n) generates n tasks at that rung without touching the screen and throws when a
// task is malformed: a bad number, a missing answer, text with NaN or undefined in it, or a puzzle that cannot be
// solved with the pieces the screen will offer.
// ---------------------------------------------------------------------------
const ORDER = ['howmany', 'giveme', 'build', 'story'];
const FLAT = ORDER.flatMap(m => LEVELS[m].map((l, i) => ({ m, i })));
function checkTask(m, r, t) {
  const fail = why => { throw new Error(`${m} ${r} ${LEVELS[m][r].name}: ${why} in ${JSON.stringify(t).slice(0, 160)}`); };
  const texts = ['ask', 'prompt', 'speak', 'text', 'eq', 'hint', 'done', 'expr', 'say'].map(k => t[k]).filter(x => x !== undefined);
  for (const s of texts) { if (typeof s !== 'string' || !s.trim()) fail('empty text'); if (/NaN|undefined|null|\[object/.test(s)) fail('bad text ' + s); }
  if (typeof t.answer !== 'number' || !isFinite(t.answer)) fail('bad answer');
  const int = n => Number.isInteger(n);
  switch (t.kind) {
    case 'tap': if (!int(t.answer) || t.answer < t.lo || t.answer > t.hi || !t.choices.includes(t.answer) || new Set(t.choices).size !== 3) fail('tap'); break;
    case 'frames': if (!int(t.answer) || t.answer < 1 || t.answer > 120) fail('frames'); break;
    case 'array': if (t.r * t.c !== t.answer || t.r < 2 || t.c < 2 || t.c > 10) fail('array'); break;
    case 'area': if (t.r * t.c !== t.answer || t.c > 19 || t.r > 9) fail('area'); break;
    case 'eqgroups': if (t.G * t.N !== t.answer || t.G > 6 || t.N > 29) fail('groups'); break;
    case 'quotient': if (![t.G, t.N].includes(t.answer) || t.G > 12 || t.N > 12) fail('quotient'); break;
    case 'grid100': if (t.k < 1 || t.k > 99 || !(same(t.answer, t.k) || same(t.answer, t.k / 100))) fail('grid'); break;
    case 'ratio': if (t.r * t.q !== t.b * t.p || t.r + t.b > 40 || ![t.p, t.q, t.p + t.q].includes(t.answer)) fail('ratio'); break;
    case 'scale': if (!int(t.answer) || t.answer < 1 || t.answer > 108) fail('scale'); break;
    case 'square': if (![t.b, t.b * t.b].includes(t.answer) || t.b > 12) fail('square'); break;
    case 'cube': if (![t.b, t.b ** 3].includes(t.answer) || t.b > 5) fail('cube'); break;
    case 'basket': if (!int(t.answer) || t.answer < 1 || t.total < t.answer || t.total > 24) fail('basket'); break;
    case 'groups': if (t.total < t.R * t.N || t.R > 4 || t.N > 5) fail('plates'); break;
    case 'share': if (t.total !== t.R * t.each + t.left || t.left >= t.R || t.total > 30) fail('share'); break;
    case 'tokens': {
      if (!t.toks || !t.toks.length) fail('no tokens');
      if (t.check === 'ratio') { if (t.answer * t.q !== t.answerB * t.p || t.answer + t.answerB !== t.total || t.total > 20) fail('ratio tokens'); break; }
      const units = Math.round(t.answer * t.scale), vals = t.toks.map(x => x.v);
      if (!int(units) || (units > 0 && !vals.some(v => v > 0)) || (units < 0 && !vals.some(v => v < 0)) || units === 0 || Math.abs(units) > 399) fail('tokens value');
      break;
    }
    case 'build': {
      const set = COLSETS[t.cols]; if (!set || t.start.length !== set.cols.length) fail('cols');
      const cap_ = set.places[0] * 10 - 1; if (!int(t.answer) || t.answer < 0 || t.answer > cap_) fail('build range');
      if (t.start.some(x => x < 0 || x > 9)) fail('start'); break;
    }
    case 'story': if (!t.eq.includes('?') || t.text.length > 230 || (t.answer < 0 && !t.neg) || (!t.dot && !int(t.answer)) || t.answer > 9999) fail('story'); break;
    default: fail('unknown kind ' + t.kind);
  }
}
const describe = t => (t.ask || t.prompt || t.text || (t.kind + ' ' + (t.total || t.r || ''))) + ' -> ' + fmt(t.answer) + (t.answerB != null ? ' red, ' + t.answerB + ' blue' : '');
window.DucklingLadder = {
  levels: () => FLAT.length,
  start: () => START[mode],
  label: () => LEVELS[mode][P.lv[mode]].name,
  rung: i => FLAT[i].m + ' ' + FLAT[i].i + ' ' + LEVELS[FLAT[i].m][FLAT[i].i].name,
  exercise: (i, n) => { const { m, i: r } = FLAT[i]; const out = []; for (let k = 0; k < n; k++) { const t = LEVELS[m][r].gen(); checkTask(m, r, t); out.push(describe(t)); } return out; },
};

// Test hook.
window.CWM = { LEVELS, START, numWords, record, P: () => P, current: () => task, mode: () => mode, setMode: m => document.querySelector(`.pill[data-mode="${m}"]`).click(), blocks: () => blocks, valueOf, placed: () => placed, setTyped: s => { typed = s; showTyped(); }, submit: submitTyped };
</script>
</body>
