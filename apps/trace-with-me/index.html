<script src="voice-config.js"></script>
<script>/* KID-VOICE START */
/* Kid Voice: the narrator voice for every offline app.
   When voice-config.js (written on the tablet from the KidTablet .env) names an Azure Speech key, every line an app
   speaks through speechSynthesis is spoken by the Azure kid voice instead (en-US-AnaNeural unless NARRATOR_VOICE
   says otherwise). Clips are kept in IndexedDB, so a line heard once plays again at once and without the internet.
   Without a config, or when Azure does not answer in time, the line goes to the Windows voice as before.
   The apps keep calling speechSynthesis.speak/cancel; this layer stands in for them and fires the same
   utterance events (start, boundary, end, error), so word highlighting and "then do the next thing" keep working.
   tools/apply-kid-voice.py copies this file into each app between the KID-VOICE markers. Story Maker is left out:
   it has its own cast of voices. */
(function () {
  'use strict';
  var cfg = window.KID_TTS;
  if (!cfg || !cfg.key || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined') return;
  var ss = window.speechSynthesis;
  var orig = { speak: ss.speak.bind(ss), cancel: ss.cancel.bind(ss), pause: ss.pause.bind(ss), resume: ss.resume.bind(ss) };
  var VOICE = cfg.voice || 'en-US-AnaNeural', REGION = cfg.region || 'eastus', WAIT_MS = cfg.waitMs || 4000;
  var ctx = null, current = null, queue = [], seq = 0, mem = new Map(), dbp = null, down = 0;

  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) { window.addEventListener(t, audio, { capture: true, passive: true }); });

  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('kid-voice', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('clips'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  function dbGet(k) { return db().then(function (d) { return new Promise(function (res) { if (!d) return res(null); try { var q = d.transaction('clips').objectStore('clips').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } }); }); }
  function dbPut(k, v) { db().then(function (d) { if (!d) return; try { d.transaction('clips', 'readwrite').objectStore('clips').put(v, k); } catch (e) {} }); }

  function clean(t) {
    return String(t || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function rateOf(u) { var r = Number(u.rate) || 1; return Math.round((Math.max(0.5, Math.min(2, r)) - 1) * 100); }

  // Azure REST synthesis, with a time limit so a slow network falls back to the Windows voice.
  function fetchClip(text, rate) {
    var ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US"><voice name="' + VOICE + '">' +
      '<prosody rate="' + (rate >= 0 ? '+' : '') + rate + '%">' + esc(text) + '</prosody></voice></speak>';
    var ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ac) ac.abort(); }, WAIT_MS);
    return fetch('https://' + REGION + '.tts.speech.microsoft.com/cognitiveservices/v1', {
      method: 'POST', signal: ac ? ac.signal : undefined,
      headers: { 'Ocp-Apim-Subscription-Key': cfg.key, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3' },
      body: ssml
    }).then(function (r) { clearTimeout(timer); return r.ok ? r.arrayBuffer() : null; })
      .catch(function () { clearTimeout(timer); return null; });
  }
  function decode(bytes) {
    var c = audio(); if (!c) return Promise.resolve(null);
    return new Promise(function (res) { try { c.decodeAudioData(bytes.slice(0), function (b) { res(b); }, function () { res(null); }); } catch (e) { res(null); } });
  }
  // One AudioBuffer per line and rate: memory, then IndexedDB, then Azure.
  function clip(text, rate) {
    var k = VOICE + '|' + rate + '|' + text;
    if (mem.has(k)) return mem.get(k);
    var p = dbGet(k).then(function (saved) {
      if (saved) return decode(saved);
      if (Date.now() < down) return null;   // Azure failed a moment ago; do not wait on it again yet
      return fetchClip(text, rate).then(function (bytes) {
        if (!bytes) { down = Date.now() + 30000; return null; }
        dbPut(k, bytes); return decode(bytes);
      });
    }).then(function (b) { if (!b) mem.delete(k); return b; });
    mem.set(k, p);
    return p;
  }

  function fire(u, type, extra) {
    var ev;
    try { ev = new SpeechSynthesisEvent(type, Object.assign({ utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {})); }
    catch (e) { ev = new Event(type); Object.assign(ev, { utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {}); }
    if (type === 'error' && !('error' in ev)) { try { Object.defineProperty(ev, 'error', { value: (extra && extra.error) || 'interrupted' }); } catch (e) {} }
    try { u.dispatchEvent(ev); } catch (e) {}
  }

  function playNext() {
    if (current || !queue.length) return;
    var item = queue.shift(), my = ++seq, u = item.u;
    current = item;
    var text = clean(u.text), rate = rateOf(u);
    if (!text) { current = null; fire(u, 'end'); playNext(); return; }
    clip(text, rate).then(function (buf) {
      var c = audio();
      if (!buf || !c || c.state === 'running') return buf;
      // Audio starts suspended until the page may play sound; give resume() a moment.
      return Promise.race([c.resume().catch(function () {}), new Promise(function (r) { setTimeout(r, 300); })]).then(function () { return buf; });
    }).then(function (buf) {
      if (my !== seq) return;
      var c = audio();
      if (!buf || !c || c.state !== 'running') {   // no clip, or audio not allowed yet: the Windows voice says it
        current = null; item.fallback = true; orig.speak(u); playNext(); return;
      }
      var src = c.createBufferSource(), gain = c.createGain();
      gain.gain.value = u.volume == null ? 1 : Math.max(0, Math.min(1, Number(u.volume)));
      src.buffer = buf; src.connect(gain); gain.connect(c.destination);
      item.src = src; item.timers = [];
      // Word boundaries spread over the clip by letter position, for apps that light up each word.
      var full = String(u.text || ''), re = /\S+/g, m, dur = buf.duration;
      while ((m = re.exec(full))) {
        (function (ci, len) {
          item.timers.push(setTimeout(function () { if (my === seq) fire(u, 'boundary', { name: 'word', charIndex: ci, charLength: len, elapsedTime: dur * (ci / Math.max(1, full.length)) }); }, 1000 * dur * (ci / Math.max(1, full.length))));
        })(m.index, m[0].length);
      }
      src.onended = function () {
        if (my !== seq) return;
        item.timers.forEach(clearTimeout); current = null;
        fire(u, 'end', { charIndex: full.length, elapsedTime: dur });
        playNext();
      };
      fire(u, 'start');
      src.start();
    });
  }

  ss.speak = function (u) {
    if (!(u instanceof SpeechSynthesisUtterance)) return orig.speak(u);
    queue.push({ u: u });
    playNext();
  };
  ss.cancel = function () {
    seq++;
    var was = current; current = null;
    var dropped = queue.splice(0);
    if (was) { if (was.src) { try { was.src.onended = null; was.src.stop(); } catch (e) {} } if (was.timers) was.timers.forEach(clearTimeout); if (!was.fallback) fire(was.u, 'error', { error: 'interrupted' }); }
    dropped.forEach(function (d) { fire(d.u, 'error', { error: 'canceled' }); });
    orig.cancel();
  };
  ss.pause = function () { if (ctx && current && current.src) { try { ctx.suspend(); } catch (e) {} } orig.pause(); };
  ss.resume = function () { if (ctx) { try { ctx.resume(); } catch (e) {} } orig.resume(); };
  try {
    var proto = Object.getPrototypeOf(ss);
    var od = function (n) { var d = Object.getOwnPropertyDescriptor(proto, n); return d && d.get ? d.get.bind(ss) : function () { return false; }; };
    var sp = od('speaking'), pe = od('pending');
    Object.defineProperty(ss, 'speaking', { configurable: true, get: function () { return !!current || sp(); } });
    Object.defineProperty(ss, 'pending', { configurable: true, get: function () { return queue.length > 0 || pe(); } });
  } catch (e) {}
  window.KID_VOICE = { voice: VOICE, region: REGION, clip: clip, active: true };
})();
/* KID-VOICE END */</script>
<script>/* KID-STARS START */
// Kid stars: adds up the stars she has earned in every app and tells the home screen.
// All of her offline apps are local files, which share one browser storage, so any app can read every app's saved
// progress. The total goes to the home screen's small local service (KidHome, http://127.0.0.1:47821), which shows it
// next to her avatar. Put into every app by tools/apply-kid-stars.py; edit this file and run that tool again.
(function () {
  if (window.KID_STARS) return;
  var PORT = 47821, BASE = 'http://127.0.0.1:' + PORT;
  // What counts as stars in an app's saved data:
  //   an object with a number "stars"                     (most games: their progress object)
  //   an object of objects with a number "stars" each      (Level Up: one per subject)
  //   a number saved under a key ending in "-stars"        (Story Maker)
  //   a list saved under a key starting with "lab-done-"   (Chemistry Lab, Kitchen Lab: one star per experiment)
  function starsIn(key, raw) {
    var v; try { v = JSON.parse(raw); } catch (e) { return 0; }
    var n = function (x) { return typeof x === 'number' && isFinite(x) && x > 0 ? Math.floor(x) : 0; };
    if (/^lab-done-/.test(key)) return Array.isArray(v) ? v.length : 0;
    if (/-stars$/.test(key)) return n(v);
    if (!v || typeof v !== 'object' || Array.isArray(v)) return 0;
    if (typeof v.stars === 'number') return n(v.stars);
    var sum = 0;
    for (var k in v) if (v[k] && typeof v[k] === 'object' && typeof v[k].stars === 'number') sum += n(v[k].stars);
    return sum;
  }
  function earned() {
    var total = 0, per = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i); if (!k || /^kid-avatar/.test(k)) continue;
        var s = starsIn(k, localStorage.getItem(k)); if (s) { per[k] = s; total += s; }
      }
    } catch (e) {}
    return { total: total, per: per };
  }
  var last = -1, timer = null;
  function report(force) {
    var e = earned();
    if (!force && e.total === last) return Promise.resolve(e.total);
    last = e.total;
    // A plain text body keeps this a simple request (no preflight). A home screen that is not listening is fine.
    try {
      return fetch(BASE + '/stars', { method: 'POST', body: JSON.stringify({ earned: e.total }) })
        .then(function () { return e.total; }, function () { return e.total; });
    } catch (err) { return Promise.resolve(e.total); }
  }
  // Report after any save, a moment later so a burst of saves sends one report.
  try {
    var set = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) {
      set.apply(this, arguments);
      if (this === window.localStorage && !/^kid-avatar/.test(String(k))) { clearTimeout(timer); timer = setTimeout(report, 800); }
    };
  } catch (e) {}
  window.KID_STARS = { earned: function () { return earned().total; }, breakdown: function () { return earned().per; }, report: report, starsIn: starsIn, base: BASE };
  setTimeout(function () { report(true); }, 1500);
})();
/* KID-STARS END */</script>

<title>Trace With Me</title>
<!--
  Trace With Me. Handwriting from first letters to joined cursive. One file, no network, no API.
  Three modes:
    Little   capital letters, small letters, numbers and shapes in thin school print on handwriting lines, traced
             stroke by stroke from numbered start dots.
    Spell    a word is spoken (with a picture clue). She traces it letter by letter in school print, then writes it
             from memory in letter boxes; each box is read by a small built-in letter matcher. Sixteen rungs, from
             single letters and numerals, through CVC words, sight-word sentences and spelling patterns, to words and
             sentences written from hearing alone (the model appears after the attempt), vocabulary from a definition,
             and 8th grade sentences with commas, apostrophes and quotation marks. Long text wraps onto two rows.
    Cursive  cursive drawn from stroke paths (no fonts): small letters in their teaching groups with a "watch me" pen,
             capitals, joined words, words with only a light guide, the child's name, a sentence from hearing with the
             model shown afterwards, a long line on two rows, and reading a cursive word (tap its printed match).
  Spell and Cursive move up a level after four right first try in a row and down after two missed in a row.
  The rung lists with grade bands sit above SPELL and CURSIVE_LEVELS below.
  Progress is kept in localStorage (key trace-v2); the Little sticker board keeps its old key (tracer-stickers).
-->
<style>
  :root { --ink: #2B2140; --paper: #FFF9F0; --accent: #FF4F8B; --sun: #FFC93C; --sky: #58C7F0; --leaf: #5CD38B; --grape: #9B6BFF; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; color: var(--ink); }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* The right 210px of the header stays clear: the Home pill sits there. */
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px 210px 10px 14px; }
  header h1 { font-size: 26px; margin: 0; font-weight: 900; }
  .decks { display: flex; gap: 8px; }
  .deck, .mode { border: 3px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 16px; font-size: 20px; font-weight: 800; cursor: pointer; }
  .deck.on, .mode.on { background: var(--sun); }
  #badge { font-size: 17px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 5px 12px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
  #stars { font-size: 22px; font-weight: 900; margin-left: auto; }
  /* On a 1024 wide screen the header keeps to one line: smaller title, tighter mode buttons, a badge that trims. */
  @media (max-width: 1100px) {
    header { gap: 8px; }
    header h1 { font-size: 20px; }
    .mode { padding: 7px 13px; font-size: 18px; }
    #badge { font-size: 15px; max-width: 280px; padding: 5px 10px; }
    /* Spanish labels are longer: tighter mode buttons and a narrower badge keep the header on one line. */
    html[lang="es"] .mode, html[lang="es"] .deck[data-deck] { padding: 7px 10px; font-size: 17px; }
    html[lang="es"] #badge { max-width: 250px; }
  }
  .hide { display: none !important; }
  main { position: relative; min-height: 0; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  canvas#c { background: #fff; border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 10px 0 #E7DCCF; touch-action: none; max-width: 100%; max-height: 100%; aspect-ratio: 1 / 1; }
  #wide { position: absolute; inset: 8px 14px 4px; }
  canvas#w { width: 100%; height: 100%; background: #fff; border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 10px 0 #E7DCCF; touch-action: none; box-sizing: border-box; display: block; }
  #word { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); font-size: 30px; font-weight: 900; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px; pointer-events: none; white-space: nowrap; z-index: 2; max-width: 82%; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  #choices { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 12px; z-index: 2; max-width: 96%; flex-wrap: wrap; justify-content: center; }
  #choices .choice { font-size: 24px; padding: 8px 22px; }
  #choices .choice:disabled { opacity: .35; }
  #meter { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: 46%; height: 22px; background: #fff; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; pointer-events: none; z-index: 2; }
  #meter i { display: block; height: 100%; width: 0; background: var(--leaf); transition: width .15s; }
  footer { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px 14px 16px; }
  footer button { border: 4px solid var(--ink); background: #fff; border-radius: 50%; width: 76px; height: 76px; font-size: 34px; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
  footer button:active { transform: scale(.93); }
  footer button.big { width: 92px; height: 92px; background: var(--sun); }
  footer button:disabled { opacity: .35; }
  #win { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; z-index: 5; }
  #win.on { display: grid; }
  #win .card { background: #fff; border: 4px solid var(--ink); border-radius: 28px; padding: 22px 36px; font-size: 44px; font-weight: 900; text-align: center; box-shadow: 0 12px 0 var(--accent); animation: pop .4s cubic-bezier(.2,1.6,.4,1); max-width: 84%; box-sizing: border-box; }
  #win .card small { display: block; font-size: 60px; margin-top: 6px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .spark { position: absolute; font-size: 44px; animation: fly 1.1s ease-out forwards; pointer-events: none; z-index: 6; }
  @keyframes fly { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(40deg); opacity: 0; } }
  #board { position: fixed; inset: 0; background: rgba(43,33,64,.85); display: none; padding: 24px; overflow: auto; z-index: 10; }
  #board.on { display: block; }
  #board .sheet { background: var(--paper); border-radius: 28px; padding: 20px; max-width: 900px; margin: 0 auto; }
  #board h2 { margin: 0 0 12px; font-size: 30px; }
  #stickers { display: grid; grid-template-columns: repeat(auto-fill, 86px); gap: 10px; }
  #stickers div { width: 86px; height: 86px; border-radius: 18px; background: #fff; border: 3px dashed #cfc5b8; display: grid; place-items: center; font-size: 44px; }
  #stickers div.got { border: 3px solid var(--ink); background: var(--sun); }
  #stickers div.got::after { content: attr(data-l); position: relative; margin-top: -78px; margin-left: 58px; font-size: 16px; font-weight: 900; background: #fff; border-radius: 999px; padding: 0 6px; }
  #board button { margin-top: 14px; }
  #boardNote { font-size: 20px; font-weight: 700; margin: 0 0 12px; }
</style>

<script id="voicepack">/* voice pack goes here: run voices/make-voices.py */</script>
<script>
// ---------------------------------------------------------------------------
// Voice clips. If a voice pack is present (window.VOICE_PACK: phrase -> base64 MP3, made by voices/make-voices.py),
// a phrase is played from its clip through Web Audio; otherwise the Windows voice reads it. Bytes are decoded in
// memory (no data: or blob: URLs, which the kiosk blocks).
// ---------------------------------------------------------------------------
const VOICE = (() => {
  let actx = null, cur = null; const decoded = new Map();
  const key = t => String(t).trim().toLowerCase().replace(/\s+/g, ' ');
  function ctx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
  function stop() { if (cur) { try { cur.onended = null; cur.stop(); } catch (e) {} cur = null; } }
  function has(t) { const p = window.VOICE_PACK; return !!(p && p[key(t)]); }
  function play(t, done) {
    const p = window.VOICE_PACK, k = key(t); if (!p || !p[k]) return false;
    const a = ctx(); if (!a) return false;
    const go = (buf) => { stop(); const s = a.createBufferSource(); s.buffer = buf; s.connect(a.destination); s.onended = () => { if (cur === s) { cur = null; if (done) done(); } }; cur = s; s.start(); };
    try {
      if (decoded.has(k)) { go(decoded.get(k)); return true; }
      const bin = atob(p[k]), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      a.decodeAudioData(bytes.buffer.slice(0)).then(buf => { decoded.set(k, buf); go(buf); }).catch(() => { if (done) done(); });
      return true;
    } catch (e) { return false; }
  }
  return { play, stop, has, key };
})();

function say(text) {
  try { speechSynthesis.cancel(); } catch (e) {}
  VOICE.stop(); if (VOICE.play(text)) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = LANG === 'es' ? 'es-MX' : 'en-US'; u.rate = 0.9; u.pitch = 1.1; speechSynthesis.speak(u); } catch (e) {}
}
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------------------------------------------------------------------------
// Language. On a Duckling tablet set to Spanish (KidTablet.language) every line the child sees or hears comes from ES,

    if (guideCoverage(b.glyph) >= 0.8 && offGuide(b.glyph, mine) <= 0.35) { b.state = 'ok'; say(charName(b.ch)); }
  });
  renderWide();
  if (layout.boxes.every(b => b.state === 'ok')) { busy = true; setTimeout(() => { busy = false; startWrite(); }, 1100); }
}
function checkCursive() {
  const mine = phase === 'reveal' ? strokes.filter(st => st.after) : strokes;
  const c = guideCoverage(layout.guides), off = offGuide(layout.guides, mine);
  const need = cur.single ? 0.86 : 0.82;
  meter.style.width = Math.round(Math.min(1, c / need) * 100) + '%';
  if (c >= need && off <= 0.3) return winWide();
  if (c >= need && !nudgedW) { nudgedW = true; missed = true; say(T('Try to stay on the line. Tap the drop to start over.')); }
}
// A cursive sentence from hearing: a close enough attempt wins outright; otherwise, after a pause, the model appears
// and she traces it to check her letters.
function checkCursiveWrite() {
  const { cov, off, size } = alignedScore(layout.guides, strokes);
  meter.style.width = Math.round(Math.min(1, cov / 0.5) * 100) + '%';
  if (cov >= 0.5 && off <= 0.5 && size >= 0.5 && size <= 3) return winWide();
  gradeTimer = setTimeout(revealModel, TRACE_HOOK.revealMs);
}
function revealModel() {
  if (phase !== 'write' || cur.kind !== 'cursive') return;
  phase = 'reveal'; missed = true; nudgedW = false; meter.style.width = '0';
  setLabel(cur.text); renderWide();
  say(T('Here it is. {t} Trace it to check your letters.', { t: cur.text }));
}
function chooseRead(word, btn) {
  if (busy || phase !== 'read') return;
  if (word === cur.text) { btn.classList.add('on'); say(word); return winWide(); }
  missed = true; btn.disabled = true; say(T('That says {w}. Look again.', { w: word }));
}
function boxStrokesInUnits(i) {
  const { s } = layout, b = layout.boxes[i];
  return strokes.filter(st => st.box === i).map(st => st.pts.map(([x, y]) => [(x - b.ox) / s - b.lx, (y - b.oy) / s]));
}
function gradeBox(i) {
  clearTimeout(gradeTimer);
  const b = layout.boxes[i]; if (!b || b.state !== 'inked') return;
  const res = recognize(boxStrokesInUnits(i), b.ch); b.last = res;
  if (res.ok) { b.state = 'ok'; renderWide(); say(charName(b.ch)); if (layout.boxes.every(x => x.state === 'ok')) winWide(); return; }
  missed = true; b.tries++;
  strokes = strokes.filter(st => st.box !== i); redrawInk();
  if (b.tries >= 2) { b.state = 'ghost'; say(T('This one is {c}. Trace it.', { c: charName(b.ch) })); }
  else { b.state = 'retry'; b.flash = true; say(cur.sentenceLike ? T('Hmm, try that one again.') : T('Hmm, try that letter again. {w}.', { w: cur.word })); }
  renderWide();
}
function checkGhost(i) {
  const b = layout.boxes[i]; const mine = strokes.filter(s => s.box === i);
  if (guideCoverage(b.glyph) >= 0.75 && offGuide(b.glyph, mine) <= 0.4) { b.state = 'ok'; b.shown = true; renderWide(); say(charName(b.ch)); if (layout.boxes.every(x => x.state === 'ok')) winWide(); }
}
function winWide() {
  busy = true; clearTimeout(gradeTimer);
  const right = !missed, ch = record(mode, right);
  P.stars++; if (mode === 'spell') P.words++; else P.cursive++; persist(); showStars();
  // The model stays on the board as feedback for anything written without one.
  if (cur.kind === 'spell' && cur.dictate) for (const b of layout.boxes) b.shown = true;
  if (cur.kind === 'cursive' && phase === 'write') phase = 'reveal';
  renderWide();
  const plain = cur.kind === 'spell' && (LANG === 'es' ? /^[a-záéíóúüñ]+$/ : /^[a-z]+$/).test(cur.word);
  const spelled = plain ? T('{letters}. {w}!', { letters: cur.word.split('').join(', '), w: cur.word }) : '';
  const winText = cur.kind === 'spell' ? cur.word : (cur.single ? T('Cursive {t}', { t: cur.text }) : cur.text);
  $('winText').textContent = winText; $('winText').style.fontSize = winText.length > 16 ? '28px' : '';
  $('winEmoji').textContent = cur.kind === 'spell' ? (cur.emoji || '⭐') : cur.read ? '👀' : '✍️';
  $('win').classList.add('on'); sparkle();
  say(cur.kind === 'spell' ? (plain ? T('You spelled it! {s}', { s: spelled }) : cur.single ? T('You wrote {c}!', { c: spokenChar(cur.word) }) : T('You wrote it! {w}', { w: cur.word })) : cur.read ? T('You read it! {t}', { t: cur.text }) : T('Beautiful cursive!'));
  let wait = 3000;
  if (ch > 0) { setTimeout(() => { const name = T(LEVELS[mode][P.lv[mode]].name); $('winText').textContent = T('Level up!'); $('winText').style.fontSize = ''; $('winEmoji').textContent = name; say(T('Level up! {name}!', { name })); }, 2600); wait = 5000; }
  else if (ch < 0) setTimeout(() => say(T('Let us practise some easier ones.')), 2600);
  winTimer = setTimeout(() => { if (mode !== 'little') { nudgedW = false; loadWide(); } }, wait);
}
let winTimer = null;
function clearWide() {
  if (busy || !cur) return;
  clearTimeout(gradeTimer);
  if (strokes.length) missed = missed || cur.kind === 'cursive';
  if (cur.kind === 'spell') {
    const keep = new Set(layout.boxes.map((b, i) => b.state === 'ok' ? i : -1));
    strokes = strokes.filter(st => keep.has(st.box));
    for (const b of layout.boxes) if (b.state === 'inked' || b.state === 'retry') b.state = 'empty';
  } else { strokes = []; meter.style.width = '0'; nudgedW = false; }
  redrawInk(); renderWide();
}

// ===========================================================================
// Modes and buttons
// ===========================================================================
function showStars() { $('stars').textContent = mode === 'little' ? '' : '⭐ ' + P.stars; }
function setMode(m) {
  clearTimeout(winTimer); clearTimeout(lookTimer); clearTimeout(gradeTimer); stopDemo();
  mode = m; busy = false;
  document.querySelectorAll('.mode').forEach(x => x.classList.toggle('on', x.dataset.mode === m));
  const little = m === 'little';
  $('decks').classList.toggle('hide', !little); $('badge').classList.toggle('hide', little);
  $('stage').classList.toggle('hide', !little); $('wide').classList.toggle('hide', little); $('choices').classList.add('hide');
  $('prev').classList.toggle('hide', !little); $('meter').classList.remove('hide');
  showStars();
  if (little) { requestAnimationFrame(() => { fit(); loadLittle(idx); }); }
  else requestAnimationFrame(() => loadWide());
  try { localStorage.setItem('trace-mode', m); } catch (e) {}
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('prev').onclick = () => { if (mode === 'little') loadLittle(idx - 1); };
$('next').onclick = () => { if (mode === 'little') loadLittle(idx + 1); else { clearTimeout(winTimer); clearTimeout(lookTimer); loadWide(); } };
$('clear').onclick = () => { if (mode === 'little') loadLittle(idx, false); else clearWide(); };
$('hear').onclick = () => {
  if (mode === 'little') return say(item().say);
  if (cur.kind === 'spell') say(cur.hear);
  else if (cur.read) say(T('Read the cursive word. Tap the printed word that matches.'));
  else if (cur.dictate && phase === 'write') say(T('Write this sentence in cursive. {t}', { t: cur.text }));
  else say(cur.single ? T(cur.upper ? 'Cursive capital {t}' : 'Cursive {t}', { t: cur.text }) : cur.text);
};
document.querySelectorAll('.deck[data-deck]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.deck[data-deck]').forEach(x => x.classList.toggle('on', x === b));
  deck = b.dataset.deck; loadLittle(0);
});
$('board-btn').onclick = () => {
  const got = new Set(loadStickers()), grid = $('stickers'); grid.innerHTML = '';
  for (const d of Object.values(DECKS)) for (const it of d) {
    const cell = document.createElement('div'); cell.dataset.l = it.label; cell.textContent = got.has(it.id) ? (it.emoji.length > 4 ? it.emoji.slice(0, 2) : it.emoji) : '';
    if (got.has(it.id)) cell.classList.add('got'); grid.appendChild(cell);
  }
  $('boardNote').textContent = T('⭐ {n}: {w} words spelled, {c} cursive.', { n: P.stars, w: P.words, c: P.cursive });
  $('board').classList.add('on');
  say(T('You have {n} stickers!', { n: got.size }));
};
$('board-close').onclick = () => $('board').classList.remove('on');

function fit() { const m = document.querySelector('main'), s = Math.min(m.clientWidth, m.clientHeight) - 24; cv.style.width = cv.style.height = s + 'px'; }
let rz = null;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (mode === 'little') fit(); else if (cur && !busy) { sizeWide(); layout = buildLayout(); strokes = []; if (phase === 'write') for (const b of layout.boxes) b.state = 'empty'; redrawInk(); renderWide(); } }, 200); });
const TRACE_HOOK = { lookMs: 3500, gradeMs: 1500, revealMs: 4000 };
// The markup written in English is translated once at startup; in English this changes nothing.
document.title = T('Trace With Me');
document.querySelectorAll('header h1, .mode, #board h2, #board-close').forEach(el => { el.textContent = T(el.textContent); });
document.querySelectorAll('footer button[title]').forEach(el => { el.title = T(el.title); });
if (LANG === 'es') document.documentElement.lang = 'es';
let startMode = 'spell'; try { startMode = localStorage.getItem('trace-mode') || 'spell'; } catch (e) {}
if (!['little', 'spell', 'cursive'].includes(startMode)) startMode = 'spell';
setMode(startMode);
addEventListener('pointerdown', () => { if (mode === 'little') say(T('Trace With Me! {s}', { s: item().say })); else $('hear').click(); }, { once: true });

// Test hook.
window.TRACE = {
  PRINT_UPPER, PRINT_DIGITS, SHAPE_D, littleGuides: () => guides, littleProgress: progress, littleNext: nextStroke, littleWon: () => won,
  littleLoad: (d, i) => { deck = d; loadLittle(i, false); }, littleClient: () => { const r = cv.getBoundingClientRect(), k = r.width / 1000; return guides.map(st => st.map(([x, y]) => [r.left + x * k, r.top + y * k])); },
  PRINT, PRINT_ALT, PUNCT, CURSIVE, CURSIVE_UPPER, SPELL, CURSIVE_LEVELS, SPELL_GRADES, CURSIVE_GRADES, START, SLANT, opts: TRACE_HOOK,
  samplePath, cursiveWord, slant, printLetter, recognize, features, record, makeItem,
  P: () => P, current: () => cur, phase: () => phase, layout: () => layout, mode: () => mode, setMode,
  load: () => loadWide(false), startWrite: () => startWrite(false),
  // Guide strokes in page (client) coordinates, for driving the mouse in tests.
  clientGuides: () => { const r = wc.getBoundingClientRect(), k = r.width / WCSS.w; const map = st => st.map(([x, y]) => [r.left + x * k, r.top + y * k]); return cur.kind === 'spell' ? layout.boxes.map(b => b.glyph.map(map)) : [layout.guides.map(map)]; },
  boxes: () => layout.boxes.map(b => ({ ch: b.ch, state: b.state, last: b.last && b.last.ranking })),
  toClient: (i, unitStrokes) => { const r = wc.getBoundingClientRect(), k = r.width / WCSS.w, b = layout.boxes[i]; return unitStrokes.map(st => st.map(([x, y]) => [r.left + (b.ox + (x + b.lx) * layout.s) * k, r.top + (b.oy + y * layout.s) * k])); },
  itemFor, layoutFor, alignedScore, reveal: revealModel, choose: chooseRead,
};

// Self-check hook for tools/ladder-check.mjs. The app has two ladders, so the rungs are counted end to end: spell rungs
// first (0 to SPELL.length - 1), then the cursive rungs. exercise() builds items without touching the board and
// throws when one cannot be laid out, has a stray value in its text, or (reading) has no answer among its choices.
function checkItem(it, m) {
  const texts = it.kind === 'spell' ? [it.word, it.sentence, it.emoji, it.ask, it.hear, it.label] : [it.text];
  for (const t of texts) { if (typeof t !== 'string' || /undefined|NaN|null/.test(t)) throw new Error('bad text ' + JSON.stringify(t)); }
  const text = it.kind === 'spell' ? it.word : it.text;
  if (!text.trim()) throw new Error('empty item');
  if (text.length > 48) throw new Error('too long: ' + text);
  const L = layoutFor(it, 996, 432);                      // the board at 1024 x 640
  if (!(L.s > 0.3)) throw new Error('too small to write: ' + text + ' s=' + L.s);
  const pts = it.kind === 'spell' ? L.boxes.flatMap(b => b.glyph) : L.guides;
  if (!pts.length) throw new Error('nothing to trace: ' + text);
  for (const st of pts) for (const [x, y] of st) if (!isFinite(x) || !isFinite(y) || x < -2 || y < -2 || x > 998 || y > 436) throw new Error('off the board: ' + text);
  if (it.kind === 'spell') { if (L.boxes.length !== text.replace(/ /g, '').length) throw new Error('box count: ' + text); }
  if (it.read) { if (!Array.isArray(it.choices) || it.choices.length !== 4 || new Set(it.choices).size !== 4 || !it.choices.includes(it.text)) throw new Error('bad choices for ' + text); }
  if (m === 'cursive' && !it.read && !it.dictate && !it.light && !it.single && !it.demo && L.rows.length > 1) throw new Error('traced word wraps: ' + text);
}
if (SPELL_GRADES.length !== SPELL.length || CURSIVE_GRADES.length !== CURSIVE_LEVELS.length) throw new Error('rung grade lists do not match the ladders');
window.DucklingLadder = {
  levels: () => SPELL.length + CURSIVE_LEVELS.length,
  start: () => START,
  label: () => $('badge').textContent,
  exercise: (i, n) => {
    const m = i < SPELL.length ? 'spell' : 'cursive', li = m === 'spell' ? i : i - SPELL.length;
    const list = entries(m, li); if (!list.length) throw new Error('empty rung');
    const out = [];
    for (let k = 0; k < n; k++) { const it = itemFor(m, li, pick(list)); checkItem(it, m); out.push(LEVELS[m][li].name + ': ' + (it.kind === 'spell' ? it.word : it.read ? it.text + ' [' + it.choices.join(' ') + ']' : it.text)); }
    return out;
  },
};
