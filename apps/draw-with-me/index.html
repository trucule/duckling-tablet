<!doctype html>
<html lang="en">
<head>
<script src="voice-config.js"></script>
<script>/* KID-VOICE START */
/* Kid Voice: the narrator voice for every offline app.
   When voice-config.js (written on the tablet from the KidTablet .env) names an Azure Speech key, every line an app
   speaks through speechSynthesis is spoken by the Azure kid voice instead (en-US-AnaNeural unless NARRATOR_VOICE
   says otherwise). Clips are kept in IndexedDB, so a line heard once plays again at once and without the internet.
   Without a config, or when Azure does not answer in time, the line goes to the Windows voice as before.
   The apps keep calling speechSynthesis.speak/cancel; this layer stands in for them and fires the same
   utterance events (start, boundary, end, error), so word highlighting and "then do the next thing" keep working.
   tools/apply-kid-voice.py copies this file into each app between the KID-VOICE markers. Story Maker is left out:
   it has its own cast of voices. */
(function () {
  'use strict';
  var cfg = window.KID_TTS;
  if (!cfg || !cfg.key || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined') return;
  var ss = window.speechSynthesis;
  var orig = { speak: ss.speak.bind(ss), cancel: ss.cancel.bind(ss), pause: ss.pause.bind(ss), resume: ss.resume.bind(ss) };
  var VOICE = cfg.voice || 'en-US-AnaNeural', REGION = cfg.region || 'eastus', WAIT_MS = cfg.waitMs || 4000;
  var ctx = null, current = null, queue = [], seq = 0, mem = new Map(), dbp = null, down = 0;

  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) { window.addEventListener(t, audio, { capture: true, passive: true }); });

  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('kid-voice', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('clips'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  function dbGet(k) { return db().then(function (d) { return new Promise(function (res) { if (!d) return res(null); try { var q = d.transaction('clips').objectStore('clips').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } }); }); }
  function dbPut(k, v) { db().then(function (d) { if (!d) return; try { d.transaction('clips', 'readwrite').objectStore('clips').put(v, k); } catch (e) {} }); }

  function clean(t) {
    return String(t || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function rateOf(u) { var r = Number(u.rate) || 1; return Math.round((Math.max(0.5, Math.min(2, r)) - 1) * 100); }

  // Azure REST synthesis, with a time limit so a slow network falls back to the Windows voice.
  function fetchClip(text, rate) {
    var ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US"><voice name="' + VOICE + '">' +
      '<prosody rate="' + (rate >= 0 ? '+' : '') + rate + '%">' + esc(text) + '</prosody></voice></speak>';
    var ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ac) ac.abort(); }, WAIT_MS);
    return fetch('https://' + REGION + '.tts.speech.microsoft.com/cognitiveservices/v1', {
      method: 'POST', signal: ac ? ac.signal : undefined,
      headers: { 'Ocp-Apim-Subscription-Key': cfg.key, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3' },
      body: ssml
    }).then(function (r) { clearTimeout(timer); return r.ok ? r.arrayBuffer() : null; })
      .catch(function () { clearTimeout(timer); return null; });
  }
  function decode(bytes) {
    var c = audio(); if (!c) return Promise.resolve(null);
    return new Promise(function (res) { try { c.decodeAudioData(bytes.slice(0), function (b) { res(b); }, function () { res(null); }); } catch (e) { res(null); } });
  }
  // One AudioBuffer per line and rate: memory, then IndexedDB, then Azure.
  function clip(text, rate) {
    var k = VOICE + '|' + rate + '|' + text;
    if (mem.has(k)) return mem.get(k);
    var p = dbGet(k).then(function (saved) {
      if (saved) return decode(saved);
      if (Date.now() < down) return null;   // Azure failed a moment ago; do not wait on it again yet
      return fetchClip(text, rate).then(function (bytes) {
        if (!bytes) { down = Date.now() + 30000; return null; }
        dbPut(k, bytes); return decode(bytes);
      });
    }).then(function (b) { if (!b) mem.delete(k); return b; });
    mem.set(k, p);
    return p;
  }

  function fire(u, type, extra) {
    var ev;
    try { ev = new SpeechSynthesisEvent(type, Object.assign({ utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {})); }
    catch (e) { ev = new Event(type); Object.assign(ev, { utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {}); }
    if (type === 'error' && !('error' in ev)) { try { Object.defineProperty(ev, 'error', { value: (extra && extra.error) || 'interrupted' }); } catch (e) {} }
    try { u.dispatchEvent(ev); } catch (e) {}
  }

  function playNext() {
    if (current || !queue.length) return;
    var item = queue.shift(), my = ++seq, u = item.u;
    current = item;
    var text = clean(u.text), rate = rateOf(u);
    if (!text) { current = null; fire(u, 'end'); playNext(); return; }
    clip(text, rate).then(function (buf) {
      var c = audio();
      if (!buf || !c || c.state === 'running') return buf;
      // Audio starts suspended until the page may play sound; give resume() a moment.
      return Promise.race([c.resume().catch(function () {}), new Promise(function (r) { setTimeout(r, 300); })]).then(function () { return buf; });
    }).then(function (buf) {
      if (my !== seq) return;
      var c = audio();
      if (!buf || !c || c.state !== 'running') {   // no clip, or audio not allowed yet: the Windows voice says it
        current = null; item.fallback = true; orig.speak(u); playNext(); return;
      }
      var src = c.createBufferSource(), gain = c.createGain();
      gain.gain.value = u.volume == null ? 1 : Math.max(0, Math.min(1, Number(u.volume)));
      src.buffer = buf; src.connect(gain); gain.connect(c.destination);
      item.src = src; item.timers = [];
      // Word boundaries spread over the clip by letter position, for apps that light up each word.
      var full = String(u.text || ''), re = /\S+/g, m, dur = buf.duration;
      while ((m = re.exec(full))) {
        (function (ci, len) {
          item.timers.push(setTimeout(function () { if (my === seq) fire(u, 'boundary', { name: 'word', charIndex: ci, charLength: len, elapsedTime: dur * (ci / Math.max(1, full.length)) }); }, 1000 * dur * (ci / Math.max(1, full.length))));
        })(m.index, m[0].length);
      }
      src.onended = function () {
        if (my !== seq) return;
        item.timers.forEach(clearTimeout); current = null;
        fire(u, 'end', { charIndex: full.length, elapsedTime: dur });
        playNext();
      };
      fire(u, 'start');
      src.start();
    });
  }

  ss.speak = function (u) {
    if (!(u instanceof SpeechSynthesisUtterance)) return orig.speak(u);
    queue.push({ u: u });
    playNext();
  };
  ss.cancel = function () {
    seq++;
    var was = current; current = null;
    var dropped = queue.splice(0);
    if (was) { if (was.src) { try { was.src.onended = null; was.src.stop(); } catch (e) {} } if (was.timers) was.timers.forEach(clearTimeout); if (!was.fallback) fire(was.u, 'error', { error: 'interrupted' }); }
    dropped.forEach(function (d) { fire(d.u, 'error', { error: 'canceled' }); });
    orig.cancel();
  };
  ss.pause = function () { if (ctx && current && current.src) { try { ctx.suspend(); } catch (e) {} } orig.pause(); };
  ss.resume = function () { if (ctx) { try { ctx.resume(); } catch (e) {} } orig.resume(); };
  try {
    var proto = Object.getPrototypeOf(ss);
    var od = function (n) { var d = Object.getOwnPropertyDescriptor(proto, n); return d && d.get ? d.get.bind(ss) : function () { return false; }; };
    var sp = od('speaking'), pe = od('pending');
    Object.defineProperty(ss, 'speaking', { configurable: true, get: function () { return !!current || sp(); } });
    Object.defineProperty(ss, 'pending', { configurable: true, get: function () { return queue.length > 0 || pe(); } });
  } catch (e) {}
  window.KID_VOICE = { voice: VOICE, region: REGION, clip: clip, active: true };
})();
/* KID-VOICE END */</script>
<script>/* KID-STARS START */
// Kid stars: adds up the stars she has earned in every app and tells the home screen.
// All of her offline apps are local files, which share one browser storage, so any app can read every app's saved
// progress. The total goes to the home screen's small local service (KidHome, http://127.0.0.1:47821), which shows it
// next to her avatar. Put into every app by tools/apply-kid-stars.py; edit this file and run that tool again.
(function () {
  if (window.KID_STARS) return;
  var PORT = 47821, BASE = 'http://127.0.0.1:' + PORT;
  // What counts as stars in an app's saved data:
  //   an object with a number "stars"                     (most games: their progress object)
  //   an object of objects with a number "stars" each      (Level Up: one per subject)
  //   a number saved under a key ending in "-stars"        (Story Maker)
  //   a list saved under a key starting with "lab-done-"   (Chemistry Lab, Kitchen Lab: one star per experiment)
  function starsIn(key, raw) {
    var v; try { v = JSON.parse(raw); } catch (e) { return 0; }
    var n = function (x) { return typeof x === 'number' && isFinite(x) && x > 0 ? Math.floor(x) : 0; };
    if (/^lab-done-/.test(key)) return Array.isArray(v) ? v.length : 0;
    if (/-stars$/.test(key)) return n(v);
    if (!v || typeof v !== 'object' || Array.isArray(v)) return 0;
    if (typeof v.stars === 'number') return n(v.stars);
    var sum = 0;
    for (var k in v) if (v[k] && typeof v[k] === 'object' && typeof v[k].stars === 'number') sum += n(v[k].stars);
    return sum;
  }
  function earned() {
    var total = 0, per = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i); if (!k || /^kid-avatar/.test(k)) continue;
        var s = starsIn(k, localStorage.getItem(k)); if (s) { per[k] = s; total += s; }
      }
    } catch (e) {}
    return { total: total, per: per };
  }
  var last = -1, timer = null;
  function report(force) {
    var e = earned();
    if (!force && e.total === last) return Promise.resolve(e.total);
    last = e.total;
    // A plain text body keeps this a simple request (no preflight). A home screen that is not listening is fine.
    try {
      return fetch(BASE + '/stars', { method: 'POST', body: JSON.stringify({ earned: e.total }) })
        .then(function () { return e.total; }, function () { return e.total; });
    } catch (err) { return Promise.resolve(e.total); }
  }
  // Report after any save, a moment later so a burst of saves sends one report.
  try {
    var set = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) {
      set.apply(this, arguments);
      if (this === window.localStorage && !/^kid-avatar/.test(String(k))) { clearTimeout(timer); timer = setTimeout(report, 800); }
    };
  } catch (e) {}
  window.KID_STARS = { earned: function () { return earned().total; }, breakdown: function () { return earned().per; }, report: report, starsIn: starsIn, base: BASE };
  setTimeout(function () { report(true); }, 1500);
})();
/* KID-STARS END */</script>
<script>/* KID-TAP START */
// Put into apps that have scrolling panels by tools/apply-kid-tap.py. Edit here and run that again.
// Finger taps on buttons inside scrolling panels. A panel that scrolls lets the browser take a finger tap that wobbles a
// little as the start of a scroll and cancel it (a stylus is steadier). A touch that moves less than 12 pixels counts as a tap on the
// button under it, and the browser's own click that may follow is dropped so nothing happens twice.
(function () {
  let down = null, swallow = null;
  const btn = t => t && t.closest && t.closest('button');
  document.addEventListener('pointerdown', e => {
    down = e.pointerType === 'touch' && btn(e.target) ? { b: btn(e.target), x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 } : null;
  }, true);
  document.addEventListener('pointermove', e => { if (down && e.pointerType === 'touch') down.moved = Math.max(down.moved, Math.hypot(e.clientX - down.x, e.clientY - down.y)); }, true);
  const end = e => {
    if (!down || e.pointerType !== 'touch') return;
    const d = down; down = null;
    if (d.moved < 12 && performance.now() - d.t < 800 && d.b.isConnected && !d.b.disabled) {
      swallow = { x: d.x, y: d.y, until: performance.now() + 700 };
      d.b.click();
    }
  };
  document.addEventListener('pointerup', end, true);
  document.addEventListener('pointercancel', end, true);
  document.addEventListener('click', e => {
    if (swallow && e.isTrusted && performance.now() < swallow.until && Math.hypot(e.clientX - swallow.x, e.clientY - swallow.y) < 40) {
      e.stopPropagation(); e.preventDefault(); swallow = null;
    }
  }, true);
})();
/* KID-TAP END */</script>

<title>Draw With Me</title>
<style>
  :root { --ink: #2B2140; --bg: #FFF8EC; --pink: #FF4F8B; --green: #3BB273; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  section { position: fixed; inset: 0; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 18px max(14px, env(safe-area-inset-bottom)); }
  section[hidden] { display: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .round { width: 72px; height: 72px; border-radius: 50%; border: 4px solid var(--ink); background: #FFFFFF; font-size: 34px; display: grid; place-items: center; flex: none; padding: 0; }
  .round:active, .pick:active, .filt:active, .sw:active { transform: scale(0.94); }
  .bar { display: flex; align-items: center; gap: 14px; }
  .bar h1, .bar h2 { flex: 1; margin: 0; text-align: center; font-weight: 900; }
  h1 { font-size: 44px; } h2 { font-size: 32px; }
  /* home */
  #home .bar h1 span { color: var(--pink); }
  #ask { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 6px 0 4px; }
  #mic { width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--ink); background: var(--pink); font-size: 70px; display: grid; place-items: center; box-shadow: 0 8px 0 rgba(43,33,64,0.18); }
  #mic[data-state="listening"] { animation: pulse 1s infinite; background: #FF7FA8; }
  #mic[data-state="off"] { display: none; }
  @keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 18px rgba(255,79,139,0.2); } }
  #asklabel { font-size: 26px; font-weight: 800; }
  #heard { min-height: 32px; font-size: 24px; font-weight: 700; color: #6A5A86; text-align: center; }
  #picks { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; padding: 6px 4px 12px; align-content: start; touch-action: pan-y; }
  .pick { border: 4px solid var(--ink); border-radius: 22px; background: #FFFFFF; padding: 8px 4px 6px; display: grid; justify-items: center; gap: 2px; font-weight: 800; font-size: 17px; }
  #galbar { flex: none; display: flex; align-items: center; gap: 10px; margin: 6px 4px 0; padding: 6px 14px; border: 3px solid var(--ink); border-radius: 999px; background: #FFFFFF; font: 800 18px system-ui, sans-serif; color: var(--ink); cursor: pointer; }
  #galbar:active { transform: scale(0.98); }
  #galpeek { display: flex; gap: 6px; margin-left: auto; }
  #galpeek canvas { width: 36px; height: 36px; border: 2px solid var(--ink); border-radius: 8px; background: #FFFFFF; }
  #galsheet { position: fixed; inset: 0; background: rgba(43,33,64,.85); z-index: 30; overflow: auto; padding: 18px; }
  #galsheet .sheet { background: var(--paper, #FFF9F0); border-radius: 28px; padding: 14px 18px 22px; max-width: 1100px; margin: 0 auto; }
  #galsheet .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  #galleryhead { font-size: 26px; font-weight: 900; margin: 0; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, 150px); gap: 14px; justify-content: center; }
  .gal { width: 150px; height: 150px; border: 4px solid var(--ink); border-radius: 18px; padding: 0; overflow: hidden; background: #FFFFFF; }
  .gal canvas { width: 100%; height: 100%; display: block; }
  /* drawing */
  #steptext { font-size: 34px; font-weight: 900; text-align: center; min-height: 46px; margin: 6px 0 2px; }
  #stepdots { display: flex; justify-content: center; gap: 10px; margin-bottom: 6px; }
  #stepdots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); background: #FFFFFF; }
  #stepdots i.done { background: var(--green); } #stepdots i.now { background: var(--pink); transform: scale(1.25); }
  .work { flex: 1; display: flex; gap: 14px; min-height: 0; align-items: stretch; }
  .rail { display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .rail .round { width: 80px; height: 80px; }
  .rail small { display: block; font-size: 13px; font-weight: 800; text-align: center; margin-top: -8px; }
  .stagebox { flex: 1; display: grid; place-items: center; min-width: 0; min-height: 0; }
  #stage { position: relative; background: #FFFFFF; border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 6px 0 rgba(43,33,64,0.12); }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage canvas { pointer-events: none; } #touch { touch-action: none; pointer-events: auto !important; }
  #shade { mix-blend-mode: multiply; }
  #next { width: 120px; height: 120px; font-size: 60px; background: var(--green); color: #FFFFFF; }
  /* coloring */
  #tools { display: grid; grid-template-columns: 1fr; gap: 10px; align-content: center; }
  #tools button.on, #sizes button.on { background: #FFC93C; }
  #sizes { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #sizes button { width: 56px; height: 56px; border-radius: 50%; border: 4px solid var(--ink); background: #FFFFFF; display: grid; place-items: center; padding: 0; }
  #sizes i { display: block; border-radius: 50%; background: var(--ink); }
  #palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding-top: 10px; }
  .sw { width: 58px; height: 58px; border-radius: 50%; border: 4px solid var(--ink); padding: 0; }
  .sw.on { box-shadow: 0 0 0 5px #FFC93C; transform: scale(1.1); }
  #done { width: auto; padding: 0 22px; border-radius: 40px; font-size: 28px; font-weight: 900; background: var(--green); color: #FFFFFF; }
  /* finish */
  #finish .work { align-items: center; }
  #result { border: 4px solid var(--ink); border-radius: 18px; background: #FFFFFF; height: 100%; max-height: calc(100vh - 140px); aspect-ratio: 1; }
  #filters { display: grid; grid-template-columns: repeat(2, 140px); gap: 12px; align-content: center; }
  .filt { border: 4px solid var(--ink); border-radius: 18px; background: #FFFFFF; padding: 6px; display: grid; justify-items: center; gap: 4px; font-weight: 800; font-size: 16px; }
  .filt.on { background: #FFC93C; }
  .fprev { width: 112px; height: 112px; border-radius: 10px; }
  #save { width: auto; padding: 0 26px; border-radius: 40px; font-size: 30px; font-weight: 900; background: #FFC93C; }
  /* view */
  #viewcanvas { max-width: 100%; max-height: calc(100vh - 130px); border: 4px solid var(--ink); border-radius: 18px; background: #FFFFFF; margin: auto; }
  #thinking { position: fixed; inset: 0; z-index: 9; background: rgba(255,248,236,0.92); display: grid; place-items: center; align-content: center; gap: 18px; }
  #thinking[hidden] { display: none; }
  #thinking .pencil { font-size: 110px; animation: doodle 1.2s ease-in-out infinite; }
  @keyframes doodle { 0%, 100% { transform: rotate(-12deg) translate(-20px, 0); } 50% { transform: rotate(12deg) translate(20px, -10px); } }
  #thinkingtext { font-size: 34px; font-weight: 900; text-align: center; padding: 0 30px; }
  #pen { display: flex; justify-content: center; align-items: center; gap: 10px; padding-top: 10px; flex-wrap: wrap; }
  #pen .pc { width: 50px; height: 50px; border-radius: 50%; border: 4px solid var(--ink); padding: 0; }
  #pen .pc.on { box-shadow: 0 0 0 5px #FFC93C; transform: scale(1.1); }
  #pen .gap { width: 18px; }
  #pen .dt { width: 54px; height: 54px; border-radius: 14px; border: 4px solid var(--ink); background: #FFFFFF; font-size: 26px; padding: 0; }
  #pen .dt.on { background: #FFC93C; }
  #style { display: flex; gap: 8px; }
  #style button { border: 4px solid var(--ink); border-radius: 30px; background: #FFFFFF; font-size: 20px; font-weight: 800; padding: 6px 16px; }
  #style button.on { background: #FFC93C; }
  #hidesketch { font-size: 22px; }
  #pen .ps { width: 54px; height: 54px; border-radius: 50%; border: 4px solid var(--ink); background: #FFFFFF; display: grid; place-items: center; padding: 0; }
  #pen .ps.on { background: #FFE9A8; }
  #pen .ps i { display: block; border-radius: 50%; }
  #retry[hidden] + #retrygap { display: inline-block; } #retry:not([hidden]) + #retrygap { display: none; }
  #cats { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; touch-action: pan-x; flex: none; }
  #cats button { flex: none; border: 3px solid var(--ink); border-radius: 22px; background: #FFFFFF; font-size: 17px; font-weight: 800; padding: 6px 14px; }
  #cats button.on { background: #FFC93C; }
  #builder { position: fixed; inset: 0; z-index: 21; background: #FFFFFF; padding: 16px; overflow: auto; font: 15px system-ui, sans-serif; user-select: text; }
  #builder[hidden] { display: none; }
  #bgrid { display: grid; grid-template-columns: repeat(auto-fill, 128px); gap: 8px; margin-top: 12px; }
  .bcard { border: 3px solid #CCC; border-radius: 10px; padding: 3px; font-size: 11px; text-align: center; cursor: pointer; }

<script>// ---------------------------------------------------------------------------

const circle = (cx, cy, r) => `M${cx - r},${cy} a${r},${r} 0 1,0 ${2 * r},0 a${r},${r} 0 1,0 ${-2 * r},0`;
const oval = (cx, cy, rx, ry) => `M${cx - rx},${cy} a${rx},${ry} 0 1,0 ${2 * rx},0 a${rx},${ry} 0 1,0 ${-2 * rx},0`;
const shape = (pts, close = true) => 'M' + pts.map(p => p.join(',')).join(' L') + (close ? ' Z' : '');
const line = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y2}`;
const arc = (cx, cy, r, a0, a1) => {   // angles in degrees, 0 = right, 90 = down
  const p = a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)].map(v => Math.round(v));
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0},${y0} A${r},${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0},1 ${x1},${y1}`;
};
const star = (cx, cy, R, r) => shape(Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; return [Math.round(cx + rr * Math.cos(a)), Math.round(cy + rr * Math.sin(a))]; }));
const mirror = (pts) => pts.map(([x, y]) => [1000 - x, y]);

// ---------------------------------------------------------------------------
// What did she ask for? Match the words she said to a subject.
// ---------------------------------------------------------------------------
function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
  {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);   // swapped letters count once
  }
  return d[a.length][b.length];
}
function matchSubject(said, list) {
  list = list || SUBJECTS;
  const text = ' ' + said.toLowerCase().replace(/[^a-z\s-]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  // Whole phrases first ("ice cream", "teddy bear"), longest first.
  const phrases = list.flatMap(s => s.words.map(w => ({ s, w }))).sort((a, b) => b.w.length - a.w.length);
  for (const { s, w } of phrases) if (text.includes(' ' + w + ' ')) return s;
  // Then close-enough longer words ("unicorm", "butterfy"): a letter or two off.
  // (Short words are left alone: "scar" isn't "star" and "dish" isn't "fish".)
  const words = text.trim().split(' ').filter(w => w.length >= 5);
  for (const { s, w } of phrases) if (!w.includes(' ') && w.length >= 5 && words.some(x => editDistance(x, w) <= (w.length >= 8 ? 2 : 1))) return s;
  return null;
}
// What she asked for, for "I don't know how to draw ___ yet".
function askedFor(said) {
  const t = said.toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim()
    .replace(/^(can you |can we |i want to |i wanna |let's |lets |please |help me )?(draw |make |paint )?(a |an |the |some )?/, '');
  return t.split(' ').slice(0, 4).join(' ');
}
if (typeof module !== 'undefined') module.exports = { SUBJECTS, matchSubject, askedFor };

// ---------------------------------------------------------------------------
// Shapes -> path. Learned drawings arrive as plain shapes (easier for a model to place
// correctly than raw SVG paths); this turns them into the same path format as the library.
//   {"circle":[cx,cy,r]}  {"oval":[cx,cy,rx,ry,tiltDeg]}  {"line":[x1,y1,x2,y2]}
//   {"curve":[x1,y1,cx,cy,x2,y2]}  {"lines":[[x,y],...]}  {"shape":[[x,y],...]}  {"arc":[cx,cy,r,fromDeg,toDeg]}
// ---------------------------------------------------------------------------
var shapeToPath = function (s) {
  const n = (v) => Math.round(+v * 10) / 10;
  const ok = (a, k) => Array.isArray(a) && a.length >= k && a.slice(0, k).every(v => Number.isFinite(+v));
  if (ok(s.circle, 3)) return circle(n(s.circle[0]), n(s.circle[1]), Math.abs(n(s.circle[2])));
  if (ok(s.oval, 4)) {
    const [cx, cy, rx, ry, tilt = 0] = s.oval.map(Number), t = tilt * Math.PI / 180, pts = [];
    for (let i = 0; i <= 48; i++) { const a = i / 48 * 2 * Math.PI, x = Math.abs(rx) * Math.cos(a), y = Math.abs(ry) * Math.sin(a); pts.push([n(cx + x * Math.cos(t) - y * Math.sin(t)), n(cy + x * Math.sin(t) + y * Math.cos(t))]); }
    return shape(pts);
  }
  if (ok(s.line, 4)) return line(...s.line.slice(0, 4).map(n));

// ---------------------------------------------------------------------------

    const p = window.VOICE_PACK, k = key(t); if (!p || !p[k]) return false;

      return task({ text: `Draw ${n} ${plural(kind)} and one ${odd}. The odd one out becomes the focal point.${extra}`, hint: 'When everything matches, the one that is different stands out.', scaffold, win: 'Emphasis by contrast. The odd one out grabs attention!',
        check(S) { const s = of(S, kind, 40), f = of(S, odd, 40); if (s.length < n) return NO('Draw ' + n + ' ' + plural(kind) + '.'); if (f.length !== 1) return NO(f.length ? 'Only one ' + odd + ', please.' : 'Now add one ' + odd + '.'); return done(f[0]); },

const LEVELS = CHAL.LEVELS;
// Where a new player starts: the first rung for the child's art grade (set by the parent), 2nd grade when unknown.
const START = (window.KidTablet && KidTablet.rungFor ? KidTablet.rungFor('art', LEVELS.map(l => l.g)) : (window.KidTablet && KidTablet.levelFor ? KidTablet.levelFor('art', LEVELS.length, 6) : 6));

// ---------------------------------------------------------------------------
// Progress. One result per challenge: right when the first check passes; missed when a check fails (counted once per
// challenge) or when she skips it (giving up). Four right in a row moves up a rung, two missed in a row moves down one.
// Finishing a challenge always earns a star, even after a miss. A check on an empty page is not a try.
// ---------------------------------------------------------------------------
const CH_KEY = 'drawwithme-challenges';
let P = { lv: START, st: { streak: 0, miss: 0 }, stars: 0, done: 0, started: false };
try { const s = JSON.parse(localStorage.getItem(CH_KEY) || 'null'); if (s) P = Object.assign(P, s, { st: Object.assign({ streak: 0, miss: 0 }, s.st || {}) }); } catch (e) {}
P.lv = Math.max(0, Math.min(LEVELS.length - 1, P.lv | 0));
function chPersist() { try { localStorage.setItem(CH_KEY, JSON.stringify(P)); } catch (e) {} }
function chRecord(right) {
  const s = P.st; let change = 0;
  if (right) { s.miss = 0; s.streak++; if (s.streak >= 4 && P.lv < LEVELS.length - 1) { P.lv++; s.streak = 0; change = 1; } }
  else { s.streak = 0; s.miss++; if (s.miss >= 2 && P.lv > 0) { P.lv--; s.miss = 0; change = -1; } }
  chPersist(); return change;
}

// ---------------------------------------------------------------------------
// The challenge screen: the same stage and marker row as free play, moved in while she plays.
// ---------------------------------------------------------------------------
screens.push('chal');
let CHT = null, chMissed = false, chStrokes = [], chTimer = null, chPenHome = null;
// Called by startDrawStroke: every stroke she makes in this mode, kept by reference so its points keep growing.
window.CHAL_REC = (s) => { if (mode === 'chal' && s && ['pen', 'charcoal', 'sketch', 'shade'].includes(s.t)) chStrokes.push({ t: s.t, color: penColor, pts: s.pts }); };
function chLiveState() {
  const W = RES, C = 100, cs = W / C;
  const ink = ictx.getImageData(0, 0, W, W).data, sk = kctx.getImageData(0, 0, W, W).data, sh = sctx.getImageData(0, 0, W, W).data;
  const on = new Uint8Array(C * C), tone = new Float32Array(C * C);
  for (let gy = 0; gy < C; gy++) for (let gx = 0; gx < C; gx++) {
    let mx = 0, si = 0, ii = 0;
    for (let y = gy * cs; y < (gy + 1) * cs; y++) { let o = (y * W + gx * cs) * 4 + 3; for (let x = 0; x < cs; x++, o += 4) { const a = ink[o] > sk[o] ? ink[o] : sk[o]; if (a > mx) mx = a; si += sh[o]; ii += ink[o]; } }

  const alive = (pts) => { let hit = 0; for (const [x, y] of pts) { const gx = Math.floor(x / 10), gy = Math.floor(y / 10); let f = 0; for (let dy = -1; dy <= 1 && !f; dy++) for (let dx = -1; dx <= 1 && !f; dx++) { const X = gx + dx, Y = gy + dy; if (X >= 0 && Y >= 0 && X < C && Y < C && on[Y * C + X]) f = 1; } hit += f; } return hit >= 0.5 * pts.length; };

}
function chDrawOps(g, ops, scale, forGuide) {
  g.save(); g.scale(scale, scale); g.lineCap = g.lineJoin = 'round';
  for (const o of ops || []) {
    const col = o.color ? CHAL.HEX[o.color] : forGuide ? 'rgba(59,51,85,0.62)' : '#3B3355';
    g.strokeStyle = o.dash ? 'rgba(255,79,139,0.75)' : o.horizon ? 'rgba(47,111,208,0.7)' : col; g.lineWidth = o.bold ? 9 : o.dash ? 4 : forGuide ? 6 : 14;
    g.setLineDash(o.dash ? [18, 16] : []);
    if (o.line) { g.beginPath(); g.moveTo(o.line[0], o.line[1]); g.lineTo(o.line[2], o.line[3]); g.stroke(); }
    if (o.lines || o.poly) { const p = o.lines || o.poly; g.beginPath(); p.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); if (o.poly) g.closePath(); g.stroke(); }

    if (o.oval) { g.beginPath(); g.ellipse(o.oval[0], o.oval[1], o.oval[2], o.oval[3], 0, 0, Math.PI * 2); g.stroke(); }

    if (o.vp) { g.fillStyle = '#FF4F8B'; g.beginPath(); g.arc(o.vp[0], o.vp[1], 13, 0, Math.PI * 2); g.fill(); }
    if (o.sun) { const [x, y] = o.sun; g.setLineDash([]); g.fillStyle = '#FFC93C'; g.strokeStyle = '#E8A400'; g.lineWidth = 6; g.beginPath(); g.arc(x, y, 34, 0, Math.PI * 2); g.fill(); g.stroke();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; g.beginPath(); g.moveTo(x + 46 * Math.cos(a), y + 46 * Math.sin(a)); g.lineTo(x + 66 * Math.cos(a), y + 66 * Math.sin(a)); g.stroke(); } }

      g.fillStyle = '#FFFFFF'; g.beginPath(); g.arc(500, 500, 150, 0, Math.PI * 2); g.fill(); }

}
function chMsg(text, kind) { const m = $('chalmsg'); m.textContent = text || ''; m.dataset.kind = kind || ''; }

function chNew(announce) {
  clearTimeout(chTimer); chTimer = null; chMissed = false; chClear();

function chEnter() {

// Self-check hook for tools/ladder-check.mjs: builds challenges at a rung without touching the screen, proves each one

window.DucklingLadder = {
  levels: () => LEVELS.length,
  start: () => START,
  label: () => LEVELS[P.lv].name,
  exercise(i, n) {
    const out = [];
    for (let k = 0; k < n; k++) { const t = LEVELS[i].gen(); CHAL.verify(t, 'level ' + i + ' (' + LEVELS[i].name + '): '); out.push(t.text); }
    return out;
  },
};
// For testing only: exposed when opened with ?dwmtest
if (/dwmtest/.test(location.search)) window.__chal = { CHAL, get task() { return CHT; }, get P() { return P; }, liveState: chLiveState, newTask: chNew, setLevel: (i) => { P.lv = i; chPersist(); }, get strokes() { return chStrokes; } };
