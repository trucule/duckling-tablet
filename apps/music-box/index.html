<!doctype html>
<html lang="en">
<head>
<script src="voice-config.js"></script>
<script>/* KID-VOICE START */
/* Kid Voice: the narrator voice for every offline app.
   When voice-config.js (written on the tablet from the KidTablet .env) names an Azure Speech key, every line an app
   speaks through speechSynthesis is spoken by the Azure kid voice instead (en-US-AnaNeural unless NARRATOR_VOICE
   says otherwise). Clips are kept in IndexedDB, so a line heard once plays again at once and without the internet.
   Without a config, or when Azure does not answer in time, the line goes to the Windows voice as before.
   The apps keep calling speechSynthesis.speak/cancel; this layer stands in for them and fires the same
   utterance events (start, boundary, end, error), so word highlighting and "then do the next thing" keep working.
   tools/apply-kid-voice.py copies this file into each app between the KID-VOICE markers. Story Maker is left out:
   it has its own cast of voices. */
(function () {
  'use strict';
  var cfg = window.KID_TTS;
  if (!cfg || !cfg.key || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined') return;
  var ss = window.speechSynthesis;
  var orig = { speak: ss.speak.bind(ss), cancel: ss.cancel.bind(ss), pause: ss.pause.bind(ss), resume: ss.resume.bind(ss) };
  var VOICE = cfg.voice || 'en-US-AnaNeural', REGION = cfg.region || 'eastus', WAIT_MS = cfg.waitMs || 4000;
  var ctx = null, current = null, queue = [], seq = 0, mem = new Map(), dbp = null, down = 0;

  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) { window.addEventListener(t, audio, { capture: true, passive: true }); });

  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('kid-voice', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('clips'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  function dbGet(k) { return db().then(function (d) { return new Promise(function (res) { if (!d) return res(null); try { var q = d.transaction('clips').objectStore('clips').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } }); }); }
  function dbPut(k, v) { db().then(function (d) { if (!d) return; try { d.transaction('clips', 'readwrite').objectStore('clips').put(v, k); } catch (e) {} }); }

  function clean(t) {
    return String(t || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function rateOf(u) { var r = Number(u.rate) || 1; return Math.round((Math.max(0.5, Math.min(2, r)) - 1) * 100); }

  // Azure REST synthesis, with a time limit so a slow network falls back to the Windows voice.
  function fetchClip(text, rate) {
    var ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US"><voice name="' + VOICE + '">' +
      '<prosody rate="' + (rate >= 0 ? '+' : '') + rate + '%">' + esc(text) + '</prosody></voice></speak>';
    var ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ac) ac.abort(); }, WAIT_MS);
    return fetch('https://' + REGION + '.tts.speech.microsoft.com/cognitiveservices/v1', {
      method: 'POST', signal: ac ? ac.signal : undefined,
      headers: { 'Ocp-Apim-Subscription-Key': cfg.key, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3' },
      body: ssml
    }).then(function (r) { clearTimeout(timer); return r.ok ? r.arrayBuffer() : null; })
      .catch(function () { clearTimeout(timer); return null; });
  }
  function decode(bytes) {
    var c = audio(); if (!c) return Promise.resolve(null);
    return new Promise(function (res) { try { c.decodeAudioData(bytes.slice(0), function (b) { res(b); }, function () { res(null); }); } catch (e) { res(null); } });
  }
  // One AudioBuffer per line and rate: memory, then IndexedDB, then Azure.
  function clip(text, rate) {
    var k = VOICE + '|' + rate + '|' + text;
    if (mem.has(k)) return mem.get(k);
    var p = dbGet(k).then(function (saved) {
      if (saved) return decode(saved);
      if (Date.now() < down) return null;   // Azure failed a moment ago; do not wait on it again yet
      return fetchClip(text, rate).then(function (bytes) {
        if (!bytes) { down = Date.now() + 30000; return null; }
        dbPut(k, bytes); return decode(bytes);
      });
    }).then(function (b) { if (!b) mem.delete(k); return b; });
    mem.set(k, p);
    return p;
  }

  function fire(u, type, extra) {
    var ev;
    try { ev = new SpeechSynthesisEvent(type, Object.assign({ utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {})); }
    catch (e) { ev = new Event(type); Object.assign(ev, { utterance: u, charIndex: 0, elapsedTime: 0, name: '' }, extra || {}); }
    if (type === 'error' && !('error' in ev)) { try { Object.defineProperty(ev, 'error', { value: (extra && extra.error) || 'interrupted' }); } catch (e) {} }
    try { u.dispatchEvent(ev); } catch (e) {}
  }

  function playNext() {
    if (current || !queue.length) return;
    var item = queue.shift(), my = ++seq, u = item.u;
    current = item;
    var text = clean(u.text), rate = rateOf(u);
    if (!text) { current = null; fire(u, 'end'); playNext(); return; }
    clip(text, rate).then(function (buf) {
      var c = audio();
      if (!buf || !c || c.state === 'running') return buf;
      // Audio starts suspended until the page may play sound; give resume() a moment.
      return Promise.race([c.resume().catch(function () {}), new Promise(function (r) { setTimeout(r, 300); })]).then(function () { return buf; });
    }).then(function (buf) {
      if (my !== seq) return;
      var c = audio();
      if (!buf || !c || c.state !== 'running') {   // no clip, or audio not allowed yet: the Windows voice says it
        current = null; item.fallback = true; orig.speak(u); playNext(); return;
      }
      var src = c.createBufferSource(), gain = c.createGain();
      gain.gain.value = u.volume == null ? 1 : Math.max(0, Math.min(1, Number(u.volume)));
      src.buffer = buf; src.connect(gain); gain.connect(c.destination);
      item.src = src; item.timers = [];
      // Word boundaries spread over the clip by letter position, for apps that light up each word.
      var full = String(u.text || ''), re = /\S+/g, m, dur = buf.duration;
      while ((m = re.exec(full))) {
        (function (ci, len) {
          item.timers.push(setTimeout(function () { if (my === seq) fire(u, 'boundary', { name: 'word', charIndex: ci, charLength: len, elapsedTime: dur * (ci / Math.max(1, full.length)) }); }, 1000 * dur * (ci / Math.max(1, full.length))));
        })(m.index, m[0].length);
      }
      src.onended = function () {
        if (my !== seq) return;
        item.timers.forEach(clearTimeout); current = null;
        fire(u, 'end', { charIndex: full.length, elapsedTime: dur });
        playNext();
      };
      fire(u, 'start');
      src.start();
    });
  }

  ss.speak = function (u) {
    if (!(u instanceof SpeechSynthesisUtterance)) return orig.speak(u);
    queue.push({ u: u });
    playNext();
  };
  ss.cancel = function () {
    seq++;
    var was = current; current = null;
    var dropped = queue.splice(0);
    if (was) { if (was.src) { try { was.src.onended = null; was.src.stop(); } catch (e) {} } if (was.timers) was.timers.forEach(clearTimeout); if (!was.fallback) fire(was.u, 'error', { error: 'interrupted' }); }
    dropped.forEach(function (d) { fire(d.u, 'error', { error: 'canceled' }); });
    orig.cancel();
  };
  ss.pause = function () { if (ctx && current && current.src) { try { ctx.suspend(); } catch (e) {} } orig.pause(); };
  ss.resume = function () { if (ctx) { try { ctx.resume(); } catch (e) {} } orig.resume(); };
  try {
    var proto = Object.getPrototypeOf(ss);
    var od = function (n) { var d = Object.getOwnPropertyDescriptor(proto, n); return d && d.get ? d.get.bind(ss) : function () { return false; }; };
    var sp = od('speaking'), pe = od('pending');
    Object.defineProperty(ss, 'speaking', { configurable: true, get: function () { return !!current || sp(); } });
    Object.defineProperty(ss, 'pending', { configurable: true, get: function () { return queue.length > 0 || pe(); } });
  } catch (e) {}
  window.KID_VOICE = { voice: VOICE, region: REGION, clip: clip, active: true };
})();
/* KID-VOICE END */</script>
<script>/* KID-STARS START */
// Kid stars: adds up the stars she has earned in every app and tells the home screen.
// All of her offline apps are local files, which share one browser storage, so any app can read every app's saved
// progress. The total goes to the home screen's small local service (KidHome, http://127.0.0.1:47821), which shows it
// next to her avatar. Put into every app by tools/apply-kid-stars.py; edit this file and run that tool again.
(function () {
  if (window.KID_STARS) return;
  var PORT = 47821, BASE = 'http://127.0.0.1:' + PORT;
  // What counts as stars in an app's saved data:
  //   an object with a number "stars"                     (most games: their progress object)
  //   an object of objects with a number "stars" each      (Level Up: one per subject)
  //   a number saved under a key ending in "-stars"        (Story Maker)
  //   a list saved under a key starting with "lab-done-"   (Chemistry Lab, Kitchen Lab: one star per experiment)
  function starsIn(key, raw) {
    var v; try { v = JSON.parse(raw); } catch (e) { return 0; }
    var n = function (x) { return typeof x === 'number' && isFinite(x) && x > 0 ? Math.floor(x) : 0; };
    if (/^lab-done-/.test(key)) return Array.isArray(v) ? v.length : 0;
    if (/-stars$/.test(key)) return n(v);
    if (!v || typeof v !== 'object' || Array.isArray(v)) return 0;
    if (typeof v.stars === 'number') return n(v.stars);
    var sum = 0;
    for (var k in v) if (v[k] && typeof v[k] === 'object' && typeof v[k].stars === 'number') sum += n(v[k].stars);
    return sum;
  }
  function earned() {
    var total = 0, per = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i); if (!k || /^kid-avatar/.test(k)) continue;
        var s = starsIn(k, localStorage.getItem(k)); if (s) { per[k] = s; total += s; }
      }
    } catch (e) {}
    return { total: total, per: per };
  }
  var last = -1, timer = null;
  function report(force) {
    var e = earned();
    if (!force && e.total === last) return Promise.resolve(e.total);
    last = e.total;
    // A plain text body keeps this a simple request (no preflight). A home screen that is not listening is fine.
    try {
      return fetch(BASE + '/stars', { method: 'POST', body: JSON.stringify({ earned: e.total }) })
        .then(function () { return e.total; }, function () { return e.total; });
    } catch (err) { return Promise.resolve(e.total); }
  }
  // Report after any save, a moment later so a burst of saves sends one report.
  try {
    var set = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) {
      set.apply(this, arguments);
      if (this === window.localStorage && !/^kid-avatar/.test(String(k))) { clearTimeout(timer); timer = setTimeout(report, 800); }
    };
  } catch (e) {}
  window.KID_STARS = { earned: function () { return earned().total; }, breakdown: function () { return earned().per; }, report: report, starsIn: starsIn, base: BASE };
  setTimeout(function () { report(true); }, 1500);
})();
/* KID-STARS END */</script>

<title>Music Box</title>
<!--
  Music Box v2. Two pages.

  Song: a 16-step tone matrix. Eight scale notes (three scales: happy, spooky, dreamy, all consonant so any pattern
  sounds fine), three percussion rows (drum, clap, shaker) and one row per recorded voice that is switched "in song".
  Five synthesized instruments plus "Me" (a recorded voice pitched up and down the scale). Speed, swing, a surprise
  dice and three song slots. Songs are kept in localStorage (musicbox-v2); the old musicbox-song key is migrated.

  Voice Lab: six pads. Tap the mic on a pad, say something, and it is kept (IndexedDB, raw PCM, so it survives
  restarts). Each pad has an emoji name, effects (chipmunk, giant, backwards, robot, echo), a "use for notes" star
  (that voice becomes the Me instrument) and an "in song" switch (adds its own row to the grid). A keyboard of eight
  animal keys plays the current instrument or the selected voice up the scale.

  Everything is Web Audio; nothing is fetched. Offline, no API. Recording uses getUserMedia on file://, which the
  tablet pre-approves for her local apps.
-->
<style>
  :root { --ink: #2B2140; --paper: #FFF9F0; --pink: #FF4F8B; --sun: #FFC93C; --sky: #58C7F0; --leaf: #5CD38B; --grape: #9B6BFF; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; color: inherit; }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 210px 8px 14px; flex-wrap: wrap; }   /* top-right 210px stays clear for the Home pill */
  header h1 { font-size: 24px; margin: 0 12px 0 0; font-weight: 900; }
  .pill { border: 3px solid var(--ink); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 19px; font-weight: 800; cursor: pointer; }
  .pill.on { background: var(--sun); }
  .pill.tab { background: #efe8fb; } .pill.tab.on { background: var(--grape); color: #fff; }
  .pill[hidden] { display: none; }
  #insts { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  main { min-height: 0; padding: 4px 14px; }
  .page { height: 100%; display: none; } .page.on { display: block; }

  /* Song page */
  #grid { display: grid; grid-template-columns: 54px repeat(16, 1fr); gap: 4px; width: 100%; height: 100%; max-width: 1280px; margin: 0 auto; }
  .lbl { display: grid; place-items: center; font-size: 24px; }
  .lbl.bounce { animation: bounce .25s; }
  @keyframes bounce { 30% { transform: translateY(-10px) scale(1.25); } 100% { transform: none; } }
  .cell { border: 3px solid #e4dbf0; border-radius: 9px; background: #fff; cursor: pointer; transition: transform .08s, background .08s; touch-action: none; min-height: 0; }
  .cell.bar { border-color: #cfc3e3; }
  .cell.on { background: var(--note); border-color: var(--ink); }
  .cell.hit { transform: scale(1.18); box-shadow: 0 0 14px var(--note); }
  .cell.head { background: #f3eefc; }
  .cell.on.head { background: var(--note); filter: brightness(1.15); }
  .cell.perc.on { background: var(--note); }

  /* Lab page */
  #lab { height: 100%; display: grid; grid-template-rows: 1fr auto auto; gap: 10px; max-width: 1280px; margin: 0 auto; }
  #pads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 0; }
  .pad { border: 4px solid #e4dbf0; border-radius: 18px; background: #fff; display: grid; grid-template-rows: auto 1fr auto; padding: 8px 10px; gap: 4px; position: relative; cursor: pointer; min-height: 0; }
  .pad.sel { border-color: var(--ink); box-shadow: 0 0 0 4px var(--sun); }
  .pad.rec { border-color: var(--pink); animation: pulse .8s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255,79,139,.35); } }
  .pad .top { display: flex; align-items: center; gap: 8px; }
  .pad .emoji { font-size: 34px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px; background: #f3eefc; }
  .pad .status { font-weight: 800; font-size: 17px; flex: 1; }
  .pad .mic { margin-left: auto; width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--ink); background: var(--pink); color: #fff; font-size: 26px; cursor: pointer; }
  .pad canvas { width: 100%; height: 100%; display: block; min-height: 0; }
  .pad .level { height: 10px; border-radius: 5px; background: #f3eefc; overflow: hidden; }
  .pad .level i { display: block; height: 100%; width: 0; background: var(--leaf); transition: width .05s; }
  .pad .flags { display: flex; gap: 6px; font-size: 15px; font-weight: 800; min-height: 20px; }
  .pad .flags span { background: #f3eefc; border-radius: 8px; padding: 1px 7px; }
  #fx { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
  #fx .pill { font-size: 18px; }
  #fx .pill.star.on { background: var(--sun); } #fx .pill.song.on { background: var(--leaf); }
  #keys { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; height: 96px; }
  .key { border: 4px solid var(--ink); border-radius: 14px; background: var(--k); font-size: 36px; display: grid; place-items: center; cursor: pointer; transition: transform .06s; }
  .key.hit { transform: scale(.94); filter: brightness(1.15); }

  footer { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 14px 14px; flex-wrap: wrap; }
  footer button { border: 4px solid var(--ink); background: #fff; border-radius: 50%; width: 70px; height: 70px; font-size: 30px; cursor: pointer; }
  footer button.big { width: 92px; height: 92px; background: var(--leaf); font-size: 42px; }
  footer button.big.on { background: var(--pink); }
  footer button.on { background: var(--sun); }
  #tempo { display: flex; align-items: center; gap: 6px; margin-left: 10px; }
  #tempo button { width: 58px; height: 58px; font-size: 26px; }
  #slots { display: flex; gap: 6px; margin-left: 10px; }
  #slots button { width: 58px; height: 58px; font-size: 24px; }
  #slots button.on { background: var(--grape); color: #fff; }
  #toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--ink); color: #fff; font-weight: 800; font-size: 20px; padding: 10px 20px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 86vw; text-align: center; }
  #toast.on { opacity: 1; }

  /* Challenges: a panel above the grid and a row of challenge buttons in the footer. Free play never shows them. */
  #page-song.on { display: flex; flex-direction: column; gap: 6px; }
  #page-song > #grid { height: auto; flex: 1 1 0; min-height: 0; }
  #chal { display: none; align-items: center; gap: 14px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 5px 14px; width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box; min-height: 62px; flex: none; }
  body.chal #chal { display: flex; }
  #cText { flex: 1 1 280px; font-size: 20px; font-weight: 800; line-height: 1.22; cursor: pointer; }
  #cShow { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex: 0 1 auto; max-width: 56%; }
  #cShow:empty { display: none; }
  #cShow svg { display: block; height: 62px; width: auto; max-width: 100%; }
  #cShow svg.staff { height: 80px; }
  .crow { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
  .chip { border: 2px solid var(--ink); border-radius: 10px; padding: 1px 8px; font-size: 20px; font-weight: 900; background: var(--cc, #fff); display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; min-width: 24px; }
  .chip small { font-size: 12px; font-weight: 800; }
  .chip.dark { color: #fff; }
  .clab { font-weight: 900; font-size: 15px; margin-right: 2px; }
  .sig { display: grid; font: 900 27px/0.92 Georgia, "Times New Roman", serif; text-align: center; padding: 0 4px; border-left: 3px solid var(--ink); }
  .rules { list-style: none; margin: 0; padding: 0; font-size: 15px; font-weight: 800; line-height: 1.25; }
  .rules li::before { content: '○ '; }
  .rules li.ok { color: #23804f; } .rules li.ok::before { content: '✓ '; }
  .lbl.nm { font-size: 18px; font-weight: 900; border-radius: 8px; }
  .lbl.blk { background: var(--ink); color: #fff; margin: 1px 4px; }
  .cell.alt:not(.on) { background: #f3ecfd; }
  .cell.bl { border-left: 6px solid var(--grape); }
  footer .cbtn { display: none; }
  body.chal footer .cbtn { display: inline-flex; }
  footer button.cbtn { width: auto; height: 58px; border-radius: 999px; padding: 0 16px; font-size: 20px; font-weight: 800; align-items: center; gap: 6px; }
  footer button#cCheck { background: var(--leaf); }
  #cInfo { flex-direction: column; align-items: flex-start; font-weight: 800; font-size: 15px; line-height: 1.25; margin-left: 4px; }
  #cInfo .dots { letter-spacing: 2px; }
  body.chal #random, body.chal #scale, body.chal #swing, body.chal #tempo, body.chal #slots { display: none; }
  body.chal footer { padding: 6px 14px 10px; gap: 10px; }
  body.chal footer button.big { width: 70px; height: 70px; font-size: 32px; }
  body.chal footer button#clear { width: 58px; height: 58px; font-size: 26px; }
  body.chal.noinst #insts { display: none; }
</style>

<body>
<div id="app">
  <header>
    <h1>Music Box</h1>
    <button class="pill tab on" data-page="song">🎼 Song</button>
    <button class="pill tab" data-page="lab">🎤 Voice Lab</button>
    <button class="pill tab" data-page="chal" id="chalTab">🏆 Challenges</button>
    <div id="insts">
      <button class="pill" data-inst="bell">🔔 Bell</button>
      <button class="pill" data-inst="flute">🎵 Flute</button>
      <button class="pill" data-inst="pluck">🎸 Pluck</button>
      <button class="pill" data-inst="marimba">🪵 Marimba</button>
      <button class="pill" data-inst="organ">🎹 Organ</button>
      <button class="pill" data-inst="voice" id="voiceInst" hidden>🎤 Me</button>
    </div>
  </header>
  <main>
    <div class="page on" id="page-song"><div id="chal"><div id="cText" title="Hear it again"></div><div id="cShow"></div></div><div id="grid"></div></div>
    <div class="page" id="page-lab">
      <div id="lab">
        <div id="pads"></div>
        <div id="fx">
          <button class="pill" data-fx="speed" data-v="chip">🐿️ Chipmunk</button>
          <button class="pill" data-fx="speed" data-v="giant">🐻 Giant</button>
          <button class="pill" data-fx="reverse">↩️ Backwards</button>

<script>
/* Challenges: a ladder of music goals from pre-K to 8th grade, played on the same tone matrix as free play.
   Each challenge sets up its own grid (which rows, how many squares, how they group into beats), asks for something
   short, and checks the cells the child turns on (and the instrument she picks). Most checks run every time a cell
   changes, so a right answer is cheered at once; composing waits for the Check button.
   Adaptive: four challenges right in a row moves up a rung, two missed in a row moves down one. A challenge is right
   when it is finished with no miss. A miss is a wrong Check or a Skip (giving up), counted once per challenge.
   Progress (rung, streaks, stars) is kept in localStorage 'musicbox-challenges'; one star per finished challenge.
   Free play and its three song slots are never touched: the challenge grid is a separate song object.
   Self-check hook: window.DucklingLadder (tools/ladder-check.mjs). */
const CH_PN = ['drum', 'clap', 'shaker'];
const CH_ANIMALS = ['bird', 'cat', 'frog', 'dog', 'cow', 'lion', 'bear', 'elephant'];

const CH_SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const CH_FLATS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const CH_BLACK = [1, 3, 6, 8, 10];
const CH_MAJ = [0, 2, 4, 5, 7, 9, 11, 12], CH_MIN = [0, 2, 3, 5, 7, 8, 10, 12];

  G: { t: 55, s: ['G', 'A', 'B', 'C', 'D', 'E', 'F#'], acc: 1 },
  D: { t: 62, s: ['D', 'E', 'F#', 'G', 'A', 'B', 'C#'], acc: 2 },

    if (mode === 'missing') {   // the plain letters are placed; the child adds the notes the key signature changes
      const altered = K.s.map((nm, i) => nm.length > 1 ? i : -1).filter(i => i >= 0);
      return chTask({ rows: chChromaRows(t, !sharp), listen: false, show: { svg: chStaffSvg(K.acc, []) },
        pre: { notes: CH_MAJ.map((s, i) => [12 - s, i]).filter(([, i]) => !altered.includes(i % 7)) }, sol: { notes: seq0.map((r, c) => [r, c]) },
        text: T('This key signature has {n} {kind}. The {k} major scale is missing those notes. Add them so the scale climbs from the bottom row.', { n, kind, k: kn }),
        hint: T('The {kind} in this key: {list}. Put each one in its empty square.', { kind, Kind, list: chAnd(accs) }), check: chMelodyIs(seq0) });
    }
    return chTask({ rows: chChromaRows(t, !sharp), listen: false, show: { svg: chStaffSvg(K.acc, []) },
      text: minor ? T(mode === 'minordown' ? 'This key signature has {n} {kind}. Its minor key starts on {t}. Build the {t} natural minor scale going down from the top row.' : 'This key signature has {n} {kind}. Its minor key starts on {t}. Build the {t} natural minor scale going up from the bottom row.', { n, kind, t: tonicName })
        : T(mode === 'down' ? 'This key signature has {n} {kind}. Its major key is {k}. Build the {k} major scale going down from the top row.' : 'This key signature has {n} {kind}. Its major key is {k}. Build the {k} major scale going up from the bottom row.', { n, kind, k: kn }),
      hint: T('The {kind} in this key: {list}. Every other note is a plain letter. One note in each square.', { kind, Kind, list: chAnd(accs) }),

  } },
  { name: 'Chord progressions', g: 7, gen() {
    const k = chPick(['C', 'G', 'F', 'D', 'A', 'Bb']), rows = chKeyRows(k), L = CH_KEYS[k].s, prog = chPick(CH_PROGS), chordOf = d => [d, d + 2, d + 4].map(x => x % 7);
    const romans = prog.map(d => CH_ROMAN[d]), uniq = [...new Set(prog)];
    const sol = []; prog.forEach((d, b) => chordOf(d).forEach(x => sol.push([7 - x, b * 4])));
    const text = T('In {k} major, play {romans}. One chord in each box.', { k: NN(k), romans: romans.join(', ') });
    return chTask({ rows, steps: 16, beat: 4, listen: true, text, speak: chSpoken(T('In {k} major, play {romans}. One chord in each box.', { k: NN(k), romans: prog.map(d => T(CH_ROMAN_SAY[d])).join(', ') })),
      hint: uniq.map(d => T('{roman} is {notes}.', { roman: CH_ROMAN[d], notes: chordOf(d).map(x => NN(L[x])).join(' ') })).join(' '),
      show: { chips: romans.map((r, i) => ({ t: r, s: T('box {n}', { n: i + 1 }) })) }, sol: { notes: sol },
      check: st => {
        for (let b = 0; b < 4; b++) {
          const got = new Set(); for (let c = b * 4; c < b * 4 + 4; c++) chColRows(st, c).forEach(r => got.add((7 - r) % 7));
          if (!got.size) return T('Box {n} needs a chord.', { n: b + 1 });
          const want = chordOf(prog[b]); if (got.size !== 3 || !want.every(x => got.has(x))) return T('Check the chord in box {n}.', { n: b + 1 });
        }
        return null;
      } });
  } },
  { name: 'Reading a staff', g: 8, gen() {
    const k = chPick(['C', 'C', 'G']), t = k === 'C' ? 60 : 67, rows = chKeyRows(k, t), base = k === 'C' ? -2 : 2, beats = chPick([4, 8]);
    let toks;
    do {
      toks = []; let left = beats;
      while (left > 0) { const tk = left >= 2 && Math.random() < 0.18 ? 'h' : chPick(['q', 'q', 'q', 'e', 'e', 'r']); toks.push(tk); left -= tk === 'h' ? 2 : 1; }
    } while (toks.filter(x => x !== 'r').length < 2);
    let d = chRnd(0, 7); const next = () => { const st = chPick([-2, -1, -1, 1, 1, 2, 3, -3, 0]); d = d + st < 0 || d + st > 7 ? d - st : d + st; return d; };
    const notes = [], sol = []; let cell = 0;
    toks.forEach(tk => {
      if (tk === 'r') { notes.push({ dur: 'r' }); cell += 2; return; }
      const n1 = next(); notes.push({ pos: base + n1, dur: tk === 'e' ? 'e' : tk }); sol.push([7 - n1, cell]);
      if (tk === 'e') { const n2 = next(); notes.push({ pos: base + n2, dur: 'e' }); sol.push([7 - n2, cell + 1]); }
      cell += tk === 'h' ? 4 : 2;
    });
    const want = chState({ rows, steps: beats * 2 }, { notes: sol });
    return chTask({ rows, steps: beats * 2, beat: 2, listen: false, show: { svg: chStaffSvg(CH_KEYS[k].acc, notes) },
      text: (t0 => k === 'G' ? T('{text} The sharp in the key signature makes every F an F sharp.', { text: t0 }) : t0)(T(chPick(['Read the music on the staff. Play it on the grid. Each box is one beat.', 'Here is a melody on the treble staff. Put each note in its row and its box.']))),
      hint: T('Lines from the bottom are E, G, B, D, F. Spaces are F, A, C, E. A black note is one beat, an open note is two, and a flag splits a beat in half.'),
      sol: { notes: sol },
      check: st => { for (let c = 0; c < beats * 2; c++) for (let r = 0; r < rows.length; r++) if (st.notes[r][c] !== want.notes[r][c]) return T('Check box {n}.', { n: Math.floor(c / 2) + 1 }); return null; } });
  } },
  { name: 'Composing to a rule', g: 8, gen() {
    for (let attempt = 0; attempt < 30; attempt++) {
      const k = chPick(['C', 'G', 'F']), rows = chKeyRows(k), RU = chRules(k), n = chRnd(6, 10);
      let extra; do { extra = chShuffle(['noleap', 'peak', 'leapback', 'chord', 'drum', 'answer', 'range']).slice(0, 2); } while (CH_CLASH.some(([a, b]) => extra.includes(a) && extra.includes(b)));
      const rules = [RU.startEnd, RU.count(n)].concat(extra.map(x => RU[x]));
      const melOf = st => (chSeq(st) || []).map(x => ({ c: x.c, d: 7 - x.r }));
      const check = st => { if (!chSeq(st)) return T('One note at a time. Each column gets just one note.'); const m = melOf(st); const bad = rules.find(R => !R.ok(m, st)); return bad ? T('Not yet: {rule}', { rule: bad.t }) : null; };
      const t = chTask({ rows, perc: true, steps: 16, beat: 2, barCells: 8, manual: true,
        text: T(chPick(['Compose a melody in {k} major that follows every rule. Press Check when it is ready.', 'Write your own tune in {k} major. Follow all the rules, then press Check.']), { k: NN(k) }),
        hint: T('Plan the first and last notes first. Then fill the middle, moving mostly one row at a time.'), rules, ruleState: melOf, check });
      for (let tries = 0; tries < 400; tries++) {
        const cnt = chRnd(n, Math.min(16, n + 3)), cols = chShuffle(chRange(16)).slice(0, cnt).sort((a, b) => a - b), ds = [chPick([0, 0, 7])];
        while (ds.length < cnt) {

          if (extra.includes('chord')) { const opts = [0, 2, 4, 7].filter(x => x !== p && Math.abs(x - p) <= (extra.includes('noleap') ? 2 : 4)); ds.push(opts.length ? chPick(opts) : 4); continue; }
          if (extra.includes('leapback') && Math.random() < 0.3 && ds.length < cnt - 2) { const dir = p <= 3 ? 1 : -1, j = p + dir * chRnd(3, 4); ds.push(j, j - dir); continue; }

      text: T('Compose a melody in {k} major that follows every rule. Press Check when it is ready.', { k: NN(k) }), hint: T('Plan the first and last notes first. Then fill the middle, moving mostly one row at a time.'),
      sol: { notes: degs.map((d, i) => [7 - d, i * 2]) },
      check: st => { if (!chSeq(st)) return T('One note at a time. Each column gets just one note.'); const m = (chSeq(st) || []).map(x => ({ c: x.c, d: 7 - x.r })); const bad = rules.find(R => !R.ok(m, st)); return bad ? T('Not yet: {rule}', { rule: bad.t }) : null; } });

// Where a new player starts: the first rung for the child's music grade (set by the parent), 2nd grade when unknown.
const START = (window.KidTablet && KidTablet.rungFor ? KidTablet.rungFor('music', LEVELS.map(l => l.g)) : (window.KidTablet && KidTablet.levelFor ? KidTablet.levelFor('music', LEVELS.length, 6) : 6));

// --- Progress ----------------------------------------------------------------------------------------------------
const CH_KEY = 'musicbox-challenges';
let P = { stars: 0, lv: START, st: { streak: 0, miss: 0 } };
try { const s = JSON.parse(localStorage.getItem(CH_KEY) || 'null'); if (s && typeof s.lv === 'number') P = Object.assign(P, s, { st: Object.assign({ streak: 0, miss: 0 }, s.st || {}) }); } catch (e) {}
P.lv = Math.max(0, Math.min(LEVELS.length - 1, P.lv | 0));
function chPersist() { try { localStorage.setItem(CH_KEY, JSON.stringify(P)); } catch (e) {} }
// One result per challenge: right (finished with no miss) or missed. Returns +1, -1 or 0 for a rung change.
function chRecord(right) {
  const s = P.st; let change = 0;
  if (right) { s.miss = 0; s.streak++; if (s.streak >= 4 && P.lv < LEVELS.length - 1) { P.lv++; s.streak = 0; change = 1; } }
  else { s.streak = 0; s.miss++; if (s.miss >= 2 && P.lv > 0) { P.lv--; s.miss = 0; change = -1; } }
  chPersist(); return change;
}

// --- Playing a challenge -------------------------------------------------------------------------------------------
let CT = null, chOn = false, chMissed = false, chWon = false, chNextTimer = null, chSayTok = 0;
const $c = id => document.getElementById(id);
function chSayThen(text, done) {
  const my = ++chSayTok; let fired = false;
  const go = () => { if (fired || my !== chSayTok) return; fired = true; if (done) done(); };
  systemSay(text, go); setTimeout(go, 900 + text.length * 65);
}
function chNow() { return { notes: song.grid.notes, perc: song.grid.perc, inst: song.inst }; }
function chLoad(t, spec) {
  const st = chState(t, spec);
  song = { chal: true, rows: t.rows && t.rows.map(r => Object.assign({}, r, { name: chPretty(r.name) })), showPerc: t.perc, steps: t.steps, beat: t.beat, barCells: t.barCells, bpm: 30000 / t.cellMs, inst: t.inst || songs[slot].inst || 'bell', scale: 'happy', swing: false,
    grid: { notes: st.notes, perc: st.perc, samp: Array.from({ length: PADS }, () => Array(t.steps).fill(false)) } };
  if (song.inst === 'voice' && !starSample()) song.inst = 'bell';
  build(); refreshButtons();
}
function chPlay(st) {
  const a = audio(); if (!a || !CT || !st) return;
  const t0 = a.currentTime + 0.08, dt = CT.cellMs / 1000;
  for (let c = 0; c < CT.steps; c++) {
    st.notes.forEach((row, r) => { if (row[c]) note(CT.rows[r].freq, t0 + c * dt, song.inst); });
    st.perc.forEach((row, r) => { if (row[c]) perc(r, t0 + c * dt); });

}
function chListen() { if (CT.listen) chPlay(chState(CT, CT.sol)); else chSayThen(CT.speak || chSpoken(CT.text)); }
function chInfo() {
  $c('cInfo').innerHTML = `<span>${T(LEVELS[P.lv].name)}</span><span>⭐ ${P.stars} <span class="dots">${'●'.repeat(P.st.streak)}${'○'.repeat(Math.max(0, 4 - P.st.streak))}</span></span>`;
}
function chRender() {
  $c('cText').textContent = chPretty(CT.text);
  const sh = CT.show || {}; let h = '';
  const chips = list => list.map(ch => `<span class="chip${ch.dark ? ' dark' : ''}" style="--cc:${ch.c ? ch.c + '55' : '#fff'}">${chPretty(ch.t)}${ch.s ? '<small>' + chPretty(ch.s) + '</small>' : ''}</span>`).join('');
  if (sh.chips) h += `<div class="crow">${chips(sh.chips)}</div>`;
  if (sh.lines) sh.lines.forEach(l => { h += `<div class="crow"><span class="clab">${l.label}</span>${chips(l.chips)}</div>`; });
  if (sh.svg || sh.sig) h += `<div class="crow">${sh.svg || ''}${sh.sig ? `<div class="sig"><span>${sh.sig.split('/')[0]}</span><span>${sh.sig.split('/')[1]}</span></div>` : ''}</div>`;
  if (CT.rules) h += `<ul class="rules">${CT.rules.map((R, i) => `<li data-i="${i}">${chPretty(R.t)}</li>`).join('')}</ul>`;
  $c('cShow').innerHTML = h; chRules2(); chInfo();
}
function chRules2() {
  if (!CT || !CT.rules) return; const st = chNow(), m = CT.ruleState(st);
  document.querySelectorAll('#cShow .rules li').forEach(li => li.classList.toggle('ok', !!(chSeq(st) && CT.rules[+li.dataset.i].ok(m, st))));
}
function chNew() {
  clearTimeout(chNextTimer); if (playing) setPlaying(false);
  CT = LEVELS[P.lv].gen(); chMissed = false; chWon = false;
  document.body.classList.toggle('noinst', !CT.insts);
  chLoad(CT, CT.pre); chRender();
  $c('cListen').style.display = CT.listen ? '' : 'none';

}
function chMiss() { if (chMissed) return; chMissed = true; const ch = chRecord(false); chInfo(); if (ch < 0) setTimeout(() => toast(T('Next one is a little easier.'), 1800), 1600); }
function chWin() {
  chWon = true; const ch = chMissed ? 0 : chRecord(true);
  P.stars++; chPersist(); chInfo();
  const grid = cells; rowsDef.forEach((row, r) => grid[r].forEach((d, c) => { if (d.classList.contains('on')) setTimeout(() => { if (cells === grid) flash(r, c); }, c * 40); }));
  const cheer = T(chPick(['Yes! You did it!', 'Beautiful music!', 'Great listening!', 'That is it!', 'Wonderful!'])), name = T(LEVELS[P.lv].name);
  toast('⭐ ' + cheer + (ch > 0 ? ' ' + T('New challenge: {name}!', { name }) : ''), 2200);
  systemSay(cheer + (ch > 0 ? ' ' + T('Now try {name}.', { name }) : ''));
  chNextTimer = setTimeout(() => { if (chOn) chNew(); }, 2600);
}
const CHAL = window.CHAL = {
  on: () => chOn,
  enter() { if (chOn) return; chOn = true; document.body.classList.add('chal'); chNew(); },
  exit() {
    chOn = false; clearTimeout(chNextTimer); chSayTok++; if (playing) setPlaying(false);
    document.body.classList.remove('chal', 'noinst'); song = songs[slot]; build(); refreshButtons();
  },
  changed() { if (!chOn || !CT || chWon) return; chRules2(); if (!CT.manual && CT.check(chNow()) === null) chWin(); },
  reset() { if (!CT || chWon) return; chLoad(CT, CT.pre); chRules2(); },
  check() {
    if (!CT || chWon) return; const why = CT.check(chNow());

  skip() { if (!CT) return; if (!chWon && !chMissed) chMiss(); chNew(); },

  listen: () => CT && chListen(),
  task: () => CT, state: () => ({ level: P.lv, streak: P.st.streak, miss: P.st.miss, stars: P.stars, missed: chMissed, won: chWon }),

$c('cCheck').onclick = CHAL.check; $c('cSkip').onclick = CHAL.skip; $c('cHint').onclick = CHAL.hint; $c('cListen').onclick = CHAL.listen;
$c('cText').onclick = () => { if (CT) chSayThen(CT.speak || chSpoken(CT.text)); };

// --- Self-check hook for tools/ladder-check.mjs: builds challenges at a rung without touching the screen ------------
function chValidate(t, i) {
  const where = 'level ' + i + ' (' + LEVELS[i].name + '): ', BAD = /NaN|undefined|\[object|null|\u2014/;
  const sh = t.show || {}, chipTexts = [].concat(sh.chips || [], ...(sh.lines || []).map(l => l.chips)).flatMap(c => [c.t, c.s].filter(x => x !== undefined));
  const texts = [t.text, t.hint].concat(t.speak !== undefined ? [t.speak] : [], chipTexts, (t.rules || []).map(R => R.t), sh.svg ? [sh.svg] : [], sh.sig ? [sh.sig] : []);
  if (typeof t.text !== 'string' || !t.text || typeof t.hint !== 'string' || !t.hint) throw new Error(where + 'missing text');
  texts.forEach(x => { if (typeof x !== 'string' || BAD.test(x)) throw new Error(where + 'bad text: ' + String(x).slice(0, 80)); });
  if (!Number.isInteger(t.steps) || t.steps < 4 || t.steps > 16 || !Number.isInteger(t.beat) || t.beat < 1) throw new Error(where + 'grid size');
  if (!t.rows && !t.perc) throw new Error(where + 'no rows');
  if (t.rows && (!t.rows.length || t.rows.length > 13 || t.rows.some(r => typeof r.name !== 'string' || !isFinite(r.freq) || r.freq <= 0))) throw new Error(where + 'rows');
  const cellsOk = spec => (spec.notes || []).every(([r, c]) => t.rows && r >= 0 && r < t.rows.length && c >= 0 && c < t.steps)
    && (spec.perc || []).every(([r, c]) => t.perc && r >= 0 && r < PERC && c >= 0 && c < t.steps);
  if (!t.sol || !cellsOk(t.sol) || !cellsOk(t.pre || {})) throw new Error(where + 'target off the grid');
  const inst = t.sol.inst || t.inst || 'bell';
  if (t.sol.inst && (!CH_INSTS.includes(t.sol.inst) || (!t.insts && t.sol.inst !== t.inst))) throw new Error(where + 'instrument not on screen');
  const fin = chState(t, t.sol); fin.inst = inst;
  const why = t.check(fin); if (why !== null) throw new Error(where + 'solution fails: ' + why + ' | ' + t.text);
  const start = t.check(chState(t, t.pre)); if (start === null) throw new Error(where + 'already solved at start');
  if (typeof start !== 'string' || BAD.test(start)) throw new Error(where + 'bad feedback');
  if (t.rules && !t.rules.every(R => R.ok(t.ruleState(fin), fin))) throw new Error(where + 'rules');
}
function chDescribe(t) {
  const s = t.sol, cells = [].concat((s.notes || []).map(([r, c]) => c + ':' + t.rows[r].name), (s.perc || []).map(([r, c]) => c + ':' + CH_PN[r]));
  return t.text + ' [' + (s.inst ? s.inst + ' ' : '') + cells.join(' ') + ']';
}
window.DucklingLadder = {
  levels: () => LEVELS.length,
  start: () => START,
  label: () => LEVELS[P.lv].name,
  exercise(i, n) { const out = []; for (let k = 0; k < n; k++) { const t = LEVELS[i].gen(); chValidate(t, i); out.push(chDescribe(t)); } return out; },
};
