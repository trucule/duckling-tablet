<script>/* KID-STARS START */
// Kid stars: adds up the stars she has earned in every app and tells the home screen.
// All of her offline apps are local files, which share one browser storage, so any app can read every app's saved
// progress. The total goes to the home screen's small local service (KidHome, http://127.0.0.1:47821), which shows it
// next to her avatar. Put into every app by tools/apply-kid-stars.py; edit this file and run that tool again.
(function () {
  if (window.KID_STARS) return;
  var PORT = 47821, BASE = 'http://127.0.0.1:' + PORT;
  // What counts as stars in an app's saved data:
  //   an object with a number "stars"                     (most games: their progress object)
  //   an object of objects with a number "stars" each      (Level Up: one per subject)
  //   a number saved under a key ending in "-stars"        (Story Maker)
  //   a list saved under a key starting with "lab-done-"   (Chemistry Lab, Kitchen Lab: one star per experiment)
  function starsIn(key, raw) {
    var v; try { v = JSON.parse(raw); } catch (e) { return 0; }
    var n = function (x) { return typeof x === 'number' && isFinite(x) && x > 0 ? Math.floor(x) : 0; };
    if (/^lab-done-/.test(key)) return Array.isArray(v) ? v.length : 0;
    if (/-stars$/.test(key)) return n(v);
    if (!v || typeof v !== 'object' || Array.isArray(v)) return 0;
    if (typeof v.stars === 'number') return n(v.stars);
    var sum = 0;
    for (var k in v) if (v[k] && typeof v[k] === 'object' && typeof v[k].stars === 'number') sum += n(v[k].stars);
    return sum;
  }
  function earned() {
    var total = 0, per = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i); if (!k || /^kid-avatar/.test(k)) continue;
        var s = starsIn(k, localStorage.getItem(k)); if (s) { per[k] = s; total += s; }
      }
    } catch (e) {}
    return { total: total, per: per };
  }
  var last = -1, timer = null;
  function report(force) {
    var e = earned();
    if (!force && e.total === last) return Promise.resolve(e.total);
    last = e.total;
    // A plain text body keeps this a simple request (no preflight). A home screen that is not listening is fine.
    try {
      return fetch(BASE + '/stars', { method: 'POST', body: JSON.stringify({ earned: e.total }) })
        .then(function () { return e.total; }, function () { return e.total; });
    } catch (err) { return Promise.resolve(e.total); }
  }
  // Report after any save, a moment later so a burst of saves sends one report.
  try {
    var set = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) {
      set.apply(this, arguments);
      if (this === window.localStorage && !/^kid-avatar/.test(String(k))) { clearTimeout(timer); timer = setTimeout(report, 800); }
    };
  } catch (e) {}
  window.KID_STARS = { earned: function () { return earned().total; }, breakdown: function () { return earned().per; }, report: report, starsIn: starsIn, base: BASE };
  setTimeout(function () { report(true); }, 1500);
})();
/* KID-STARS END */</script>

<title>Story Maker</title>
<!--
  Story Maker. She picks up to three friends from the cast, a place, a kind of story, how much trouble there is and
  how long it should be. The story is then told scene by scene, each scene ending in a choice she makes, and every
  line is read by its own voice: a warm narrator and one voice per character.

  Two ways the words get written:
    - With an API key in config.js (written by the KidTablet module from .env), Claude writes each scene live
      (storyModel, Haiku by default), as JSON lines with speakers and moods. dailyLimit caps stories per day.
    - Without one, a built-in branching story is used, so the app always works offline.
  Two ways the words get spoken:
    - With TTS settings in config.js, each line is synthesized in that speaker's voice: VoiceStudio on the LAN
      (designed voices, see voices.js), else Azure Speech or OpenAI; the Windows voices are the last fallback.
    - Otherwise the Windows voices are used, a different one (and pitch) per character. Static prompts can also
      come from a voice pack (voices/make-voices.py), like the other apps.
  Reading level (seven rungs from Little to 8th grade; kept in localStorage story-level): Little is the read-aloud
  for a four to six year old. Every rung above it uses longer sentences and richer words, highlights each word as it
  is read, explains story words when tapped, offers "I read it myself", and ends with questions about the story
  (stars in story-stars). Each rung hands the writer its own guidance: sentence length, a random draw of grade words
  to work in, the literary devices to use, how many scenes, and what kind of choices the child makes. From 5th grade
  up the story ends with a reflection question and one check question the writer sets. See RUNGS below.
-->

// The cast. Each friend has a personality the writer keeps to, and a voice: Azure and OpenAI voice names for live
// TTS, and a pitch/rate for the Windows voices so they still sound different from each other.
// ---------------------------------------------------------------------------
const CAST = [
  { id: 'bun', name: 'Bun', emoji: '🐰', kind: 'bunny', trait: 'a kindly elderly gentleman rabbit who speaks in a gentle British way, tells short "in my day" stories, wise and warm', azure: 'en-US-JaneNeural', openai: 'shimmer', pitch: 1.3, rate: 1.0 },

  { id: 'pip', name: 'Pip', emoji: '🐧', kind: 'penguin', trait: 'shy at first, very loyal, loves sliding', azure: 'en-US-SaraNeural', openai: 'fable', pitch: 1.2, rate: 1.0 },
  // The child herself: her name comes from the tablet (window.KidTablet.childName); 'Me' when it has none.
  { id: 'me', name: (window.KidTablet && window.KidTablet.childName) || 'Me', emoji: '🧒', kind: 'kid', trait: 'clever and bold, has good ideas', azure: 'en-US-AnaNeural', openai: 'shimmer', pitch: 1.5, rate: 1.0 },
  { id: 'hop', name: 'Hop', emoji: '🐸', kind: 'frog', trait: 'jumpy and loud, says RIBBIT when surprised', azure: 'en-US-JasonNeural', openai: 'echo', pitch: 0.9, rate: 1.15 },
  { id: 'rusty', name: 'Rusty', emoji: '🦊', kind: 'fox', trait: 'tricky but good-hearted, always has a plan', azure: 'en-US-GuyNeural', openai: 'onyx', pitch: 1.0, rate: 1.05 },
  { id: 'luna', name: 'Luna', emoji: '🦉', kind: 'owl', trait: 'wise and calm, speaks slowly, knows facts', azure: 'en-US-NancyNeural', openai: 'alloy', pitch: 0.9, rate: 0.8 },
  { id: 'mo', name: 'Mo', emoji: '🫎', kind: 'moose', trait: 'big, gentle and a little clumsy', azure: 'en-US-ChristopherNeural', openai: 'onyx', pitch: 0.6, rate: 0.85 },
  { id: 'zip', name: 'Zip', emoji: '🐭', kind: 'mouse', trait: 'tiny and fast, talks quickly, scared of nothing', azure: 'en-US-AmberNeural', openai: 'nova', pitch: 1.6, rate: 1.2 },
  { id: 'captain', name: 'Captain Clam', emoji: '🦀', kind: 'crab', trait: 'bossy old sailor, says Arr, secretly soft', azure: 'en-US-BrandonNeural', openai: 'echo', pitch: 0.75, rate: 0.9 }
];
const NARRATOR = { id: 'narrator', name: 'Narrator', emoji: '📖', azure: 'en-US-JennyNeural', openai: 'nova', pitch: 1.0, rate: 0.92 };
const PLACES = [['🏰', 'a castle'], ['🌙', 'the moon'], ['🏝️', 'an island'], ['🌲', 'a forest'], ['🏖️', 'the beach'], ['🎡', 'a fair'], ['❄️', 'a snowy mountain'], ['🧁', 'cupcake town'], ['🚂', 'a train'], ['🌊', 'under the sea']];
const KINDS = [['🧭', 'adventure', 'Adventure'], ['🔍', 'mystery', 'Mystery'], ['💛', 'friendship', 'Friendship'], ['🤪', 'silly', 'Silly'], ['🌙', 'bedtime', 'Bedtime']];
const DRAMAS = [['☁️', 'cozy', 'Cozy', 'no real problem, just a happy time together'], ['🌦️', 'little', 'A little trouble', 'one small problem that friends solve kindly'], ['⛈️', 'big', 'Big trouble', 'an exciting safe scare, like getting lost or a storm, that ends well']];
// How many scenes Short and Long mean depends on the reading level (RUNGS[...].scenes); totalScenes() reads it.
const LENGTHS = [['📄', 'short', 'Short'], ['📚', 'long', 'Long']];
const CFG = Object.assign({ storyModel: 'claude-haiku-4-5-20251001', dailyLimit: 10, tts: null }, window.DWM_CONFIG || {});
let picked = [], place = null, kind = null, drama = null, length = null;
let story = null;   // { scenes: [...], history: [...], reading }
const $ = id => document.getElementById(id);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------------------------------------------------------------------------
// Voices
// ---------------------------------------------------------------------------
const VOICE = (() => {
  let actx = null, cur = null, seq = 0, timers = []; const cache = new Map();
  const key = t => String(t).trim().toLowerCase().replace(/\s+/g, ' ');
  function ctx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
  // Every line gets a number; stopping (or starting another line) retires it, so a late "done" from a line that was
  // cut off never moves the story on.
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function stop() { seq++; clearTimers(); if (cur) { try { cur.onended = null; cur.stop(); } catch (e) {} cur = null; } try { speechSynthesis.cancel(); } catch (e) {} }
  // Read-along: with a clip the words are timed across its length by their size; the Windows voice reports each word.
  function wordStarts(text) { const s = []; let pos = 0; for (const w of text.split(' ')) { s.push(pos); pos += w.length + 1; } return s; }
  function scheduleWords(text, seconds, onWord) {
    if (!onWord) return;
    const words = text.split(' '), total = words.reduce((n, w) => n + w.length + 1, 0); let t = 0;
    words.forEach((w, i) => { timers.push(setTimeout(() => onWord(i), t * 1000)); t += seconds * (w.length + 1) / total; });
  }
  // Effects applied to a character's audio: "robot" is a ring modulator plus a touch of bit crushing.
  function chain(a, fx) {
    const out = a.createGain(); out.gain.value = 1;
    if (fx !== 'robot') { out.connect(a.destination); return out; }
    const ring = a.createGain(); ring.gain.value = 0; const lfo = a.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 55; lfo.connect(ring.gain); lfo.start();
    const dry = a.createGain(); dry.gain.value = 0.35; const wet = a.createGain(); wet.gain.value = 0.9;
    const crush = a.createWaveShaper(); const n = 256, curve = new Float32Array(n); const levels = 24; for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = Math.round(x * levels) / levels; } crush.curve = curve;
    const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 220; const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3400;
    out.connect(ring); ring.connect(wet); out.connect(dry); wet.connect(crush); dry.connect(crush); crush.connect(hp).connect(lp).connect(a.destination);
    return out;
  }
  function playBuffer(buf, done, fx, text, onWord) { const a = ctx(); const s = a.createBufferSource(); s.buffer = buf; s.connect(chain(a, fx)); s.onended = () => { if (cur === s) { cur = null; if (done) done(); } }; cur = s; s.start(); if (text) scheduleWords(text, buf.duration, onWord); }
  async function decode(bytes) { const a = ctx(); return a.decodeAudioData(bytes.slice(0)); }
  const vsCfg = () => (window.VS_VOICES || {});
  function fxFor(who) { const v = vsCfg()[who.id]; return v && v.fx; }

  // --- VoiceStudio on the LAN (designed voices, GPU on the PC) -------------------------------------
  // Each story picks its voice service once, at its start: VoiceStudio when the PC answers, otherwise the Azure or
  // OpenAI key, otherwise the Windows voices. A story that started without VoiceStudio does not ask the PC again,
  // and a VoiceStudio story that loses the PC switches to the key for the rest of that story. The next story
  // checks the PC again.
  const vs = { ok: null, at: 0, ids: null, active: 0, queue: [] };
  // The secret is the LAN-share PIN or, with OMNIVOICE_API_KEY set on the PC, that key; send it both ways.
  const vsHeaders = t => (t.pin ? { 'x-omnivoice-pin': t.pin, 'Authorization': 'Bearer ' + t.pin } : {});
  async function vsAlive(t) {
    vs.at = Date.now();
    try { const c = new AbortController(); const tm = setTimeout(() => c.abort(), 2000); const r = await fetch(t.url + '/health', { headers: vsHeaders(t), signal: c.signal }); clearTimeout(tm); vs.ok = r.ok; }
    catch (e) { vs.ok = false; }
    if (!vs.ok) vs.ids = null;
    return vs.ok;
  }
  // The key's service: 'azure' or 'openai' (VoiceStudio's fallback, or the primary), or null for none.
  function keyService(t) {
    if (!t || !t.key) return null;
    if (t.provider === 'openai') return 'openai';
    if (t.provider === 'azure') return 'azure';
    if (t.fallback === 'none') return null;
    return t.fallback === 'openai' ? 'openai' : 'azure';
  }
  // route: Promise of 'vs' | 'azure' | 'openai' | null for the current story.
  let route = null;
  function decide() {
    const t = CFG.tts;
    if (!t) return Promise.resolve(null);
    if (t.provider === 'voicestudio' && t.url) return vsAlive(t).then(ok => ok ? 'vs' : keyService(t));
    return Promise.resolve(keyService(t));
  }
  function currentRoute() { if (!route) route = decide(); return route; }
  function beginStory() { route = decide(); if (!azList) azMapP = null; return route; }
  function dropVoiceStudio() { route = Promise.resolve(keyService(CFG.tts)); }

  // --- Azure: one voice per character, from the voices this key's region offers ---------------------

function storiesToday() { try { const d = JSON.parse(localStorage.getItem('story-count') || '{}'); return d.day === new Date().toDateString() ? d.n : 0; } catch (e) { return 0; } }
function countStory() { try { localStorage.setItem('story-count', JSON.stringify({ day: new Date().toDateString(), n: storiesToday() + 1 })); } catch (e) {} }

// The prompt for one scene. ctx: { lv, cast, place, kind, drama, total, sceneNo, history, vocab }. Pure, so the
// self-check hook can build prompts for any rung without a story on screen. Returns { system, user, maxTokens }.
function buildPrompt(ctx) {
  const lv = ctx.lv, R = RUNGS[lv], rank = rankOf(lv), isLast = ctx.sceneNo >= ctx.total, little = lv === 'little';
  const art = k => (/^[aeiou]/i.test(k) ? 'an' : 'a');
  const castDesc = ctx.cast.map(c => `${c.id}: ${c.name}, ${art(c.kind)} ${c.kind}, ${c.trait}`).join('; ');
  const teller = lv === 'eighth' ? `\nThe "narrator" lines are ${ctx.cast[0].name} the ${ctx.cast[0].kind} telling the story as I (the unreliable narrator).` : '';
  const history = ctx.history.map((h, i) => `Scene ${i + 1} "${h.title}": ${h.summary} She chose: ${h.choice}.`).join('\n') || '(none yet)';
  const vocab = `Grade words to work into this story, spelled exactly: ${ctx.vocab.join(', ')}. Use at least two of them in this scene, each in a sentence that makes its meaning clear, and all of them by the last scene.`;
  const words = R.gloss ? ` "words": [{"word": "a grade word or other new word used in this scene, spelled exactly as in the text", "meaning": "a short meaning a child understands"}], 1 to 3 items.` : '';
  let ending = '';
  if (isLast && rank >= 4) {
    ending = ` Also "reflect": {"q": "one question that asks what she would have done at the story's hardest moment and why", "options": [{"text": "a short answer, a different reasonable choice", "reply": "one warm sentence a cast member says back to that answer"}, ...3 options]}; there is no right option.`
      + ` Also "check": {"q": "${lv === 'eighth' ? 'one question about what the narrator got wrong, or what a grade word from the story means' : 'one question about why something happened in the story, or what a grade word from the story means'}", "choices": ["three short answers"], "answer": index of the one right choice}. Exactly one choice is right; the other two are clearly wrong for this story.`;
  } else if (isLast && !little) {
    ending = ` Also "questions": 4 questions about the WHOLE story to check she understood it, covering who, what happened, why something happened, and the order of events${rank >= 2 ? ', plus one about the meaning of a word from the story' : ''}: [{"q": "the question", "choices": ["three short answers"], "answer": index of the one right choice}]. Exactly one choice is right; the other two are clearly wrong for this story.`;
  }
  const user = `Cast: ${castDesc}.${teller}\nPlace: ${ctx.place[1]}. Kind: ${ctx.kind[1]}. Drama level: ${ctx.drama[1]} (${ctx.drama[3]}). Total scenes: ${ctx.total}.\n${vocab}\nSo far:\n${history}\n\nWrite scene ${ctx.sceneNo}${isLast ? ', the LAST scene: resolve everything happily and end with a warm closing line' : ''}.\nJSON shape: {"title": "short scene title", "emoji": ["one", "two", "three emoji for the scene"], "lines": [{"who": "narrator" or a cast id, "text": "${little ? 'one or two sentences' : 'one to three sentences'}", "mood": one of "neutral","cheerful","excited","sad","whispering","shouting","friendly"}], "summary": "one sentence of what happened", "choices": [{"label": "3-6 words, what happens next", "emoji": "one emoji"}, ...]}. Choices: ${R.choices}.${words} ${R.lines}. ${isLast ? 'For the last scene: "choices": [] and "end": true.' : ''}${ending}`;
  return { system: R.system, user, maxTokens: R.maxTokens };
}
// The JSON object in the writer's reply, or null when there is none to use.
function parseScene(text) {
  if (typeof text !== 'string') return null;
  const t = text.replace(/```json|```/g, '').trim(), a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { const j = JSON.parse(t.slice(a, b + 1)); return j && typeof j === 'object' && !Array.isArray(j) ? j : null; } catch (e) { return null; }
}
// Asks the writer for the next scene. Returns the scene, or null when the reply had nothing usable (the caller then
// tells the child and uses the built-in story). Network and server errors throw.
async function writeScene() {
  const s = story, isLast = s.scenes.length + 1 >= s.total, lv = s.level, R = RUNGS[lv];
  const p = buildPrompt({ lv, cast: picked, place, kind, drama, total: s.total, sceneNo: s.scenes.length + 1, history: s.history, vocab: s.vocab });
  const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': CFG.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: CFG.storyModel, max_tokens: p.maxTokens, system: p.system, messages: [{ role: 'user', content: p.user }] }) });
  if (!r.ok) throw new Error('api ' + r.status);
  let data = null; try { data = await r.json(); } catch (e) { return null; }
  const text = (data && Array.isArray(data.content) ? data.content : []).map(c => (c && typeof c.text === 'string') ? c.text : '').join('');
  const json = parseScene(text);
  if (!json) return null;
  json.title = typeof json.title === 'string' ? json.title : '';
  json.emoji = Array.isArray(json.emoji) ? json.emoji.filter(e => typeof e === 'string').slice(0, 4) : [];
  json.lines = (Array.isArray(json.lines) ? json.lines : []).filter(l => l && typeof l.text === 'string' && l.text.trim()).map(l => ({ who: picked.find(c => c.id === l.who) || NARRATOR, text: String(l.text).trim(), mood: typeof l.mood === 'string' ? l.mood : 'neutral' }));
  if (!json.lines.length) return null;
  json.choices = isLast ? [] : (Array.isArray(json.choices) ? json.choices : []).filter(c => c && typeof c.label === 'string' && c.label.trim()).map(c => ({ label: c.label.trim(), emoji: typeof c.emoji === 'string' ? c.emoji : '✨' })).slice(0, 3);
  if (!isLast && json.choices.length < 2) return null;
  json.end = isLast || !!json.end;
  json.summary = typeof json.summary === 'string' ? json.summary : json.title;
  json.words = R.gloss ? (Array.isArray(json.words) ? json.words : []).filter(w => w && typeof w.word === 'string' && typeof w.meaning === 'string' && w.word.trim() && w.meaning.trim()).map(w => ({ word: w.word.trim(), meaning: w.meaning.trim() })) : [];
  json.questions = cleanQuestions(json.questions);
  json.check = cleanQuestions(json.check ? [json.check] : [])[0] || null;   // 5th grade and up; skipped when malformed
  json.reflect = cleanReflect(json.reflect);
  return json;
}
// The reflection question (5th grade and up): a question and 2 to 4 options, none of them right or wrong. Each
// option may carry a reply a character says back. Null when the writer's JSON does not hold one.
function cleanReflect(x) {
  if (!x || typeof x.q !== 'string' || !x.q.trim() || !Array.isArray(x.options)) return null;
  const opts = x.options.map(o => typeof o === 'string' ? { text: o, reply: '' } : (o && typeof o.text === 'string') ? { text: o.text, reply: typeof o.reply === 'string' ? o.reply.trim() : '' } : null)
    .filter(o => o && o.text.trim()).map(o => ({ text: o.text.trim(), reply: o.reply })).slice(0, 4);
  if (opts.length < 2 || new Set(opts.map(o => o.text.toLowerCase())).size !== opts.length) return null;
  return { q: x.q.trim(), reflect: true, choices: opts.map(o => o.text), replies: opts.map(o => o.reply), answer: -1 };
}

function fill(t) {
  const names = picked.map(c => c.name), at = i => names[Math.min(i, names.length - 1)];
  const list = names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  const where = place[1];
  return t.replace(/\{A\}/g, at(0)).replace(/\{B\}/g, at(1)).replace(/\{C\}/g, at(2)).replace(/\{list\}/g, list)
          .replace(/^\{place\}/, cap(where)).replace(/\{place\}/g, where);
}
function plotScene() {
  const plot = PLOTS[kind[1]], n = Math.min(story.scenes.length, plot.scenes.length - 1), sc = plot.scenes[n];
  const key = n ? story.history[n - 1].key : null, g3 = rankOf(story.level) >= 2;   // 3rd grade and up read the fuller text
  const defs = Array.isArray(sc.lines) ? sc.lines : [...(sc.lines[key] || []), ...sc.lines.common];
  const lines = defs.map(d => d[0] === N ? { who: NARRATOR, text: fill(g3 ? d[2] : d[1]), mood: 'neutral' } : { who: picked[d[0] % picked.length], text: fill(d[1]), mood: d[2] || 'neutral' });
  const emoji = [...picked.slice(0, 2).map(c => c.emoji), plot.emoji[n]];
  const all = lines.map(l => l.text).join(' ').toLowerCase();
  const words = Object.entries(plot.words).filter(([w]) => new RegExp('\\b' + w + '\\b').test(all)).map(([word, meaning]) => ({ word, meaning }));
  return { title: typeof sc.title === 'string' ? sc.title : sc.title[key], emoji, lines, summary: sc.summary, choices: sc.choices || [], end: !!sc.end, words };
}
function builtinScene() { return story.level === 'little' ? littleScene() : plotScene(); }

// ---------------------------------------------------------------------------
// Questions after the story. Each has exactly one right answer among three.
// ---------------------------------------------------------------------------
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mkQ(q, right, wrong) {
  const choices = shuffle([right, ...wrong.filter(w => w && w.toLowerCase() !== right.toLowerCase()).slice(0, 2)]);
  return { q, choices, answer: choices.indexOf(right) };
}
function cleanQuestions(qs) {
  if (!Array.isArray(qs)) return [];
  const out = [];
  for (const x of qs) {
    if (!x || typeof x.q !== 'string' || !Array.isArray(x.choices)) continue;
    const choices = x.choices.map(c => String(c || '').trim()).filter(Boolean);
    const a = Number(x.answer);
    if (choices.length < 2 || choices.length > 4 || !Number.isInteger(a) || a < 0 || a >= choices.length) continue;
    if (new Set(choices.map(c => c.toLowerCase())).size !== choices.length) continue;
    out.push(mkQ(x.q.trim(), choices[a], choices.filter((c, i) => i !== a)));

}
function storyQuestions() {
  const s = story, qs = [];
  const others = CAST.filter(c => !picked.includes(c) && c.id !== 'me');   // never offer her own name as a wrong answer
  qs.push(mkQ('Who was in the story?', pick(picked).name, shuffle(others).slice(0, 2).map(c => c.name)));
  qs.push(mkQ('Where did the story happen?', cap(place[1]), shuffle(PLACES.filter(p => p !== place)).slice(0, 2).map(p => cap(p[1]))));
  if (s.history.length && s.history[0].others.length) {
    const elsewhere = Object.values(PLOTS).flatMap(p => p.scenes.flatMap(sc => (sc.choices || []).map(c => c.label))).filter(l => !s.history.some(h => h.choice === l || h.others.includes(l)));

    // its JSON was not usable; with neither, the local questions stand in.
    const last = s.scenes[s.scenes.length - 1] || {}, out = [];
    if (last.reflect) out.push(last.reflect);
    if (last.check) out.push(last.check);
    return out.length ? out : qs.slice(0, 3);
  }
  if (s.ai) { const ai = s.scenes.flatMap(sc => sc.questions || []); return ai.length >= 4 ? ai.slice(0, 5) : ai.concat(qs).slice(0, 4); }   // topped up from the story itself
  const plot = PLOTS[kind[1]];
  for (const [q, a, w] of plot.questions) qs.push(mkQ(q, a, w));

  if (used.length) {
    const w = pick(used), wrong = shuffle(Object.entries(plot.words).filter(([k]) => k !== w.word).map(([, m]) => m));

}

// ---------------------------------------------------------------------------
// Telling it
// ---------------------------------------------------------------------------
async function start(sameFriends) {

}
// When the writer sends nothing usable (or cannot be reached), the child hears why and the built-in story takes over.
function writerResting() {

}
async function nextScene() {
  $('choices').classList.remove('on'); $('choices').innerHTML = ''; $('thinking').classList.add('on');
  let scene = null;
  try { scene = story.ai ? await writeScene() : builtinScene(); }
  catch (e) { console.warn('writer failed, using the built-in story', e); scene = null; }
  if (!scene) { writerResting(); scene = builtinScene(); }
  $('thinking').classList.remove('on');
  for (const w of (scene.words || [])) story.glossary[w.word.toLowerCase()] = w.meaning;
  story.scenes.push(scene); showScene(scene);
}
const bare = w => w.replace(/^[^\w']+|[^\w']+$/g, '');
function showScene(scene) {
  $('title').textContent = scene.title || '';
  const sc = $('scene'); sc.innerHTML = ''; for (const e of (scene.emoji || []).slice(0, 4)) { const s = document.createElement('span'); s.textContent = e; sc.appendChild(s); }
  const text = $('text'); text.innerHTML = '';
  scene.lines.forEach((l, i) => {
    const p = document.createElement('p'); if (l.who !== NARRATOR) { p.className = 'say'; const w = document.createElement('span'); w.className = 'who'; w.textContent = l.who.emoji; p.appendChild(w); }
    const body = document.createElement('span'); p.words = [];
    for (const word of l.text.split(' ')) {

      if (story.glossary[bare(word).toLowerCase()]) sp.classList.add('gw');
      sp.onclick = (e) => { e.stopPropagation(); tapWord(word, i); };

}
function highlight(line, word) {
  document.querySelectorAll('#text .w.hl').forEach(x => x.classList.remove('hl'));

}
// Tapping a word says it (and what it means, for a story word). Reading picks up again at the same line.
function tapWord(word, line) {

  story.reading = -2;
  $('popWord').textContent = w; $('popMeaning').textContent = meaning || ''; $('pop').classList.add('on');
  clearTimeout(tapWord.t); tapWord.t = setTimeout(() => $('pop').classList.remove('on'), meaning ? 4500 : 2000);

function readFrom(i, once) {

  const ps = $('text').children; [...ps].forEach((p, k) => p.classList.toggle('now', k === i));
  [...$('scene').children].forEach(s => s.classList.remove('now'));

  if (!once && i + 2 < scene.lines.length) VOICE.prefetch(scene.lines[i + 2].text, scene.lines[i + 2].who, scene.lines[i + 2].mood);
  ps[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    b.onclick = () => { VOICE.stop(); story.history.push({ title: scene.title, summary: scene.summary || scene.title, choice: c.label, key: c.key, others: scene.choices.filter(x => x !== c).map(x => x.label) }); say(c.label + '!'); nextScene(); };

  }

// The quiz: one question at a time, read aloud. A star for each one right on the first try.
let quiz = null;
function startQuiz() {
  const qs = storyQuestions();
  quiz = { qs, i: 0, first: 0, missed: false, scored: qs.filter(q => !q.reflect).length };
  if (!qs.length) { quiz.done = true; say('The end. Tap the dice for another story.'); return; }
  $('quiz').classList.add('on'); showQuestion();
  $('quiz').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function showQuestion() {
  const q = quiz.qs[quiz.i], box = $('qChoices'); quiz.missed = false;
  const scoredBefore = quiz.qs.slice(0, quiz.i).filter(x => !x.reflect).length;
  $('qNum').textContent = q.reflect ? 'Think about it' : `Question ${scoredBefore + 1} of ${quiz.scored}`; $('qText').textContent = q.q; box.innerHTML = '';
  q.choices.forEach((c, k) => {

    b.onclick = () => {

        b.classList.add('right'); [...box.children].forEach(x => x.disabled = true);
        say((q.replies && q.replies[k]) || pick(['That is a thoughtful choice.', 'Good thinking. There was no easy answer there.', 'I can see why you would do that.']));
        setTimeout(() => { quiz.i++; if (quiz.i < quiz.qs.length) showQuestion(); else endQuiz(); }, 2200);
        return;

        say(pick(['Yes! You got it.', 'That is right!', 'Great reading!']));
        setTimeout(() => { quiz.i++; if (quiz.i < quiz.qs.length) showQuestion(); else endQuiz(); }, 1400);
      } else { b.classList.add('wrong'); b.disabled = true; quiz.missed = true; say('Not quite. Think about the story and try again.'); }
    };

function endQuiz() {

  const line = quiz.scored ? `You got ${quiz.first} of ${quiz.scored} on the first try!` : 'Thank you for thinking it through.';

}
function showMode() { $('mode').textContent = selfRead ? '👀' : '👂'; $('mode').title = selfRead ? 'I read it myself (tap to have it read to you)' : 'Read to me (tap to read it yourself)'; }
$('mode').onclick = () => {

  say(selfRead ? 'You read it. Tap a word if you need help.' : 'I will read it to you.');
  const scene = story && story.scenes[story.scenes.length - 1];
  if (scene && !selfRead && !$('choices').classList.contains('on') && !scene.end) readFrom(0);

$('another').onclick = () => { VOICE.stop(); start(true); };

addEventListener('pointerdown', () => say('Story Maker! Who is in the story?'), { once: true });
const pickArgs = (ids, p, k, d, l, lv) => { picked = ids.map(id => CAST.find(c => c.id === id)); place = PLACES[p]; kind = KINDS[k]; drama = DRAMAS[d]; length = LENGTHS[l]; if (lv !== undefined) level = LEVELS[lv]; };
window.STORY = { cfg: CFG, CAST, PLACES, KINDS, LEVELS, RUNGS, PLOTS, get story() { return story; }, get quiz() { return quiz; }, start, pick: pickArgs, builtinScene, buildPrompt, parseScene, cleanReflect, storyQuestions, cleanQuestions, VOICE, setSelfRead: v => { selfRead = v; showMode(); } };

// ---------------------------------------------------------------------------
// Self-check hook for tools/ladder-check.mjs --drive. The words here are written by the model, so the check builds
// the prompt a rung would send, n times with a fresh draw of grade words and a random cast, place and scene, and
// checks each one: the system and user prompts are non-empty, every drawn word is in the text, the scene count is
// the rung's, the writer's reply shape is parsed, and nothing reads "undefined" or "NaN". Nothing on screen changes.
// ---------------------------------------------------------------------------
window.DucklingLadder = {
  levels: () => LEVELS.length,
  start: () => START,
  label: () => level[2],
  exercise: (i, n) => {
    const lv = LEVELS[i] && LEVELS[i][1]; if (!lv || !RUNGS[lv]) throw new Error('no rung ' + i);
    const R = RUNGS[lv], out = [];
    for (let k = 0; k < n; k++) {
      const cast = shuffle(CAST).slice(0, 1 + Math.floor(Math.random() * 3));
      const len = pick(LENGTHS), total = R.scenes[len[1]];
      const sceneNo = 1 + Math.floor(Math.random() * total);
      const history = []; for (let h = 1; h < sceneNo; h++) history.push({ title: 'Scene ' + h, summary: 'Something happened.', choice: 'Keep going' });
      const vocab = drawVocab(lv);
      if (vocab.length < 6 || vocab.length > 10 || new Set(vocab).size !== vocab.length) throw new Error('vocab draw ' + vocab.length);
      if (R.bank.length < 40) throw new Error('bank too small: ' + R.bank.length);
      const p = buildPrompt({ lv, cast, place: pick(PLACES), kind: pick(KINDS), drama: pick(DRAMAS), total, sceneNo, history, vocab });
      const all = p.system + '\n' + p.user;
      if (!p.system || !p.user || !(p.maxTokens > 0)) throw new Error('empty prompt');
      if (/\bundefined\b|\bNaN\b|\[object /.test(all)) throw new Error('bad text in prompt');
      if (!(total >= 3 && total <= 8) || !all.includes('Total scenes: ' + total)) throw new Error('scene count');
      for (const w of vocab) if (!all.includes(w)) throw new Error('missing word ' + w);
      if (sceneNo === total && (i >= 4) !== /"check"/.test(p.user)) throw new Error('check question guidance');
      if (!/Choices: /.test(p.user)) throw new Error('choice guidance');
      // The reply path: a well formed scene parses, a bad one is skipped instead of thrown.
      const good = parseScene('```json\n{"title":"t","lines":[{"who":"narrator","text":"Hi."}],"choices":[{"label":"Go on"},{"label":"Wait"}],"check":{"q":"Why?","choices":["a","b","c"],"answer":1},"reflect":{"q":"What would you do?","options":["x","y","z"]}}\n```');
      if (!good || cleanQuestions([good.check]).length !== 1 || !cleanReflect(good.reflect)) throw new Error('parse of a good reply');
      if (parseScene('{}') === null || parseScene('not json') !== null || cleanQuestions([{ q: 'x', choices: ['a'], answer: 0 }]).length || cleanReflect({ q: 'x', options: ['a'] })) throw new Error('parse of a bad reply');
      out.push(`${LEVELS[i][2]}: scene ${sceneNo} of ${total}, words ${vocab.join(' ')}`);
    }
    return out;
  }
};
